1:40.708 --> 04:11:41.914\nMi madre es el mar.\n\n1011\n04:11:44.750 --> 04:11:46.206\nMi padre es la tierra.\n\n1012\n04:11:47.500 --> 04:11:50.822\nMi nombre es tango...\nTango... tango.\n\n1013\n04:11:53.542 --> 04:11:55.373\nMi padre es el mar.\n\n1014\n04:12:11.625 --> 04:12:13.115\nTango...\n\n1015\n04:12:18.042 --> 04:12:21.580\nEsta es mi vida, el tango.\n\n1016\n04:12:31.500 --> 04:12:33.491\nMi padre es el mar.\n\n1017\n04:12:35.417 --> 04:12:38.033\nMi madre es la tierra.\n\n1018\n04:12:38.167 --> 04:12:39.998\nNo importa.\n\n1019\n04:12:40.125 --> 04:12:42.537\n¿Es mi vida...?\n\n1020\n04:12:43.750 --> 04:12:45.490\nTango.\n\n1021\n04:12:48.750 --> 04:12:50.456\n¡Tango!\n\n1022\n04:12:51.042 --> 04:12:52.782\nTango...\n\n1023\n04:13:05.500 --> 04:13:07.491\n¿Es mi vida...?\n\n1024\n04:13:13.250 --> 04:13:14.740\n¡Tango!\n\n1025\n04:13:22.167 --> 04:13:27.161\nmi madre es el mar\ny mi padre es la tierra.\n\n1026\n04:13:33.333 --> 04:13:37.576\nNi mar, ni tierra tampoco...\n\n1027\n04:13:38.917 --> 04:13:41.249\nVete a la mierda.\n\n1028\n04:13:43.375 --> 04:13:48.790\n¿Qué le has hecho al mar?\na la tierra?\n\n1029\n04:13:52.875 --> 04:13:55.537\nes mi vida,\n\n1030\n04:13:56.917 --> 04:13:58.407\ntangos...\n\n1031\n04:14:00.125 --> 04:14:03.788\n¿Tango, tango?\n\n1032\n04:14:05.375 --> 04:14:09.618\nMi madre es el mar...\n\n1033\n04:19:33.542 --> 04:19:35.032\nEso fue todo.\n\n1034\n04:20:55.833 --> 04:20:59.075\nAtraído por el tierno sonido\ndel acordeón\n\n1035\n04:20:59.208 --> 04:21:03.372\nlas arañas en el pub\nlanzó su último ataque\n\n1036\n04:21:03.500 --> 04:21:05.365\ncosieron telarañas sueltas\n\n1037\n04:21:05.500 --> 04:21:08.947\nen la parte superior de las gafas,\nlas tazas, los ceniceros,\n\n1038\n04:21:09.083 --> 04:21:12.200\nalrededor de las patas de las mesas\ny las sillas.\n\n1039\n04:21:12.333 --> 04:21:16.076\nLuego los unieron\ncon hilos secretos\n\n1040\n04:21:16.208 --> 04:21:20.781\npara que en sus rincones escondidos\n\n1041\n04:21:20.917 --> 04:21:25.115\nnotarían cada pequeño movimiento\ny cada pequeño movimiento\n\n1042\n04:21:25.250 --> 04:21:30.699\nhasta esta red casi invisible\nno se dañaría.\n\n1043\n04:21:30.833 --> 04:21:34.826\nCosieron una red a los durmientes.\nrostros, sus pies, sus manos.\n\n1044\n04:21:34.958 --> 04:21:38.121\nLuego se apresuró a regresar\npor sus escondites,\n\n1045\n04:21:38.250 --> 04:21:42.072\nesperando un hilo etéreo\npara moverse,\n\n1046\n04:21:42.208 --> 04:21:44.119\npara empezar todo de nuevo.\n\n1047\n04:21:45.417 --> 04:21:51.993\nIntermedio\n\n1048\n04:21:53.208 --> 04:22:01.208\nirimias hace un discurso\n\n1049\n04:23:24.958 --> 04:23:27.449\nEstoy en un estado de profunda emoción.\n\n1050\n04:23:28.333 --> 04:23:31.655\nComo puedes imaginar,\nEstoy totalmente confundido.\n\n1051\n04:23:33.542 --> 04:23:38.332\nEstoy desconcertado y consternado.\n\n1052\n04:23:39.625 --> 04:23:42.458\nSin embargo, debo recuperarme.\n\n1053\n04:23:43.875 --> 04:23:47.823\nAunque ahora todo lo que puedo decir\nes eso\n\n1054\n04:23:47.958 --> 04:23:51.906\nComparto este corazón roto.\nla miseria de la madre.\n\n1055\n04:23:53.542 --> 04:23:57.956\nEn el interminable de una madre\nluto y tristeza.\n\n1056\n04:23:59.250 --> 04:24:03.698\nEn el dolor de perder a aquel\nquien es más querido en nuestros corazones.\n\n1057\n04:24:05.250 --> 04:24:08.697\nEste trágico suceso nos pesa a todos\nabajo de tristeza.\n\n1058\n04:24:08.833 --> 04:24:13.122\nno creo que haya nadie\n¿Quién no estaría de acuerdo conmigo?\n\n1059\n04:24:16.167 --> 04:24:21.491\nY ahora lo más difícil es,\n\n1060\n04:24:21.625 --> 04:24:24.287\nen esta tristeza\ncon los dientes apretados,\n\n1061\n04:24:24.417 --> 04:24:28.581\npara conseguir nuestras mentes\nsobre el desamor,\n\n1062\n04:24:28.708 --> 04:24:33.873\npara desafiar nuestras lágrimas\ncuando nuestras voces nos fallan.\n\n1063\n04:24:34.000 --> 04:24:38.573\nPara y me gustaría llamar\nsu atención a esto,\n\n1064\n04:24:38.708 --> 04:24:42.747\nnada puede ser más importante\nque para nosotros reconstruir\n\n1065\n04:24:42.875 --> 04:24:49.872\nlos impactantes acontecimientos\nque le llevó a la terrible muerte\n\n1066\n04:24:50.000 --> 04:24:53.413\nde un niño inocente...\n\n1067\n04:24:55.500 --> 04:24:59.743\nAntes de que comience la policía\ninvestigando.\n\n1068\n04:25:01.750 --> 04:25:04.457\nSerá mejor que esperes\nque los inspectores del pueblo\n\n1069\n04:25:04.583 --> 04:25:09.156\nintentará hacernos los principales responsables\npor este terrible suceso.\n\n1070\n04:25:10.333 --> 04:25:13.655\nSí, amigos míos,\nnos van a culpar.\n\n1071\n04:25:13.792 --> 04:25:16.454\nPorque, para ser sincero...\n\n1072\n04:25:17.875 --> 04:25:23.040\nCon un poco de precaución,\ncuidado y atención,\n\n1073\n04:25:23.167 --> 04:25:25.499\npodríamos haberlo evitado.\n\n1074\n04:25:28.083 --> 04:25:31.496\nSólo imagina\nesta criatura vulnerable\n\n1075\n04:25:31.625 --> 04:25:34.947\nvagando toda la noche\nbajo la lluvia torrencial,\n\n1076\n04:25:35.083 --> 04:25:38.120\na merced del primero\ntranseúnte, del primer vagabundo,\n\n1077\n04:25:38.250 --> 04:25:39.865\nde cualquiera.\n\n1078\n04:25:40.708 --> 04:25:44.951\nella fue azotada por el viento\ntoda la noche,\n\n1079\n04:25:45.083 --> 04:25:48.405\ncayó presa fácil de los elementos.\n\n1080\n04:25:48.542 --> 04:25:54.208\nElla debe haber estado por aquí,\npreguntándome aquí todo el tiempo.\n\n1081\n04:25:54.333 --> 04:25:56.665\nElla pudo haber mirado\npor esta ventana\n\n1082\n04:25:56.792 --> 04:26:02.116\ny vi que estabas toda borracha\ny bailando alrededor.\n\n1083\n04:26:05.875 --> 04:26:10.448\nNo me malinterpretes, no quiero decir\nacusar a nadie personalmente.\n\n1084\n04:26:10.583 --> 04:26:12.164\nNo estoy acusando a la madre,\n\n1085\n04:26:12.292 --> 04:26:14.874\nquien nunca va\nperdonarse a sí misma\n\n1086\n04:26:15.000 --> 04:26:18.913\npor levantarse demasiado tarde\nen la mañana de ese terrible día.\n\n1087\n04:26:19.917 --> 04:26:23.114\nno estoy acusando\nel hermano de la víctima,\n\n1088\n04:26:23.250 --> 04:26:26.242\nni ningún otro miembro de la familia.\n\n1089\n04:26:26.375 --> 04:26:29.117\nEntonces no estoy acusando a nadie.\n\n1090\n04:26:29.250 --> 04:26:34.699\nPero déjame hacerte la pregunta,\n\n1091\n04:26:34.833 --> 04:26:38.075\n¿No somos todos culpables?\n\n1092\n04:26:41.875 --> 04:26:45.493\nPor supuesto, lo harás\nResponde que somos inocentes.\n\n1093\n04:26:45.625 --> 04:26:50.039\nPero entonces, ¿cómo llamamos\neste pobre niño?\n\n1094\n04:26:50.167 --> 04:26:52.749\n¿La víctima de los inocentes?\n\n1095\n04:26:52.875 --> 04:26:55.537\n¿El mártir de los impecables?\n\n1096\n04:26:55.667 --> 04:26:58.534\n¿Los masacrados de los sin pecado?\n\n1097\n04:27:00.792 --> 04:27:04.034\nPrefiero llamarla inocente.\n\n1098\n04:27:05.708 --> 04:27:10.702\nPasé la noche dando vueltas en mi cama\nhasta que me di cuenta de esto.\n\n1099\n04:27:12.917 --> 04:27:16.660\nNo sólo no sabemos\ncómo ocurrió el trágico suceso,\n\n1100\n04:27:16.792 --> 04:27:21.115\npero en realidad ni siquiera\nsaber qué pasó exactamente.\n\n1101\n04:27:22.583 --> 04:27:27.407\nestoy bastante convencido\nque este evento estaba destinado a suceder.\n\n1102\n04:27:27.542 --> 04:27:30.534\nAhora tú también pareces sospechar eso.\n\n1103\n04:27:31.333 --> 04:27:34.040\nNo basta, sin embargo,\nsospechar algo.\n\n1104\n04:27:34.167 --> 04:27:37.125\nlas cosas hay que entenderlas\n\n1105\n04:27:37.250 --> 04:27:40.822\ny dijo sin demora.\n\n1106\n04:27:40.958 --> 04:27:45.827\nte ha quedado bastante claro\nantes de venir aquí, pero estabas\n\n1107\n04:27:45.958 --> 04:27:49.496\ndemasiado miedo para decir\nque este patio estaba gobernado por la desgracia.\n\n1108\n04:27:49.625 --> 04:27:54.824\nNo te atreviste a hablar de eso.\nAhora puedes suponer con razón\n\n1109\n04:27:54.958 --> 04:28:00.123\nun juicio irrevocable\nllegará pronto.\n\n1110\n04:28:02.000 --> 04:28:05.117\nEstás encorvado\nen esta decadencia,\n\n1111\n04:28:05.250 --> 04:28:08.993\nlejos de todo\neso significa vida.\n\n1112\n04:28:09.125 --> 04:28:11.207\nTus planes fracasan,\n\n1113\n04:28:11.333 --> 04:28:14.780\ntus sueños, aún ciegos,\nestán destrozados.\n\n1114\n04:28:14.917 --> 04:28:18.739\nEsperas algún milagro\nque nunca llegará.\n\n1115\n04:28:19.708 --> 04:28:23.496\nPero que clase de desgracia\n¿Sois víctimas de?\n\n1116\n04:28:23.625 --> 04:28:27.948\n¿Es el yeso que se desmorona?\n\n1117\n04:28:28.083 --> 04:28:33.953\nlos techos sin tejas,\nlas paredes que se desmoronan,\n\n1118\n04:28:34.083 --> 04:28:38.827\nel sabor amargo nuestro amigo futaki\nsigue hablando?\n\n1119\n04:28:40.167 --> 04:28:42.658\n¿No son las perspectivas destrozadas?\n\n1120\n04:28:42.792 --> 04:28:45.659\ny sueños rotos,\n\n1121\n04:28:45.792 --> 04:28:51.207\nque doblan nuestras rodillas\ny adormecernos?\n\n1122\n04:28:52.958 --> 04:28:58.203\nNo te sorprendas si hablo con dureza,\npero seamos honestos.\n\n1123\n04:28:58.333 --> 04:29:00.870\nSi sintieras que el patio estaba gobernado\npor desgracia,\n\n1124\n04:29:01.000 --> 04:29:04.072\n¿Por qué no intentaste hacer?\nalgo al respecto?\n\n1125\n04:29:04.208 --> 04:29:08.952\nPensaste un pájaro en la mano\nVale más que dos en el monte.\n\n1126\n04:29:10.875 --> 04:29:12.957\nPero este es el camino de un cobarde.\n\n1127\n04:29:13.083 --> 04:29:20.740\nEs vergonzoso y descuidado.\ny tiene graves consecuencias.\n\n1128\n04:29:20.875 --> 04:29:25.414\nEsto se llama impotencia\nimpotencia pecaminosa.\n\n1129\n04:29:25.542 --> 04:29:29.239\nEsto es debilidad,\ndebilidad pecaminosa.\n\n1130\n04:29:29.375 --> 04:29:33.197\nEsto es cobardía\ncobardía pecaminosa.\n\n1131\n04:29:35.792 --> 04:29:40.365\nPorque, y tenlo en cuenta,\n\n1132\n04:29:40.500 --> 04:29:43.947\nno es sólo a los demás a quienes podemos\nhacer cosas imperdonables,\n\n1133\n04:29:44.083 --> 04:29:46.870\nsino también a nosotros mismos.\n\n1134\n04:29:47.000 --> 04:29:50.697\nY esto, amigos míos,\nEs aún más grave.\n\n1135\n04:29:50.833 --> 04:29:55.327\nSí, cuando lo piensas,\ntodo tipo de vileza\n\n1136\n04:29:55.458 --> 04:29:59.280\nSon pecados contra nosotros mismos.\n\n1137\n04:30:01.333 --> 04:30:05.997\nY ya saben, amigos míos,\nsi pienso en retrospectiva\n\n1138\n04:30:06.125 --> 04:30:10.869\ny verte tirado medio muerto\nen las sillas y mesas,\n\n1139\n04:30:11.000 --> 04:30:14.697\nuno encima del otro,\n\n1140\n04:30:14.833 --> 04:30:19.247\nregateando, exhausto,\n\n1141\n04:30:19.375 --> 04:30:22.867\nmi corazón se hunde\ny no puedo juzgarte,\n\n1142\n04:30:23.000 --> 04:30:27.164\nporque nunca podré\npara olvidar esto.\n\n1143\n04:30:28.708 --> 04:30:33.407\nDe tu jadeo,\nroncando y gimiendo,\n\n1144\n04:30:33.542 --> 04:30:38.206\nEscuché tu grito de ayuda\nque tengo que responder.\n\n1145\n04:30:39.250 --> 04:30:41.662\nNos conocemos bien.\n\n1146\n04:30:41.792 --> 04:30:45.740\nHe estado manteniendo mis ojos\nabierta desde hace décadas en todas partes.\n\n1147\n04:30:45.875 --> 04:30:47.206\nObservo amargamente que,\n\n1148\n04:30:47.333 --> 04:30:51.406\nbajo el espeso velo\nde engaños y engaños,\n\n1149\n04:30:51.542 --> 04:30:52.748\nnada ha cambiado.\n\n1150\n04:30:52.875 --> 04:30:57.619\nLa miseria ha seguido siendo miseria.\n\n1151\n04:30:57.750 --> 04:30:59.991\nLas dos cucharadas extra de comida\npodemos tener\n\n1152\n04:31:00.125 --> 04:31:03.617\nsólo hace que el aire sea más fino\ndelante de nuestras bocas.\n\n1153\n04:31:05.000 --> 04:31:08.868\npero me di cuenta\nLo que he hecho hasta ahora es nada.\n\n1154\n04:31:09.000 --> 04:31:12.322\nSe necesita una solución mucho más profunda.\n\n1155\n04:31:12.458 --> 04:31:16.497\nEntonces, aprovechando la oportunidad,\n\n1156\n04:31:16.625 --> 04:31:18.957\nyo decidí\n\n1157\n04:31:20.792 --> 04:31:23.204\npara reunir a algunas personas\n\n1158\n04:31:23.333 --> 04:31:28.282\ny montar una granja modelo,\nlo que garantizará una vida estable,\n\n1159\n04:31:28.417 --> 04:31:33.036\ny unir a este pequeño grupo\nde los desposeídos juntos.\n\n1160\n04:31:33.167 --> 04:31:36.489\nestoy creando una isla\n\n1161\n04:31:36.625 --> 04:31:38.866\ndonde nadie es impotente,\n\n1162\n04:31:39.000 --> 04:31:42.993\ndonde todos vivirán en paz,\n\n1163\n04:31:43.125 --> 04:31:46.367\ny nos sentiremos seguros como seres humanos.\n\n1164\n04:31:46.500 --> 04:31:50.664\nPor eso me fui\npara la mansión en almas.\n\n1165\n04:31:50.792 --> 04:31:52.657\nEl edificio principal\nestá en buenas condiciones,\n\n1166\n04:31:52.792 --> 04:31:55.829\nel contrato de alquiler\nes una cuestión sencilla.\n\n1167\n04:31:55.958 --> 04:31:58.119\nSólo hay un problema...\n\n1168\n04:31:58.875 --> 04:32:01.082\nNo sirve de nada intentarlo\npara mantenerlo en secreto para ti...\n\n1169\n04:32:02.083 --> 04:32:03.573\nEl dinero.\n\n1170\n04:32:03.708 --> 04:32:07.121\nSin un centavo,\ntodo está muerto.\n\n1171\n04:32:07.958 --> 04:32:12.657\nSe necesita capital para la producción,\npero esto es un poco complicado.\n\n1172\n04:32:12.792 --> 04:32:15.283\nno tiene sentido\nal entrar en detalles.\n\n1173\n04:32:17.875 --> 04:32:21.948\nY lo entenderás\nlas circunstancias de nuestro encuentro\n\n1174\n04:32:22.083 --> 04:32:27.498\nme hizo sentir inseguro,\nsi serías capaz de hacerlo.\n\n1175\n04:32:27.625 --> 04:32:34.030\nSi serías capaz\npara ofrecer el poco dinero,\n\n1176\n04:32:34.167 --> 04:32:38.957\nel resultado de tu trabajo extra duro\ny muchas dificultades,\n\n1177\n04:32:39.083 --> 04:32:42.575\nentregar por una idea apresurada.\n\n1178\n04:32:42.708 --> 04:32:45.450\nPiénselo.\n\n1179\n04:32:45.583 --> 04:32:49.997\nCalma tus pensamientos.\nNo decidas de inmediato.\n\n1180\n04:32:50.875 --> 04:32:53.412\nPero si el destino decide\n\n1181\n04:32:53.542 --> 04:32:56.830\nque de ahora en adelante\npermanecemos juntos,\n\n1182\n04:32:56.958 --> 04:32:59.574\ninseparables,\n\n1183\n04:32:59.708 --> 04:33:03.030\nrecuerda el precio\nque ha sido pagado.\n\n1184\n04:33:03.167 --> 04:33:06.159\nNo te olvides del niño...\n\n1185\n04:33:09.125 --> 04:33:14.119\n¿Quién pudo haber tenido que perecer?\npor la misma razón\n\n1186\n04:33:14.250 --> 04:33:18.072\npara que nuestra estrella finalmente pudiera salir.\n\n1187\n04:33:20.333 --> 04:33:23.166\n¿Quién sabe, amigos míos?\n\n1188\n04:33:26.167 --> 04:33:28.158\nLo único que sabemos con certeza es...\n\n1189\n04:33:29.958 --> 04:33:32.950\nEsa vida es muy dura para nosotros.\n\n1190\n04:35:51.500 --> 04:35:59.500\nLa perspectiva, vista desde el frente.\n\n1191\n04:36:29.458 --> 04:36:33.872\nTe dije que no debería haberlo hecho\nsido tomado del instituto.\n\n1192\n04:36:52.583 --> 04:36:55.245\nno sé por qué\nla sacaste.\n\n1193\n04:39:53.875 --> 04:39:56.241\nAmigos,\n\n1194\n04:39:56.375 --> 04:39:58.286\nlas palabras me fallan\n\n1195\n04:39:58.417 --> 04:40:02.660\nahora que te dejo ir\nen tu camino.\n\n1196\n04:40:04.083 --> 04:40:06.950\nEs difícil de describir\nla forma en que me siento.\n\n1197\n04:40:07.083 --> 04:40:11.076\nPor qué podría decir...\n\n1198\n04:40:11.917 --> 04:40:16.661\nDe tu entusiasmo,\ntu generosidad...\n\n1199\n04:40:18.458 --> 04:40:21.450\npor el bien\nde nuestra prosperidad común?\n\n1200\n04:40:22.625 --> 04:40:27.244\nDe esa cosa preciosa\nme diste,\n\n1201\n04:40:27.375 --> 04:40:29.331\ntu confianza.\n\n1202\n04:40:29.458 --> 04:40:31.870\n¿Qué más podría decir?\n\n1203\n04:40:32.000 --> 04:40:35.697\npero que todo esto me da coraje\ny me impone una responsabilidad especial\n\n1204\n04:40:35.833 --> 04:40:40.497\nque me gustaría cumplir\nlo mejor que pude.\n\n1205\n04:40:43.083 --> 04:40:45.699\nTu entusiasmo y confianza\n\n1206\n04:40:45.833 --> 04:40:49.325\nme da confianza\ny entusiasta.\n\n1207\n04:40:51.958 --> 04:40:54.199\nestoy pensando en el futuro\ncompartiremos.\n\n1208\n04:40:55.292 --> 04:40:57.157\nAdiós, amigos míos.\n\n1209\n04:40:58.958 --> 04:41:02.951\nNos vemos mañana a las 6 am\nen la mansión de almas.\n\n1210\n04:41:04.708 --> 04:41:07.950\nadelante\ny pensar en el futuro.\n\n1211\n04:41:10.667 --> 04:41:15.081\nDe ahora en adelante tu,\nmis amigos, son libres.\n\n1212\n04:42:10.833 --> 04:42:15.202\nY estabas jodido\n¡Quieres decir mierda!\n\n1213\n04:42:15.333 --> 04:42:18.700\nQue se jodan, bastardos.\n\n1214\n04:42:18.833 --> 04:42:21.996\nVayan a la mierda. ¡Vete a la mierda!\n\n1215\n04:42:22.125 --> 04:42:24.116\n¡Vete a la mierda!\n\n1216\n04:42:34.750 --> 04:42:36.581\n¡Vete a la mierda!\n\n1217\n04:43:13.667 --> 04:43:16.955\n¿Ves lo que has hecho?\nLa persona engreída que eras.\n\n1218\n04:43:17.083 --> 04:43:21.656\n- Mantén la boca cerrada, ¿vale?\n- Ahí estás.\n\n1219\n04:43:26.083 --> 04:43:29.655\nDeja de alardear y vete al infierno.\nSólo vete a casa.\n\n1220\n04:43:29.792 --> 04:43:32.659\n- Ah, sí, una vez arriba y otra abajo.\n- Vete a casa, ¿quieres?\n\n1221\n04:43:32.792 --> 04:43:36.284\nHe estado diciendo, uno siempre lo ha hecho\ntener respeto por uno mismo.\n\n1222\n04:43:36.417 --> 04:43:40.706\nYa has terminado.\nPuedes cerrar.\n\n1223\n04:43:40.833 --> 04:43:43.324\nVete a casa, ¿quieres?\n\n1224\n04:43:43.458 --> 04:43:44.948\nMe dejo en paz.\n\n1225\n04:43:45.083 --> 04:43:48.371\nMi marido era igual\nno sabía qué era lo correcto.\n\n1226\n04:43:48.500 --> 04:43:52.914\n¿Y dónde acabó?\nBalanceándose de una cuerda en el granero.\n\n1227\n04:43:55.042 --> 04:44:00.366\nVete a casa, deja de molestarme.\nPreocúpate por ti mismo.\n\n1228\n04:44:07.750 --> 04:44:11.493\nVe a buscar a tus hijas en su lugar.\no podrían ir con ellos también.\n\n1229\n04:44:13.458 --> 04:44:16.825\n- Nunca lo harán. Están encerrados.\n- Paga tus bebidas y listo.\n\n1230\n04:44:16.958 --> 04:44:19.370\nno me dejarán\ncomo lo hizo estike.\n\n1231\n04:44:21.125 --> 04:44:24.663\nCuando salen del patio,\nirán a cavar la tierra.\n\n1232\n04:44:24.792 --> 04:44:26.453\nVete a casa ahora.\n\n1233\n04:44:27.417 --> 04:44:28.827\nIr.\n\n1234\n04:44:44.958 --> 04:44:46.789\nAhora, vete, vete.\n\n1235\n04:52:02.500 --> 04:52:07.073\n- ¿Lo terminaste?\n- No quiero dejárselo a los gitanos.\n\n1236\n04:53:07.167 --> 04:53:11.285\nEl viento sopla las nubes.\n\n1237\n04:53:11.417 --> 04:53:15.660\ndetrás del cielo arde\n\n1238\n04:53:15.792 --> 04:53:20.286\ndame, querida,\ntu manita\n\n1239\n04:53:20.417 --> 04:53:24.660\ndios sabe si te volveré a ver\n\n1240\n04:53:24.792 --> 04:53:28.660\nsi te tendré en mis brazos\n\n1241\n04:53:28.792 --> 04:53:33.286\nsi te besaré, querida\n\n1242\n04:53:33.417 --> 04:53:41.417\nsolo dios sabe el dia\n11 serán enviados\n\n1243\n04:53:42.083 --> 04:53:46.122\nsi te abrazaré...\n\n1244\n04:54:51.125 --> 04:54:56.700\nEres encantadora\neres justo, Hungría\n\n1245\n04:56:01.583 --> 04:56:05.280\nAmigos. Nos olvidamos del médico.\n\n1246\n04:56:05.417 --> 04:56:07.499\nNo importa el médico.\n\n1247\n04:56:10.417 --> 04:56:13.739\nseguramente hubiera venido\npero no se lo mencioné.\n\n1248\n04:56:17.250 --> 04:56:20.322\nVamos, no podría durar.\neste largo viaje.\n\n1249\n04:56:22.250 --> 04:56:24.457\nPero ahora se va a morir de hambre.\n\n1250\n04:56:24.583 --> 04:56:28.155\nNi siquiera puede arreglarlo\ncon el dueño del pub.\n\n1251\n04:56:29.500 --> 04:56:31.491\nEntonces déjalo morir de hambre.\n\n1252\n04:56:36.958 --> 04:56:44.114\nNo me importa el doctor, si faltas\ntanto, vuelve por él.\n\n1253\n04:56:54.083 --> 04:56:57.405\nHace meses que no lo veo.\n\n1254\n04:56:57.542 --> 04:57:00.124\nNo hay necesidad de llorar por él.\n\n1255\n04:57:01.583 --> 04:57:07.829\nÉl está bien. Se enoja todos los días\nluego se va a roncar.\n\n1256\n04:57:13.250 --> 04:57:17.243\nNo me importaría sentir\nLa parte de su madre en mi bolsillo.\n\n1257\n04:57:39.250 --> 04:57:40.740\n¿Estamos todos aquí?\n\n1258\n04:57:41.875 --> 04:57:44.457\n¿Nadie se queda atrás?\n\n1259\n04:58:56.833 --> 04:58:58.824\n¡Lo hemos logrado!\n\n1260\n04:58:59.708 --> 04:59:02.120\nAl menos lo hemos hecho.\n\n1261\n04:59:56.208 --> 05:00:00.451\nhas venido bien preparado\npara esta nueva vida.\n\n1262\n05:00:00.583 --> 05:00:03.746\nVamos, lajos,\nHabrá mucho más de eso.\n\n1263\n05:07:52.167 --> 05:07:56.160\n¿Cómo podrían esos pobres tipos\ncalentar todo esto?\n\n1264\n05:18:43.167 --> 05:18:48.992\n¿No te lo dije?\nNunca debemos desanimarnos\n\n1265\n05:18:50.083 --> 05:18:54.998\ntenemos que tener confianza\nhasta nuestro último aliento.\n\n1266\n05:18:55.125 --> 05:18:58.947\nDe lo contrario, ¿qué sería de nosotros?\n\n1267\n05:18:59.083 --> 05:19:01.495\nDime, ¿qué?\n\n1268\n05:19:05.875 --> 05:19:08.207\nMe lo puedo imaginar.\n\n1269\n05:19:11.000 --> 05:19:14.413\nHas visto los edificios exteriores...\n\n1270\n05:19:16.167 --> 05:19:18.328\nHay alrededor de cinco de ellos.\n\n1271\n05:19:21.500 --> 05:19:25.163\nApuesto los talleres\nvan a estar ahí?\n\n1272\n05:19:31.958 --> 05:19:36.281\n¿Talleres? ¿Qué talleres?\n\n1273\n05:19:38.958 --> 05:19:44.373\nPor favor, cállate. mi marido\nya está dormido. Quiere tranquilidad.\n\n1274\n05:19:47.417 --> 05:19:51.990\nEstá bien, está bien.\n¿No podemos simplemente hablar?\n\n1275\n05:20:09.417 --> 05:20:12.329\nCreo que será al revés:\n\n1276\n05:20:14.083 --> 05:20:18.281\nViviremos en ellos\n\n1277\n05:20:18.417 --> 05:20:20.829\ny los talleres estarán aquí.\n\n1278\n05:20:20.958 --> 05:20:24.371\n¿No te quedarás callado?\nAquí nadie puede descansar.\n\n1279\n05:20:33.083 --> 05:20:34.914\n¿Quién era ese?\n\n1280\n05:20:36.417 --> 05:20:40.239\nDéjame en paz. No fui yo.\n\n1281\n05:20:42.792 --> 05:20:45.784\n¿Nadie quiere reconocerlo?\n\n1282\n05:20:49.083 --> 05:20:50.573\nMira,\n\n1283\n05:20:50.708 --> 05:20:55.281\nEstaré de acuerdo con lo que quieras,\nsólo quédate callado.\n\n1284\n05:21:01.417 --> 05:21:03.032\nEscucha,\n\n1285\n05:21:03.167 --> 05:21:07.991\nsi todos trabajan duro,\nYo digo, sólo un mes.\n\n1286\n05:21:12.250 --> 05:21:16.072\nTenemos grandes perspectivas\npara el futuro.\n\n1287\n05:21:21.500 --> 05:21:26.449\nmañana lo sabremos\nlo que irimias planea hacer.\n\n1288\n05:21:29.958 --> 05:21:31.994\nMañana.\n\n1289\n05:22:20.625 --> 05:22:24.413\nHalics fue perseguido\npor un jorobado con un ojo de cristal.\n\n1290\n05:22:24.542 --> 05:22:28.205\nY después de todo tipo de pruebas\nhuyó a un río\n\n1291\n05:22:28.333 --> 05:22:30.915\npero empezó a desanimarse\n\n1292\n05:22:31.042 --> 05:22:34.705\ncada vez que venía para llegar,\n\n1293\n05:22:34.833 --> 05:22:39.372\nel hombrecito inmediatamente se golpeó la cabeza\ncon un palo largo.\n\n1294\n05:22:39.500 --> 05:22:42.663\nY cada vez que gritaba,\n\n1295\n05:22:42.792 --> 05:22:45.124\n\"ahora vas a pagar por ello\".\n\n1296\n05:22:52.208 --> 05:22:55.871\nEl maestro de escuela persuadió\nun hombre vestido con un traje viejo\n\n1297\n05:22:56.000 --> 05:23:00.118\npara ir con el\nen algún lugar que él conozca.\n\n1298\n05:23:00.250 --> 05:23:04.573\nEl hombre está de acuerdo,\ncomo alguien que no puede decir que no.\n\n1299\n05:23:04.708 --> 05:23:06.289\nDifícilmente podía controlarse\n\n1300\n05:23:06.417 --> 05:23:09.159\ny cuando se volvieron\na un parque desierto,\n\n1301\n05:23:09.292 --> 05:23:11.203\nincluso lo empujó\n\n1302\n05:23:11.333 --> 05:23:16.032\npara llegar más rápido a un banco\nque estaba rodeada de arbustos.\n\n1303\n05:23:16.167 --> 05:23:19.204\nHizo que el hombre se acostara\ny saltó sobre él\n\n1304\n05:23:19.333 --> 05:23:21.699\ny lo besó en el cuello.\n\n1305\n05:23:21.833 --> 05:23:26.076\nPero segundos después aparecieron los médicos.\nen el camino vestida de blanco.\n\n1306\n05:23:26.208 --> 05:23:29.700\nAvergonzado, los saludó con la mano.\nque iba,\n\n1307\n05:23:29.833 --> 05:23:33.496\npero empezó a reprocharle\nel hombrecito confundido,\n\n1308\n05:23:33.625 --> 05:23:37.117\nporque para entonces,\nParecía odiarlo tanto.\n\n1309\n05:23:44.250 --> 05:23:47.947\nEl suelo tembló\nbajo los pies de Schmidt\n\n1310\n05:23:48.083 --> 05:23:51.371\ncomo si estuviera caminando\nen los páramos.\n\n1311\n05:23:51.500 --> 05:23:54.287\nSe subió a un árbol,\n\n1312\n05:23:54.417 --> 05:23:58.410\npero sintió que también comenzaba a hundirse.\n\n1313\n05:23:59.792 --> 05:24:01.123\nLuego estaba acostado en la cama.\n\n1314\n05:24:01.250 --> 05:24:04.162\ntratando de conseguir el camisón\nde su esposa.\n\n1315\n05:24:04.292 --> 05:24:06.783\nPero ella empezó a gritar.\n\n1316\n05:24:06.917 --> 05:24:10.830\nsaltó tras ella,\nel camisón estaba hecho.\n\n1317\n05:24:10.958 --> 05:24:14.871\nElla se volvió hacia él\ny se rió\n\n1318\n05:24:15.000 --> 05:24:17.662\ny los pezones\nsobre sus enormes pechos\n\n1319\n05:24:17.792 --> 05:24:20.784\nEran como dos hermosas rosas.\n\n1320\n05:24:48.000 --> 05:24:50.662\nLa señora halics estaba lavando\nLa señora Schmidt ha vuelto.\n\n1321\n05:24:50.792 --> 05:24:57.038\ny el rosario en el borde de la tina\nSe deslizó en el agua como una serpiente.\n\n1322\n05:24:57.167 --> 05:24:59.749\nschmidt dijo que ya tenía suficiente,\n\n1323\n05:24:59.875 --> 05:25:02.332\nque su piel ardía\ndel fregado\n\n1324\n05:25:02.458 --> 05:25:04.540\npero la señora halics la empujó\nvolver info el baño\n\n1325\n05:25:04.667 --> 05:25:08.114\ny siguió frotándole la espalda\nporque dijo que tenia miedo\n\n1326\n05:25:08.250 --> 05:25:11.242\nesa señora schmidt\nno estaría satisfecho con ella\n\n1327\n05:25:30.458 --> 05:25:33.780\nLa señora Kraner escuchó\nun ruido de afuera\n\n1328\n05:25:33.917 --> 05:25:36.829\npero ella no lo sabía\n¿Qué pasaría si pudiera ser?\n\n1329\n05:25:36.958 --> 05:25:41.907\nella se puso un abrigo de piel\ny se fue al cobertizo de máquinas.\n\n1330\n05:25:42.042 --> 05:25:46.285\nCasi había llegado a la carretera.\ncuando tuvo un mal presentimiento.\n\n1331\n05:25:46.417 --> 05:25:51.582\nElla se giró y vio\nque el petimetre de su casa estaba en llamas.\n\n1332\n05:25:51.708 --> 05:25:55.997\n\"La leña cortada. Cristo,\n¡Dejé la madera cortada afuera!\n\n1333\n05:25:56.125 --> 05:26:00.323\n\"¡Cielos!\" ella gritó,\ny volvió corriendo\n\n1334\n05:26:00.458 --> 05:26:07.034\nKraner estaba sentado a la mesa,\ncomiendo tranquilamente.\n\n1335\n05:26:07.917 --> 05:26:12.456\n'Joska, ¿estás loco?\n¡La casa está en llamas!\n\n1336\n05:26:12.583 --> 05:26:15.746\nPero Kraner no se movió.\n\n1337\n05:26:23.292 --> 05:26:28.662\nLa señora Schmidt era un pájaro.\nvolando sobre las nubes, felizmente.\n\n1338\n05:26:28.792 --> 05:26:31.989\nElla vio que alguien ahí abajo\nla estaba saludando.\n\n1339\n05:26:32.125 --> 05:26:35.868\nella bajó un poco\ny oí gritar a schmidt.\n\n1340\n05:26:36.000 --> 05:26:39.663\n\"¿Por qué no cocinaste nada, perra?\nBaja aquí ahora mismo”.\n\n1341\n05:26:39.792 --> 05:26:44.912\nPero ella voló sobre él\ny tuiteó: \"mañana\".\n\n1342\n05:26:45.042 --> 05:26:48.000\n\"No morirás de hambre hasta entonces\".\n\n1343\n05:26:48.125 --> 05:26:50.741\nElla sintió el calor\ndel sol en su espalda,\n\n1344\n05:26:50.875 --> 05:26:53.116\nLuego voló más cerca del suelo.\n\n1345\n05:26:53.250 --> 05:26:56.322\nElla quería atrapar un insecto.\n\n1346\n05:27:00.792 --> 05:27:03.750\nLos hombros de Futaki fueron golpeados.\ncon una barra de hierro\n\n1347\n05:27:03.875 --> 05:27:08.699\nno podía moverse,\nestaba atado a un árbol.\n\n1348\n05:27:08.833 --> 05:27:13.327\nel se estiró\ny sintió que la cuerda se aflojaba.\n\n1349\n05:27:13.458 --> 05:27:17.747\nMiró sus hombros\ny vio una larga herida,\n\n1350\n05:27:17.875 --> 05:27:22.289\nLuego giró la cabeza,\ncomo no soportaba verlo\n\n1351\n05:27:24.167 --> 05:27:25.907\nestaba sentado en una excavadora,\n\n1352\n05:27:26.042 --> 05:27:29.455\nla pala estaba sacando\nun enorme agujero.\n\n1353\n05:27:29.583 --> 05:27:31.494\nUn hombre se le acercó y le dijo:\n\n1354\n05:27:31.625 --> 05:27:36.164\n\"date prisa que no te daré\n\"Más gasolina, digas lo que digas\".\n\n1355\n05:27:36.292 --> 05:27:40.410\nPero fue inútil recoger,\nporque la tierra seguía cayendo.\n\n1356\n05:27:40.542 --> 05:27:43.864\nLo intentó de nuevo pero fracasó.\n\n1357\n05:27:45.000 --> 05:27:46.831\nLuego lloró\n\n1358\n05:27:49.125 --> 05:27:51.207\nél estaba sentado en la ventana\ndel cobertizo del motor\n\n1359\n05:27:51.333 --> 05:27:55.952\ny no sabía si era\namanecer o atardecer.\n\n1360\n05:27:56.083 --> 05:27:59.951\ntodo el asunto\nsimplemente no quería terminar.\n\n1361\n05:28:00.083 --> 05:28:02.825\nÉl estaba sentado\nsin saber la hora del día,\n\n1362\n05:28:02.958 --> 05:28:04.368\ny nada cambió afuera.\n\n1363\n05:28:04.500 --> 05:28:06.991\nLa mañana no llegó\nla noche no cayó,\n\n1364\n05:28:07.125 --> 05:28:11.789\naay estaba empezando a romperse\no la noche comenzaba a caer.\n\n1365\n05:29:33.875 --> 05:29:41.875\n¿Visión celestial? ¿Alucinaciones?\n\n1366\n05:29:46.958 --> 05:29:48.323\nAmigos.\n\n1367\n05:29:48.458 --> 05:29:53.657\nLas palabras me fallan, ahora que llegó el momento\ny te dejo seguir tu propio camino.\n\n1368\n05:29:56.125 --> 05:29:58.787\nEs difícil de describir\nla forma en que me siento.\n\n1369\n05:29:58.917 --> 05:30:03.160\n¿Qué puedo decir?\n\n1370\n05:30:03.292 --> 05:30:08.286\nsobre tu entusiasmo,\ntu generosidad...\n\n1371\n05:30:09.750 --> 05:30:12.492\npor el bien\nde nuestra prosperidad común.\n\n1372\n05:30:13.958 --> 05:30:18.622\nEsa cosa preciosa que me diste,\n\n1373\n05:30:18.750 --> 05:30:20.741\ntu confianza.\n\n1374\n05:30:22.208 --> 05:30:24.369\n¿Qué más podría decir sino\n\n1375\n05:30:24.500 --> 05:30:28.163\nque todo esto me da coraje,\nme impone una gran responsabilidad,\n\n1376\n05:30:28.292 --> 05:30:32.706\nque me gustaría aceptar\ny hago lo mejor que puedo.\n\n1377\n05:30:35.042 --> 05:30:37.533\ny que tu entusiasmo\ny confianza\n\n1378\n05:30:37.667 --> 05:30:41.239\nme da confianza\ny entusiasta.\n\n1379\n05:30:42.917 --> 05:30:45.408\nestoy pensando en el futuro\ncompartiremos.\n\n1380\n05:30:47.833 --> 05:30:49.789\nAdiós, queridos amigos.\n\n1381\n05:30:49.917 --> 05:30:53.409\nNos vemos mañana a las 6 am\nen la mansión de almas.\n\n1382\n05:30:54.375 --> 05:30:57.367\nVe ahora y piensa en el futuro.\ncompartiremos.\n\n1383\n05:30:58.750 --> 05:31:02.743\nA partir de ahora eres libre.\n\n1384\n05:31:40.833 --> 05:31:46.123\nY estás jodido\n¡Quieres decir mierda!\n\n1385\n05:31:46.250 --> 05:31:51.074\nVete a la mierda. ¡Bastardos!\nVayan a la mierda. ¡Vete a la mierda!\n\n1386\n05:32:05.125 --> 05:32:08.743\nEstoy cagado de miedo, hombre.\n\n1387\n05:32:08.875 --> 05:32:12.993\n¿Cómo salimos de esto?\n\n1388\n05:32:13.125 --> 05:32:16.367\nMe sorprendería si no lo estuvieras\ncagándote en los pantalones.\n\n1389\n05:32:16.500 --> 05:32:18.365\n¿Quieres un poco de papel?\n\n1390\n05:32:18.500 --> 05:32:22.994\nEsto no es una puta broma.\nes jodidamente serio.\n\n1391\n05:32:24.292 --> 05:32:29.332\nyo no diría\nEstoy a punto de reírme.\n\n1392\n05:32:29.458 --> 05:32:31.699\nBasta, ¿quieres?\n\n1393\n05:32:34.792 --> 05:32:38.364\n¿Te sorprendería?\nsi dijera que ha llegado nuestro momento?\n\n1394\n05:32:39.375 --> 05:32:43.744\n¿Qué diablos?\n¿Estás llegando?\n\n1395\n05:32:43.875 --> 05:32:47.663\nEscuche a la vieja petrina esta vez.\n\n1396\n05:32:47.792 --> 05:32:51.080\nMira, tomemos el primer tren.\n\n1397\n05:32:51.208 --> 05:32:53.324\ny lárgate de aquí.\n\n1398\n05:32:53.458 --> 05:32:55.824\nvamos a conseguir\nen un gran problema\n\n1399\n05:32:55.958 --> 05:32:58.916\nsi se dan cuenta de lo que está pasando.\n\n1400\n05:32:59.042 --> 05:33:00.873\nCallarse la boca.\n\n1401\n05:33:09.667 --> 05:33:12.033\n¿No ves?\nque somos partidistas\n\n1402\n05:33:12.167 --> 05:33:17.332\nen este persistente y desesperado\n¿Luchar por la dignidad humana?\n\n1403\n05:33:21.833 --> 05:33:23.994\nPetrina, ha llegado nuestro momento.\n\n1404\n05:33:24.125 --> 05:33:25.786\nNuestro momento ha llegado.\n\n1405\n05:33:25.917 --> 05:33:30.411\nSigues diciendo esto\n\"Ha llegado nuestro momento\".\n\n1406\n05:33:30.542 --> 05:33:33.579\nNuestro tiempo nunca llegará.\n\n1407\n05:33:37.750 --> 05:33:39.581\nY ahí estamos.\n\n1408\n05:33:49.250 --> 05:33:52.822\nLa web... ¿no lo entiendes?\n\n1409\n05:33:54.667 --> 05:33:58.080\nLa telaraña nacional de Irimías.\n\n1410\n05:33:59.542 --> 05:34:02.705\n¿Tu mente aburrida se está aclarando?\n\n1411\n05:34:09.625 --> 05:34:12.287\nDonde algo se mueve...\n\n1412\n05:37:38.125 --> 05:37:39.865\nContinúe.\n\n1413\n05:38:05.417 --> 05:38:08.159\nNunca has visto niebla\nantes o que?\n\n1414\n05:39:54.833 --> 05:39:58.075\nlos caballos se escaparon\ndel matadero otra vez.\n\n1415\n05:40:02.708 --> 05:40:04.869\n¿A quién apoyas?\n\n1416\n05:40:08.750 --> 05:40:10.331\nMí mismo.\n\n1417\n05:42:31.292 --> 05:42:33.123\n¿Cómo estás?\n\n1418\n05:42:33.750 --> 05:42:35.240\nBien.\n\n1419\n05:42:43.292 --> 05:42:47.456\nNo has cambiado en absoluto.\n\n1420\n05:42:47.583 --> 05:42:49.995\n¿Qué pasa contigo?\n\n1421\n05:42:50.125 --> 05:42:52.036\nNada especial.\n\n1422\n05:42:52.167 --> 05:42:53.577\nPensé...\n\n1423\n05:42:53.708 --> 05:42:56.700\nDos licores de ron\ny una copa de vino.\n\n1424\n05:43:07.917 --> 05:43:09.578\nAquí tiene.\n\n1425\n05:43:11.958 --> 05:43:13.789\nEscucha, bebe esto.\n\n1426\n05:43:13.917 --> 05:43:17.739\nLuego vas a ver al pagador\ny dile que aquí lo espero.\n\n1427\n05:43:46.083 --> 05:43:47.744\nSteigerwald.\n\n1428\n05:43:50.917 --> 05:43:53.078\n¿Qué es ahora?\n\n1429\n05:43:53.208 --> 05:43:57.531\nNos quedaremos aquí esta noche.\npero necesitaré el auto mañana.\n\n1430\n05:44:04.125 --> 05:44:08.869\nPero luego quiero el dinero\nantes de irte.\n\n1431\n05:44:11.292 --> 05:44:12.953\nEstá bien.\n\n1432\n05:44:31.292 --> 05:44:36.537\n- Y tres sopas de frijoles.\n- De acuerdo.\n\n1433\n05:44:38.583 --> 05:44:41.416\n- Con jamón.\n- De acuerdo.\n\n1434\n05:46:12.583 --> 05:46:14.414\nVoy a dictar.\n\n1435\n05:46:16.083 --> 05:46:18.119\nQuerido capitán...\n\n1436\n05:46:22.875 --> 05:46:24.866\nEternidad...\n\n1437\n05:46:26.875 --> 05:46:29.708\nDura para siempre.\n\n1438\n05:46:30.958 --> 05:46:36.954\nporque no se compara\na lo efímero...\n\n1439\n05:46:39.542 --> 05:46:42.033\nEl cambiable...\n\n1440\n05:46:43.667 --> 05:46:45.407\nLo temporal.\n\n1441\n05:46:50.750 --> 05:46:56.495\nPero la intensidad de la luz\noscuridad penetrante\n\n1442\n05:46:56.625 --> 05:46:58.616\nparece debilitarse.\n\n1443\n05:47:00.750 --> 05:47:03.992\n\"Parece... debilitarse.\"\n\n1444\n05:47:04.125 --> 05:47:07.117\nHay discontinuación.\n\n1445\n05:47:09.625 --> 05:47:11.331\nInterrupciones...\n\n1446\n05:47:12.833 --> 05:47:14.539\nagujeros\n\n1447\n05:47:20.250 --> 05:47:22.662\nLuego, finalmente, la nada negra.\n\n1448\n05:47:25.542 --> 05:47:28.033\nEntonces hay miles de estrellas\n\n1449\n05:47:28.167 --> 05:47:30.579\na una distancia inalcanzable.\n\n1450\n05:47:36.208 --> 05:47:39.780\nCon una pequeña chispa en el medio,\n\n1451\n05:47:39.917 --> 05:47:41.748\nel ego.\n\n1452\n05:47:42.375 --> 05:47:47.199\n\"Una... pequeña... chispa...\"\n\n1453\n05:47:50.208 --> 05:47:53.905\nNuestras acciones pueden ser recompensadas\no castigado,\n\n1454\n05:47:54.042 --> 05:47:58.035\ncastigado en la eternidad,\ny solo ahí...\n\n1455\n05:48:05.875 --> 05:48:11.700\nPorque todo tiene un lugar,\nun lugar alejado de la realidad...\n\n1456\n05:48:16.708 --> 05:48:20.451\ndonde tiene su lugar,\n\n1457\n05:48:20.583 --> 05:48:23.416\ndonde siempre ha estado...\n\n1458\n05:48:23.542 --> 05:48:26.204\n\"Dónde... ha... estado.\"\n\n1459\n05:48:26.958 --> 05:48:29.449\nDonde siempre estará...\n\n1460\n05:48:31.667 --> 05:48:34.158\nDonde está ahora.\n\n1461\n05:48:42.375 --> 05:48:45.117\nEl único lugar auténtico.\n\n1462\n05:51:02.875 --> 05:51:05.662\nEspero no haberte despertado.\n\n1463\n05:51:05.792 --> 05:51:10.035\nNo perturbaste mi sueño\ny espero que tú tampoco lo hagas.\n\n1464\n05:51:18.792 --> 05:51:22.785\n- Mis colaboradores.\n- Mi nombre es petrina.\n\n1465\n05:51:22.917 --> 05:51:24.407\nHorgos.\n\n1466\n05:51:25.458 --> 05:51:27.790\nMuy buen joven.\n\n1467\n05:51:30.208 --> 05:51:32.369\nPuede tener una buena carrera.\n\n1468\n05:51:37.042 --> 05:51:39.875\n¿Me conseguirías algo?\nahora que\n\n1469\n05:51:40.875 --> 05:51:43.708\n¿Me sacaste de la cama?\n\n1470\n05:51:45.167 --> 05:51:46.998\n¿Qué le gustaría?\n\n1471\n05:51:48.125 --> 05:51:51.117\nNo me preguntes qué me gustaría,\nno lo tienen.\n\n1472\n05:51:55.542 --> 05:51:57.624\nTráeme un vaso de brandy de ciruela.\n\n1473\n05:51:58.917 --> 05:52:00.407\nSanyi.\n\n1474\n05:52:08.792 --> 05:52:10.532\nEl traficante de armas.\n\n1475\n05:52:11.458 --> 05:52:13.198\nArmas deportivas.\n\n1476\n05:52:14.875 --> 05:52:18.163\nNo amo este trabajo,\neso lo sabes.\n\n1477\n05:52:18.292 --> 05:52:20.453\nSerá mejor que me llames pagador.\n\n1478\n05:52:21.583 --> 05:52:23.539\nSeñor pagador.\n\n1479\n05:52:23.667 --> 05:52:26.909\nTe pedí que vinieras aquí tan tarde.\n\n1480\n05:52:27.042 --> 05:52:29.203\nporque pronto\n\n1481\n05:52:29.333 --> 05:52:32.575\nnecesitaré\nbastante explosivo.\n\n1482\n05:53:11.708 --> 05:53:13.949\nVoy a pensar en ello.\n\n1483\n05:53:17.042 --> 05:53:19.784\nY decidir como mejor me parezca.\n\n1484\n05:53:22.000 --> 05:53:25.993\nY espero que lo hagas\nlo mejor que puedas para el éxito.\n\n1485\n05:53:35.208 --> 05:53:38.700\nEscuche, no depende completamente de mí.\n\n1486\n05:53:42.375 --> 05:53:44.866\nPero necesito saber\n\n1487\n05:53:45.000 --> 05:53:49.824\nsi puedes dar más\nénfasis a este excelente plan\n\n1488\n05:53:49.958 --> 05:53:54.907\nahora mismo,\ncon un supuesto buen comienzo?\n\n1489\n05:53:55.042 --> 05:53:57.033\nCiertamente.\n\n1490\n05:54:03.458 --> 05:54:05.870\nEres un caballero...\n\n1491\n05:54:07.500 --> 05:54:09.331\nSeñor irimias.\n\n1492\n05:54:17.542 --> 05:54:19.783\nDéjame preguntarte algo.\n\n1493\n05:54:25.833 --> 05:54:28.791\nEste \"algo nuevo\"\n\n1494\n05:54:28.917 --> 05:54:33.741\nque nos espera después\nrealizando su excelente plan...\n\n1495\n05:54:35.792 --> 05:54:39.956\n- Bueno...\n- No me tomes por un libertador.\n\n1496\n05:54:42.833 --> 05:54:44.869\nConsidérame un investigador triste,\n\n1497\n05:54:45.000 --> 05:54:49.243\nquien investiga el porque de todo\nEs tan terrible como es.\n\n1498\n05:54:51.667 --> 05:54:54.158\nte gustaria\n¿Cenar con nosotros?\n\n1499\n05:55:00.292 --> 05:55:02.123\nNo, gracias.\n\n1500\n05:55:05.875 --> 05:55:11.871\nBueno, entonces discutiremos\nlos detalles en otro momento?\n\n1501\n05:55:12.000 --> 05:55:14.582\nTe veré el fin de semana.\n\n1502\n05:55:28.042 --> 05:55:30.283\nBueno señores...\n\n1503\n05:55:38.250 --> 05:55:40.241\nDuerme bien.\n\n1504\n05:55:45.833 --> 05:55:52.580\nMira, fue hace 25 años, cuando yo era\npudo dormir por última vez cinco horas y media.\n\n1505\n05:55:53.917 --> 05:55:57.330\nDesde entonces, he estado girando\nen mi cama, medio dormido.\n\n1506\n05:55:57.458 --> 05:55:59.870\nGracias de todos modos.\n\n1507\n05:58:33.875 --> 05:58:36.036\nnuestro padre,\n\n1508\n05:58:36.167 --> 05:58:38.658\nquien estas en el cielo\n\n1509\n05:58:40.750 --> 05:58:43.742\nsantificado sea tu nombre.\n\n1510\n05:58:45.333 --> 05:58:49.326\nVenga tu reino,\n\n1511\n05:58:49.458 --> 05:58:51.870\nhágase tu voluntad...\n\n1512\n05:58:55.167 --> 05:58:58.614\nEn la tierra...\n\n1513\n05:59:01.083 --> 05:59:04.155\nComo es en el cielo.\n\n1514\n05:59:06.292 --> 05:59:10.035\nDanos este día\nnuestro pan de cada día...\n\n1515\n05:59:13.292 --> 05:59:15.283\nEl poder...\n\n1516\n05:59:22.000 --> 05:59:23.831\nAmén.\n\n1517\n05:59:58.750 --> 06:00:06.750\nLa perspectiva, vista desde atrás.\n\n1518\n06:02:13.833 --> 06:02:17.075\nNo entiendo a las irimias.\n\n1519\n06:02:17.208 --> 06:02:21.781\nÉl era uno de nosotros.\nY ahora es como un señor.\n\n1520\n06:02:21.917 --> 06:02:25.239\nSimplemente no puedes entender\n\n1521\n06:02:25.375 --> 06:02:27.707\nlo que quiere.\n\n1522\n06:02:27.833 --> 06:02:30.324\nTodas las tonterías que dijo.\n\n1523\n06:02:30.458 --> 06:02:34.952\n¡Se arrodilla y grita pidiendo ayuda!\n\n1524\n06:02:35.083 --> 06:02:38.826\nLuego amenazando con el niño...\n\n1525\n06:02:38.958 --> 06:02:42.951\nLa forma en que habló ayer,\nEstaba empezando a creerlo.\n\n1526\n06:02:44.167 --> 06:02:47.000\n¿Por qué diablos?\n¿Agitó esta mierda?\n\n1527\n06:02:47.125 --> 06:02:50.822\nSi hubiera sabido que quería\nmás de lo mismo,\n\n1528\n06:02:50.958 --> 06:02:54.121\nLe habría ahorrado el problema.\n\n1529\n06:02:54.958 --> 06:02:57.700\nes una locura decir\n\n1530\n06:02:57.833 --> 06:03:00.199\nque fue mi culpa.\n\n1531\n06:03:00.333 --> 06:03:05.999\nque tenía algo que hacer\ncon ese pequeño idiota.\n\n1532\n06:03:06.125 --> 06:03:09.617\nIncluso su nombre me impulsó\nhasta la pared.\n\n1533\n06:03:09.750 --> 06:03:11.991\n\"Estike\", ¿qué es eso?\n\n1534\n06:03:12.125 --> 06:03:13.661\n¿Es ese un nombre?\n\n1535\n06:03:13.792 --> 06:03:16.989\nElla comió mucho veneno para ratas.\ny eso es todo.\n\n1536\n06:03:18.083 --> 06:03:21.075\nTal vez fue mejor\npara la pobre.\n\n1537\n06:03:21.208 --> 06:03:24.325\nPero ¿qué es todo el asunto?\nque ver conmigo?\n\n1538\n06:03:24.458 --> 06:03:27.530\nÉl nos atrajo aquí\na este basurero deteriorado.\n\n1539\n06:03:27.667 --> 06:03:30.909\nY actuamos como ovejas.\nMientras tanto abandonó.\n\n1540\n06:03:31.042 --> 06:03:35.115\nDios sabe dónde está bebiendo\ncon nuestro dinero.\n\n1541\n06:03:35.250 --> 06:03:39.414\nEl sueldo de un año entero.\n\n1542\n06:03:41.042 --> 06:03:44.284\nY estoy arruinado otra vez.\n\n1543\n06:03:44.417 --> 06:03:49.161\nY si aparece en un minuto,\n¿Qué le vas a gritar?\n\n1544\n06:03:50.958 --> 06:03:56.032\n¿Eres tú quien dice eso?\n¿Tienes el descaro de pronunciar una palabra?\n\n1545\n06:03:56.167 --> 06:03:57.327\n¡Detente por un minuto!\n\n1546\n06:03:57.458 --> 06:03:59.619\n¿De quién es la culpa de que me hayan robado?\n\n1547\n06:03:59.750 --> 06:04:03.698\n¿Quién dijo que todo estaría bien?\npara compartir el dinero?\n\n1548\n06:04:03.833 --> 06:04:06.825\nIrimías y petrina, ¿qué?\n\n1549\n06:04:10.167 --> 06:04:11.247\nMaldito.\n\n1550\n06:04:11.375 --> 06:04:15.789\nDevuélveme mi dinero,\n¡bastardo!\n\n1551\n06:04:15.917 --> 06:04:20.991\nDevuélveme mi dinero.\n¡Devuélvemelo, idiota!\n\n1552\n06:04:24.583 --> 06:04:30.408\nDémosle dos minutos.\ny ver si se calma.\n\n1553\n06:05:16.167 --> 06:05:20.957\n- ¿Ya pasaron los dos minutos?\n- Escuchen, gente.\n\n1554\n06:05:21.083 --> 06:05:24.120\n¿Qué diablos estás haciendo?\n¡No de esta manera!\n\n1555\n06:05:24.250 --> 06:05:26.992\n- Utilicen sus cabezas.\n- ¡Callarse la boca!\n\n1556\n06:05:28.000 --> 06:05:32.414\nAquí está. Tu salvador está aquí.\n\n1557\n06:05:32.542 --> 06:05:35.705\n¿De verdad crees que es mi culpa?\n\n1558\n06:05:36.250 --> 06:05:39.242\nDevuélveme mi dinero.\n¿Me oyes? ¡Devuélvemelo!\n\n1559\n06:05:39.375 --> 06:05:44.199\nNo creo en mis ojos.\n¿Qué estás haciendo ahí?\n\n1560\n06:05:45.250 --> 06:05:47.912\nTe pierdes.\n\n1561\n06:05:48.042 --> 06:05:52.206\nNo te preocupes por eso.\nNo es asunto tuyo.\n\n1562\n06:05:53.458 --> 06:05:56.950\n¡Aléjate de aquí!\nNo lo diré dos veces.\n\n1563\n06:05:57.083 --> 06:05:59.074\n¿Qué está pasando aquí?\n\n1564\n06:06:12.208 --> 06:06:15.450\n¡Quiero saber qué está pasando!\n\n1565\n06:06:17.792 --> 06:06:20.124\nPensábamos que no vendrías.\n\n1566\n06:06:20.250 --> 06:06:23.242\nDijiste que estarías aquí\na las seis de la mañana.\n\n1567\n06:06:24.792 --> 06:06:27.704\nHago lo mejor que puedo para ayudarte.\n\n1568\n06:06:27.833 --> 06:06:30.540\nHace tres días que no duermo.\n\n1569\n06:06:30.667 --> 06:06:33.659\ncaminé horas\nbajo la lluvia torrencial,\n\n1570\n06:06:33.792 --> 06:06:38.115\ncorro aquí y allá\npara superar las dificultades,\n\n1571\n06:06:38.250 --> 06:06:42.243\ny os comportáis como lechones\ncuando su cena se retrasa.\n\n1572\n06:06:47.250 --> 06:06:49.241\n¿Lo que le pasó?\n\n1573\n06:06:54.542 --> 06:06:58.034\n- Me sangra la nariz.\n- Puedo ver eso. ¿Pero por qué?\n\n1574\n06:07:05.375 --> 06:07:09.038\nNunca esperé eso de ti.\n\n1575\n06:07:10.750 --> 06:07:12.832\nDe ti tampoco.\n\n1576\n06:07:15.083 --> 06:07:17.415\nY acabamos de empezar.\n\n1577\n06:07:18.875 --> 06:07:20.957\n¿Qué será más adelante?\n\n1578\n06:07:21.833 --> 06:07:24.245\n¿Se apuñalarán unos a otros?\n\n1579\n06:07:25.792 --> 06:07:27.282\nTriste.\n\n1580\n06:07:28.750 --> 06:07:30.581\nEsto es muy triste.\n\n1581\n06:07:33.542 --> 06:07:36.579\nVoy a olvidarlo esta vez.\n\n1582\n06:07:36.708 --> 06:07:41.782\nPero con la condición de que tal cosa\nno puede volver a suceder. ¿Está claro?\n\n1583\n06:07:45.125 --> 06:07:48.197\nAsí que hablemos de sentido común.\n\n1584\n06:07:48.333 --> 06:07:51.325\nhay algo importante\nTengo que decírtelo.\n\n1585\n06:07:56.583 --> 06:08:01.907\nDebemos posponer nuestros planes.\npara la mansión por el momento.\n\n1586\n06:08:02.042 --> 06:08:05.580\nPorque en ciertos círculos\nno seria deseable\n\n1587\n06:08:05.708 --> 06:08:10.953\nsi un establecimiento\npara propósitos tan vagos fueron creados.\n\n1588\n06:08:13.333 --> 06:08:18.248\nSu principal objeción es\n\n1589\n06:08:18.375 --> 06:08:20.366\nel hecho de que la mansión,\n\n1590\n06:08:20.500 --> 06:08:27.531\nestar casi totalmente aislado\ny muy lejos del pueblo,\n\n1591\n06:08:27.667 --> 06:08:31.205\ndifícilmente podría ser traído\nbajo su control.\n\n1592\n06:08:31.333 --> 06:08:33.665\nPor lo tanto,\n\n1593\n06:08:33.792 --> 06:08:38.035\nen la situación actual\n\n1594\n06:08:38.167 --> 06:08:41.125\nPara nosotros la única manera de tener éxito es\n\n1595\n06:08:41.250 --> 06:08:45.289\npara esparcirse por el condado\npor un tiempo\n\n1596\n06:08:45.417 --> 06:08:53.244\nhasta que estos señores\nestar tan confundido\n\n1597\n06:08:53.375 --> 06:08:59.041\nque podemos regresar aquí con seguridad\ny empezar a trabajar según lo previsto.\n\n1598\n06:09:00.958 --> 06:09:05.031\nDe ahora en adelante,\nsois personas especiales.\n\n1599\n06:09:05.167 --> 06:09:07.954\nporque eres seleccionado\nayudar en un asunto\n\n1600\n06:09:08.083 --> 06:09:13.328\nen el que la lealtad,\ndevoción y prudencia\n\n1601\n06:09:13.458 --> 06:09:16.450\nson absolutamente necesarios.\n\n1602\n06:09:18.208 --> 06:09:21.780\nNuestros objetivos van camino\nmás allá de ellos mismos.\n\n1603\n06:09:21.917 --> 06:09:24.909\nLa dispersión es sólo un señuelo táctico.\n\n1604\n06:09:25.042 --> 06:09:27.954\nporque vas a mantener\nen continuo contacto conmigo,\n\n1605\n06:09:28.083 --> 06:09:32.406\naunque no entre ellos.\n\n1606\n06:09:32.542 --> 06:09:34.373\nMientras tanto no creas\n\n1607\n06:09:34.500 --> 06:09:37.412\nque vamos a quedar\npasivamente en el fondo\n\n1608\n06:09:37.542 --> 06:09:40.534\ny esperar las cosas\npara mejorar por sí mismos.\n\n1609\n06:09:42.292 --> 06:09:47.116\nque tienes que hacer\nes escuchar a las personas que te rodean.\n\n1610\n06:09:48.917 --> 06:09:56.917\nVistas, historias, eventos que son imperativos.\ny conectado con el asunto.\n\n1611\n06:10:05.917 --> 06:10:09.580\nCada uno de ustedes necesitará\nadquirir la habilidad excepcional\n\n1612\n06:10:09.708 --> 06:10:14.702\nmediante el cual se puede distinguir entre\nlas buenas y las malas señales.\n\n1613\n06:10:14.833 --> 06:10:17.449\nEn otras palabras,\nentre el bien y el mal.\n\n1614\n06:10:17.583 --> 06:10:20.655\n¿Y cómo vamos a vivir?\nmientras tanto?\n\n1615\n06:10:22.750 --> 06:10:24.240\nNo te preocupes.\n\n1616\n06:10:25.333 --> 06:10:26.413\nNo te preocupes.\n\n1617\n06:10:26.542 --> 06:10:31.206\nTodo está organizado,\ntodo está preparado.\n\n1618\n06:10:32.417 --> 06:10:35.284\nTodos tendréis trabajo que hacer.\n\n1619\n06:10:35.417 --> 06:10:40.081\nAl principio obtendrás\nsuficiente dinero para lo básico\n\n1620\n06:10:40.208 --> 06:10:42.995\nde nuestro capital común.\n\n1621\n06:10:43.125 --> 06:10:47.198\nPero no nos hagas perder el tiempo.\nhaciendo preguntas innecesarias.\n\n1622\n06:10:47.333 --> 06:10:49.324\nDe todos modos llegamos tarde.\n\n1623\n06:10:49.458 --> 06:10:52.200\nTenemos que empezar ahora mismo.\nmis amigos\n\n1624\n06:10:54.042 --> 06:10:58.832\nVe a empacar tus cosas. Apresúrate.\n\n1625\n06:10:58.958 --> 06:11:02.780\nToma tus cosas y vete.\nToma las cosas grandes primero.\n\n1626\n06:11:02.917 --> 06:11:04.748\nVamos, muévete.\n\n1627\n06:11:12.667 --> 06:11:17.491\nKraner, tú también, ¿me oyes?\n\n1628\n06:11:17.625 --> 06:11:21.447\nEspera un segundo.\nDevuélvenos nuestro dinero.\n\n1629\n06:11:23.917 --> 06:11:28.411\n¿Me oyes?\n¡Devuélveme el dinero!\n\n1630\n06:11:34.000 --> 06:11:36.286\n¿El dinero?\n\n1631\n06:11:36.417 --> 06:11:38.658\n¿Es eso lo que quieres?\n\n1632\n06:11:50.083 --> 06:11:51.789\nToma, aquí tienes tu dinero.\n\n1633\n06:11:51.917 --> 06:11:55.739\nHaz lo que quieras hacer con él, solo.\nBuena suerte.\n\n1634\n06:11:57.250 --> 06:12:00.083\nEste es un año de nuestro arduo trabajo.\n\n1635\n06:12:06.250 --> 06:12:09.083\nJoska, devuélveme el dinero.\n\n1636\n06:12:10.375 --> 06:12:13.447\nNo, solo compártelo.\n\n1637\n06:12:13.583 --> 06:12:16.416\nQuizás sea mejor así.\n\n1638\n06:12:16.542 --> 06:12:20.535\nAl menos quedó claro desde el principio.\nque no tienes honor ni perseverancia.\n\n1639\n06:12:22.208 --> 06:12:26.030\nEs bueno saberlo desde el principio.\ncon quien puedo contar.\n\n1640\n06:12:29.292 --> 06:12:32.284\nCreo que la señora kraner,\nSu marido puede tener razón.\n\n1641\n06:12:35.250 --> 06:12:39.573\nNo puedo realizar mis planes\ncontigo.\n\n1642\n06:12:44.792 --> 06:12:47.454\nnecesito gente\nque al menos son capaces\n\n1643\n06:12:47.583 --> 06:12:50.746\ncuidar\nsus propios intereses.\n\n1644\n06:12:53.208 --> 06:12:55.745\nMe tengo que ir ahora.\n\n1645\n06:12:55.875 --> 06:12:57.706\nEsperar.\n\n1646\n06:13:02.375 --> 06:13:03.956\ny\n\n1647\n06:13:06.042 --> 06:13:08.533\n¿La granja estará funcionando?\n\n1648\n06:13:11.292 --> 06:13:16.707\nno lo sé,\npero esto ya no debería preocuparte.\n\n1649\n06:13:27.542 --> 06:13:29.703\nDale el dinero.\n\n1650\n06:13:33.625 --> 06:13:36.037\nNo fue mi intención.\n\n1651\n06:13:37.458 --> 06:13:39.790\nAhora, toma el dinero.\n\n1652\n06:13:45.625 --> 06:13:48.116\nEsta lluvia, ya sabes,\ny la larga caminata.\n\n1653\n06:13:48.250 --> 06:13:52.573\nAnoche pasamos mucho frío.\nLo sentimos mucho.\n\n1654\n06:13:53.750 --> 06:13:56.412\nNo se trata de mí.\n\n1655\n06:13:56.542 --> 06:13:58.783\nEs el hecho de que desertaste,\n\n1656\n06:13:58.917 --> 06:14:02.865\ntraicionaste la causa\nYa el primer día.\n\n1657\n06:14:03.000 --> 06:14:07.664\nTodo se basa\nen la confianza y la perseverancia.\n\n1658\n06:14:08.833 --> 06:14:10.994\nToma el dinero ahora.\n\n1659\n06:14:16.292 --> 06:14:19.784\nConfiamos en ti. Tómalo.\n\n1660\n06:14:19.917 --> 06:14:23.910\nMira, no tengo tiempo ni humor.\npara tales escenas.\n\n1661\n06:14:25.458 --> 06:14:28.370\nDebo admitir que me decepcionaste.\n\n1662\n06:14:29.958 --> 06:14:34.201\nPero esta vez lo miraré más allá.\nsólo por una vez.\n\n1663\n06:14:36.958 --> 06:14:42.954\nvoy a intentar olvidar\ntodo este vergonzoso acontecimiento.\n\n1664\n06:16:03.417 --> 06:16:05.123\nCuidado con cómo te sientas ahí\n\n1665\n06:16:05.250 --> 06:16:09.448\nse necesitan al menos dos horas\nincluso con este vehículo extraordinariamente rápido.\n\n1666\n06:16:09.583 --> 06:16:11.665\nAbotona tus abrigos.\n\n1667\n06:16:11.792 --> 06:16:14.499\nPonte las capuchas y los sombreros.\n\n1668\n06:16:14.625 --> 06:16:20.700\nY simplemente dale la espalda\nal futuro brillante\n\n1669\n06:16:20.833 --> 06:16:24.576\no esta maldita lluvia se pondrá\npor todas vuestras caras.\n\n1670\n06:22:15.125 --> 06:22:19.198\nSchmidts, halicses, kraners,\n¡vamos!\n\n1671\n06:22:20.875 --> 06:22:25.198\nFutaki, señor maestro de escuela,\npor favor espera un minuto.\n\n1672\n06:23:47.750 --> 06:23:50.082\n¿Qué pasa?\n¿no vienes?\n\n1673\n06:24:35.125 --> 06:24:37.867\n¿Hay un pub aquí?\n\n1674\n06:24:38.000 --> 06:24:41.993\n- Podríamos tomar una copa.\n- No.\n\n1675\n06:24:45.167 --> 06:24:47.749\nSchmidt y familia,\n\n1676\n06:24:47.875 --> 06:24:50.287\nvas a elek.\n\n1677\n06:24:52.417 --> 06:24:56.831\nHe dejado todo\na quién contactar y dónde.\n\n1678\n06:25:03.750 --> 06:25:06.742\nAhí conseguirás trabajo\ny un lugar para vivir.\n\n1679\n06:25:08.125 --> 06:25:10.366\n¿Y qué trabajo hay?\n\n1680\n06:25:11.292 --> 06:25:13.374\nEsto es una carnicería.\n\n1681\n06:25:14.917 --> 06:25:17.750\nHay mucho que hacer.\n\n1682\n06:25:17.875 --> 06:25:20.287\nPuedes atender a los clientes.\n\n1683\n06:25:22.667 --> 06:25:24.157\nAhora los kraner.\n\n1684\n06:25:25.458 --> 06:25:29.280\nPreguntas por istvan kalmar\nen keresztur.\n\n1685\n06:25:29.417 --> 06:25:33.239\nEscuche atentamente,\nno está escrito.\n\n1686\n06:25:34.125 --> 06:25:37.197\nHay una calle antes de la iglesia.\na la derecha.\n\n1687\n06:25:38.083 --> 06:25:41.496\nVas por esa calle hasta\nVes el cartel de \"moda femenina\".\n\n1688\n06:25:41.625 --> 06:25:43.456\nEsa es la casa de kalmar.\n\n1689\n06:25:45.667 --> 06:25:49.080\nDile que dénci te ha enviado,\n\n1690\n06:25:49.208 --> 06:25:52.450\npuede que lo haya olvidado\nmi verdadero nombre.\n\n1691\n06:25:53.500 --> 06:25:57.618\nTiene una lavandería en la parte de atrás,\nte quedarás allí.\n\n1692\n06:25:57.750 --> 06:25:59.706\n¿Está eso claro?\n\n1693\n06:25:59.833 --> 06:26:01.664\nSí, dénci.\n\n1694\n06:26:02.667 --> 06:26:07.286\nUna calle después de la iglesia.\ny hay una señal...\n\n1695\n06:26:07.417 --> 06:26:09.282\nCorrecto.\n\n1696\n06:26:09.417 --> 06:26:11.408\nHalicos.\n\n1697\n06:26:12.833 --> 06:26:16.496\nVas al presbiterio...\n\n1698\n06:26:18.458 --> 06:26:21.530\nY pide gyivicsan,\nel párroco.\n\n1699\n06:26:21.667 --> 06:26:23.328\nGyivicsan.\n\n1700\n06:26:25.625 --> 06:26:27.957\nHay mucho vino allí.\n\n1701\n06:26:28.708 --> 06:26:31.950\nPuedes limpiar la iglesia.\n\n1702\n06:26:32.083 --> 06:26:34.825\ny hacer la cocina\npara ustedes tres.\n\n1703\n06:26:35.958 --> 06:26:42.454\nAquí tienes mil florines.\npor persona...\n\n1704\n06:26:44.208 --> 06:26:46.199\nSi surge algo.\n\n1705\n06:27:04.708 --> 06:27:07.871\nPero no lo desperdicies.\n\n1706\n06:27:14.375 --> 06:27:18.368\nY no lo olvides\nlo que se supone que debes hacer.\n\n1707\n06:27:21.708 --> 06:27:23.539\nCreo que todo está claro.\n\n1708\n06:27:23.667 --> 06:27:27.330\nNos gustaría agradecerte\npor todo el bien que has hecho por nosotros.\n\n1709\n06:27:29.583 --> 06:27:31.995\nNo tienes que decir gracias.\n\n1710\n06:27:33.833 --> 06:27:37.405\nYo también, solo soy un sirviente.\nde una gran causa.\n\n1711\n06:27:41.750 --> 06:27:44.742\nAsí que recuerda lo que tienes que hacer.\n\n1712\n06:27:46.958 --> 06:27:50.951\nEntonces ten mucho cuidado,\ncomo sabes nos preocupamos por ti.\n\n1713\n06:27:53.292 --> 06:27:55.453\nCuídense mucho.\n\n1714\n06:28:19.958 --> 06:28:24.281\nEscucha, siéntate ahí arriba...\n\n1715\n06:28:26.083 --> 06:28:28.540\nY te llevaremos\nal estreber.\n\n1716\n06:28:28.667 --> 06:28:33.661\nTe recogeremos en una hora.\ny hablar del resto. ¿De acuerdo?\n\n1717\n06:28:33.792 --> 06:28:35.282\nDe acuerdo.\n\n1718\n06:28:37.208 --> 06:28:38.618\nFutaki.\n\n1719\n06:28:38.750 --> 06:28:41.992\nNo te preocupes por mí.\nSé adónde voy.\n\n1720\n06:28:42.125 --> 06:28:45.117\nPodría encontrar un trabajo en alguna parte\ncomo vigilante.\n\n1721\n06:28:46.708 --> 06:28:49.290\nEstarías mejor\nhaciendo otra cosa.\n\n1722\n06:28:58.417 --> 06:29:01.909\n¿Qué? ¿No hay manera de venir?\nllegar a un acuerdo contigo hoy?\n\n1723\n06:29:07.167 --> 06:29:11.581\nVen a Steigerwald's a las 8 de la tarde.\ny lo hablaremos allí.\n\n1724\n06:29:20.417 --> 06:29:23.079\nEstá bien, lo haré a tu manera.\n\n1725\n06:29:23.208 --> 06:29:24.698\nAquí.\n\n1726\n06:29:26.750 --> 06:29:28.581\nMil florines.\n\n1727\n06:29:32.042 --> 06:29:35.034\nCómprate una cena\nal menos en alguna parte.\n\n1728\n06:30:14.708 --> 06:30:19.372\nEste futaki es el mayor tonto.\nque alguna vez conocí.\n\n1729\n06:30:19.500 --> 06:30:23.743\n¿Qué pensó?\n¿Que esto es el paraíso aquí?\n\n1730\n06:30:24.583 --> 06:30:27.575\n¿Qué esperaba el pobre diablo?\n\n1731\n06:31:43.125 --> 06:31:51.125\nNada más que preocupación y trabajo.\n\n1732\n06:33:35.667 --> 06:33:39.159\n- Deja de lado la parte sobre la eternidad.\n- De acuerdo.\n\n1733\n06:33:41.917 --> 06:33:47.457\n\"Aunque no creo que sea correcto\npara escribir dicha información\n\n1734\n06:33:47.583 --> 06:33:52.407\n\"pero para que veas\nmi voluntad,\n\n1735\n06:33:52.542 --> 06:33:55.249\n\"Estoy siguiendo\ntus instrucciones:\n\n1736\n06:33:55.375 --> 06:33:58.447\n\"He tenido en cuenta\nque me animaste a ser abierto\n\n1737\n06:33:58.583 --> 06:33:59.823\n\"en todas las circunstancias.\n\n1738\n06:33:59.958 --> 06:34:03.280\n\"Li debe decir que no puede haber ninguna duda.\nsobre la aptitud de mi gente.\n\n1739\n06:34:03.417 --> 06:34:06.375\n\"Esperaba haber podido convencer\nusted de esto ayer.\n\n1740\n06:34:06.500 --> 06:34:08.832\n\"Esto es importante enfatizar nuevamente\n\n1741\n06:34:08.958 --> 06:34:12.621\n\"porque de este borrador\nTambién se podrían derivar otras implicaciones.\n\n1742\n06:34:12.750 --> 06:34:16.447\n\"Recalco que para mantener\nmi base funcionando, seré el único\n\n1743\n06:34:16.583 --> 06:34:18.744\n\"para mantenerme en contacto con mi gente.\n\n1744\n06:34:18.875 --> 06:34:22.322\n\"Cualquier otra cosa conduciría\nhasta el fracaso total, etc...\"\n\n1745\n06:34:22.458 --> 06:34:25.780\n- Creo que está bien.\n- Entonces lo dejamos ahí.\n\n1746\n06:35:40.292 --> 06:35:42.123\nSeñora Schmidt...\n\n1747\n06:35:42.625 --> 06:35:44.115\nEscríbelo.\n\n1748\n06:35:46.792 --> 06:35:49.579\nEn lugar de una mujer estúpida\ncon grandes tetas, escribes,\n\n1749\n06:35:49.708 --> 06:35:52.074\n\"persona mentalmente inmadura,\n\n1750\n06:35:52.208 --> 06:35:55.280\n\"quien la destaca sobre todo\npersonaje femenino.\"\n\n1751\n06:35:55.417 --> 06:35:57.453\n¿Y qué pasa con la \"maldita puta\"?\n\n1752\n06:35:57.583 --> 06:36:01.622\nPodría ser una \"dama de virtud fácil\"\no una \"mujer de baja moral\"\n\n1753\n06:36:01.750 --> 06:36:05.743\n¿Qué tal \"una mujer que se prostituye?\"\nsin dudarlo\"?\n\n1754\n06:36:05.875 --> 06:36:07.706\nDe acuerdo. Escríbelo.\n\n1755\n06:36:38.333 --> 06:36:41.325\n- ¿Finalizado?\n- Sí.\n\n1756\n06:36:41.458 --> 06:36:43.870\n\"Se acostaba con cualquiera\ny todos.\n\n1757\n06:36:44.000 --> 06:36:46.241\n\"Y si echó de menos a alguien,\nEso fue sólo por accidente.\"\n\n1758\n06:36:46.375 --> 06:36:49.367\n\"Ella es un modelo de infidelidad conyugal\".\n\n1759\n06:37:05.375 --> 06:37:06.785\n¿Finalizado?\n\n1760\n06:37:11.625 --> 06:37:15.163\nEn lugar de \"un hedor creado\npor la mezcla de Colonia barata\n\n1761\n06:37:15.292 --> 06:37:18.125\n\"con dios sabe qué más...\"\n\n1762\n06:37:19.708 --> 06:37:23.621\n\"Ella intenta aliviar\nsu desagradable olor corporal\n\n1763\n06:37:23.750 --> 06:37:31.750\n\"de una manera inusual.\"\n\n\n";
