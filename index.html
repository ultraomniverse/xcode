<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>SÁTÁNTANGÓ · descenso</title>
<link rel="preconnect" href="https://archive.org" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
<style>
:root{--ink:#ece8de;--dim:#6b6860;--plyr-color-main:#d9d4c6;--plyr-control-radius:0;--plyr-font-family:ui-monospace,Menlo,Consolas,monospace;
  --plyr-video-controls-background:linear-gradient(transparent,rgba(0,0,0,.9));--plyr-range-thumb-height:12px;--plyr-menu-background:#0a0a0b;--plyr-menu-color:#cfcabd}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
body{font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- entrada ---------- */
#home{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;padding:24px;
  background:radial-gradient(70% 55% at 50% 125%,#2a2925 0%,transparent 70%),radial-gradient(50% 40% at 50% -10%,#232220 0%,transparent 72%),#000;
  transition:opacity .9s,transform .9s}
#home.out{opacity:0;transform:scale(1.25);pointer-events:none}
#home canvas{position:absolute;inset:0;width:100%;height:100%}
#home::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 65% 55% at 50% 50%,transparent 20%,rgba(0,0,0,.7) 75%,#000)}
.fog{position:absolute;inset:-25%;pointer-events:none;background:radial-gradient(closest-side,rgba(190,184,170,.09),transparent 70%);animation:fog 40s linear infinite alternate}
@keyframes fog{from{transform:translate(-8%,5%) scale(1.1)}to{transform:translate(8%,-5%) scale(1.35)}}
#home>*:not(canvas):not(.fog){position:relative;z-index:2}
.pre{font-size:11px;letter-spacing:.5em;text-transform:uppercase;color:var(--dim)}
h1{margin:0;font:400 clamp(44px,11vw,150px)/.95 ui-serif,Georgia,serif;letter-spacing:.18em;text-indent:.18em;text-shadow:0 0 90px rgba(236,232,222,.25),0 6px 40px #000}
.meta{font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:#8a867c;line-height:2.2}
.btns{display:flex;flex-direction:column;gap:14px;align-items:center}
.btns button{min-width:300px;padding:18px 40px;border:1px solid #403e38;background:rgba(0,0,0,.35);letter-spacing:.4em;font-size:14px;text-transform:uppercase;transition:.3s}
.btns button:hover,.btns button:focus{outline:none;border-color:var(--ink);background:rgba(236,232,222,.07);box-shadow:0 0 60px rgba(236,232,222,.15)}
.btns small{display:block;margin-top:6px;font-size:10px;letter-spacing:.24em;color:var(--dim)}
#res[hidden]{display:none}
.credit{position:absolute!important;bottom:16px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#4a4842}

/* ---------- reproductor (Plyr) ---------- */
#film{position:fixed;inset:0;background:#000;display:none}
#film.on{display:block}
#film .plyr,#film .plyr__video-wrapper,#film video{width:100%;height:100%}
#film video{object-fit:contain;background:#000}
.plyr--video.plyr--hide-controls{cursor:none}
.plyr__control--overlaid{background:rgba(0,0,0,.6);border:1px solid #403e38}
.plyr__captions{font-size:clamp(22px,3.4vw,46px)!important;bottom:6%}
.plyr--captions-active .plyr__captions .plyr__caption{background:rgba(0,0,0,.72);line-height:1.35;white-space:pre-wrap}
#err{position:absolute;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(0,0,0,.9);text-align:center;padding:24px}
#err.on{display:flex}
#err button{padding:14px 34px;border:1px solid #403e38;letter-spacing:.3em;text-transform:uppercase}
#err button:focus,#err button:hover{outline:none;border-color:var(--ink)}
#toast{position:absolute;top:4%;left:50%;transform:translateX(-50%);z-index:40;padding:6px 14px;background:rgba(0,0,0,.8);font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none}
@media (prefers-reduced-motion:reduce){.fog{animation:none}}
</style>
</head>
<body>

<main id="home">
  <canvas id="rain"></canvas><div class="fog"></div>
  <div class="pre">entrada al abismo</div>
  <h1>SÁTÁNTANGÓ</h1>
  <div class="meta">Béla Tarr · 1994 · 7 h 19 min<br>1080p · subtítulos en español latino</div>
  <div class="btns">
    <button id="go" autofocus>Descender<small>desde el principio</small></button>
    <button id="res" hidden>Continuar<small id="resT"></small></button>
  </div>
  <div class="credit">XCODE://abismo · UltraOmniverse</div>
</main>

<div id="film">
  <video id="v" playsinline preload="metadata"></video>
  <div id="toast"></div>
  <div id="err"><div>El pozo no responde. Revisa la conexión.</div><button id="retry">Reintentar</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const SRC="https://archive.org/download/satantango.-1994.-hungarian.-1080p.-blu-ray.-h-264.-aac-vxt/Satantango.1994.HUNGARIAN.1080p.BluRay.H264.AAC-VXT.mp4";
const SUBS=["satantango.es-419.srt","https://raw.githubusercontent.com/ultraomniverse/xcode/HEAD/satantango.es-419.srt"];
const KEY="sat.pos";
const v=$("v");
let player=null,offset=0,wl=null;

/* ---------- lluvia ---------- */
const cv=$("rain"),cx=cv.getContext("2d");let W,H,dr=[],run=true;
function size(){const d=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);
  dr=Array.from({length:Math.min(140,W/9|0)},()=>({x:Math.random()*W,y:Math.random()*H,l:8+Math.random()*32,v:.6+Math.random()*1.5,o:.05+Math.random()*.25}));}
addEventListener("resize",size);size();
(function loop(){if(!run)return;cx.clearRect(0,0,W,H);
  for(const d of dr){cx.strokeStyle="rgba(226,222,212,"+d.o+")";cx.beginPath();cx.moveTo(d.x,d.y);cx.lineTo(d.x-.9,d.y+d.l);cx.stroke();
    d.y+=d.v;d.x-=.2;if(d.y>H+40){d.y=-40;d.x=Math.random()*W;}if(d.x<-10)d.x=W+10;}
  requestAnimationFrame(loop);})();

/* ---------- posición guardada ---------- */
const fmt=t=>{t=Math.floor(t);const h=t/3600|0,m=t%3600/60|0,s=t%60;return h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");};
const saved=()=>{try{return +localStorage.getItem(KEY)||0;}catch{return 0;}};
if(saved()>60){$("res").hidden=false;$("resT").textContent="desde "+fmt(saved());}

/* ---------- subtítulos: SRT → VTT en memoria ---------- */
async function loadSubs(){
  for(const u of SUBS){
    try{const r=await fetch(u);if(!r.ok)continue;const t=await r.text();if(t.indexOf("-->")<0)continue;
      return "WEBVTT\n\n"+t.replace(/^\uFEFF/,"").replace(/\r/g,"").replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g,"$1.$2");}catch{}
  }
  return null;
}
function toast(m){const t=$("toast");t.textContent=m;t.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.opacity=0,1800);}
function shift(d){ /* [ y ] desplazan los subtítulos 0.5 s */
  const tr=v.textTracks[0];if(!tr||!tr.cues)return;
  for(const c of tr.cues){c.startTime=Math.max(0,c.startTime+d);c.endTime=Math.max(.1,c.endTime+d);}
  offset+=d;toast("Subtítulos "+(offset>0?"+":"")+offset.toFixed(1)+" s");
}

/* ---------- arranque ---------- */
async function start(resume){
  $("home").classList.add("out");
  const vtt=await loadSubs();
  if(vtt){
    const t=document.createElement("track");
    t.kind="captions";t.label="Español (Latino)";t.srclang="es";t.default=true;
    t.src=URL.createObjectURL(new Blob([vtt],{type:"text/vtt"}));
    v.appendChild(t);
  }
  v.src=SRC;
  if(resume)v.addEventListener("loadedmetadata",()=>{v.currentTime=saved();},{once:true});
  $("film").classList.add("on");
  run=false;setTimeout(()=>$("home").style.display="none",950);

  if(window.Plyr){
    player=new Plyr(v,{
      controls:["play-large","play","progress","current-time","duration","mute","volume","captions","settings","fullscreen"],
      settings:["captions","speed"],speed:{selected:1,options:[.75,1,1.25,1.5]},
      captions:{active:!!vtt,language:"es",update:false},
      keyboard:{focused:true,global:true},seekTime:10,hideControls:true,clickToPlay:true,
      fullscreen:{enabled:true,fallback:true,iosNative:true},
      iconUrl:"https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.svg",
      i18n:{captions:"Subtítulos",settings:"Ajustes",speed:"Velocidad",normal:"Normal",disabled:"Desactivados",enabled:"Activados",play:"Reproducir",pause:"Pausa",mute:"Silenciar",unmute:"Activar sonido",enterFullscreen:"Pantalla completa",exitFullscreen:"Salir de pantalla completa"}
    });
    try{player.fullscreen.enter();}catch{}
  }else v.controls=true;
  v.play().catch(()=>{});
  if(!vtt)toast("No se encontraron subtítulos (satantango.es-419.srt)");
}
$("go").onclick=()=>start(false);
$("res").onclick=()=>start(true);

/* ---------- guardar posición y mantener pantalla encendida ---------- */
setInterval(()=>{if(!v.paused&&v.currentTime>5){try{localStorage.setItem(KEY,v.currentTime);}catch{}}},5000);
async function lock(){try{if(navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>wl=null);}}catch{}}
v.addEventListener("play",lock);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!v.paused)lock();});

/* ---------- errores ---------- */
v.addEventListener("error",()=>{if(v.getAttribute("src"))$("err").classList.add("on");});
$("retry").onclick=()=>{const t=v.currentTime;$("err").classList.remove("on");v.load();v.addEventListener("loadedmetadata",()=>{v.currentTime=t;},{once:true});v.play().catch(()=>{});};

/* ---------- teclado / mando ---------- */
addEventListener("keydown",e=>{
  const home=!$("film").classList.contains("on");
  if(home){
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){const b=[$("go"),$("res")].filter(x=>!x.hidden),i=b.indexOf(document.activeElement);
      e.preventDefault();b[(i+(e.key==="ArrowDown"?1:-1)+b.length)%b.length].focus();}
    return;
  }
  if(e.key==="["){shift(-.5);}
  else if(e.key==="]"){shift(.5);}
  else if(e.key==="Enter"&&!e.target.closest(".plyr__controls,#err")){e.preventDefault();v.paused?v.play().catch(()=>{}):v.pause();}
});
</script>
</body>
</html>
