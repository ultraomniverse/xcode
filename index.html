<!DOCTYPE html>
<html>
<head>
<style>
  html,body{margin:0;padding:0;background:#000}
  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:26px;
    background-image:url("https://static.vecteezy.com/system/resources/thumbnails/013/425/328/small_2x/halloween-day-concept-cemetery-or-graveyard-in-the-night-with-dark-sky-haunted-cemetery-spooky-and-creepy-burial-ground-horror-scene-of-graveyard-funeral-concept-halloween-day-background-photo.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
  }
  img.logo{
    width:clamp(150px,34vw,280px);
    height:auto;
    display:block;
    filter:invert(1) brightness(1.05) contrast(1.1)
           drop-shadow(0 0 34px rgba(255,255,255,.28))
           drop-shadow(0 0 90px rgba(0,0,0,.9));
  }
  h1{
    margin:0;
    font-family:Georgia,'Times New Roman',serif;
    font-size:clamp(13px,3vw,26px);
    letter-spacing:.3em;
    text-transform:uppercase;
    color:#fff;
    text-shadow:0 0 24px #000,0 2px 6px #000;
  }
</style>
</head>
<body>
<img class="logo" src="https://eyeondesign.aiga.org/wp-content/uploads/2021/02/Justice-cross-aiga.jpg" alt="Justice">
<h1>Psychotic Corp</h1>
</body>
</html>
