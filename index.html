<!DOCTYPE html>
<html lang="es-419">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bandersnatch — créditos y final secreto</title>
<link rel="preconnect" href="https://ia800103.us.archive.org" crossorigin>
<link rel="preconnect" href="https://ia600103.us.archive.org" crossorigin>
<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#000;overflow:hidden;
    font-family:"Helvetica Neue",Arial,sans-serif;color:#eee}
  #wrap{position:relative;width:100%;height:100%}
  #v{position:absolute;inset:0;width:100%;height:100%;
    object-fit:contain;background:#000;outline:none}
  #subs{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);
    width:min(88%,1100px);text-align:center;pointer-events:none;
    font-size:clamp(15px,2vw,30px);font-weight:600;line-height:1.3;
    white-space:pre-line;color:#fff;
    text-shadow:0 0 6px #000,0 2px 4px #000,0 0 20px #000}
  #subs:empty{display:none}
  #load{position:absolute;inset:0;display:grid;place-items:center;
    background:#000;color:#777;font-size:13px;letter-spacing:.3em;
    text-transform:uppercase;z-index:5;transition:opacity .25s}
  #load.off{opacity:0;pointer-events:none}
  #bar{position:absolute;left:14px;bottom:44px;display:flex;gap:8px;
    align-items:center;opacity:.5;transition:opacity .2s;z-index:6}
  #wrap:hover #bar{opacity:1}
  #bar button{background:rgba(0,0,0,.6);border:1px solid #555;color:#ddd;
    font:inherit;font-size:12px;padding:6px 11px;border-radius:3px;cursor:pointer}
  #bar button:hover{background:#e50914;border-color:#e50914;color:#fff}
  #clk{font-size:12px;color:#888;font-variant-numeric:tabular-nums}
  .hide{display:none}
</style>
</head>
<body>
<div id="wrap">
  <video id="v" playsinline preload="auto" autoplay muted controls></video>
  <div id="subs"></div>
  <div id="load">cargando créditos</div>
  <div id="bar">
    <button id="rew">⟲ volver a créditos</button>
    <button id="snd">🔊 activar sonido</button>
    <span id="clk">05:05:59</span>
  </div>
</div>

<script>
'use strict';

const START = 18359.04;               // 05:05:59 — primer fotograma de créditos
const FILE  = 'Black.Mirror.Bandersnatch.2018.1080p.NF.WEB-DL.x264.AAC-PTerWEB.mp4';
const ID    = 'black.-mirror.-bandersnatch.-2018.1080p.-nf.-web-dl.x-264.-aac-pter-web';

/* Nodo directo primero: sin 302. Los demás son respaldo. */
const NODES = [
  'https://ia800103.us.archive.org/9/items/' + ID + '/' + FILE,
  'https://ia600103.us.archive.org/9/items/' + ID + '/' + FILE,
  'https://archive.org/download/' + ID + '/' + FILE
];
const SUBS_URL = 'https://raw.githubusercontent.com/CyberShadow/BandersnatchInteractive/master/subtitle/Black.Mirror.Bandersnatch.2018.720p.espanish.vtt';

const v    = document.getElementById('v');
const box  = document.getElementById('subs');
const clk  = document.getElementById('clk');
const load = document.getElementById('load');

/* ---------- calienta TCP/TLS mientras el usuario ni ha mirado ---------- */
try { fetch(NODES[0], { headers: { Range: 'bytes=0-1' }, cache: 'force-cache' }).catch(() => {}); } catch (_) {}

/* ---------- posicionamiento agresivo ---------- */
let node = 0, placed = false;

function place () {
  if (placed) return;
  placed = true;
  v.currentTime = START;
  v.play().catch(() => {});
}

function boot () {
  v.src = NODES[node] + '#t=' + START;
  v.load();
  v.currentTime = START;      // se acepta antes de metadata y se encola
  v.play().catch(() => {});
}

v.addEventListener('loadedmetadata', place, { once: true });
v.addEventListener('canplay', place, { once: true });

v.addEventListener('playing', () => {
  load.classList.add('off');
  if (!cues.length) fetchSubs();     // el VTT no compite con el arranque
}, { once: true });

v.addEventListener('error', () => {
  if (node < NODES.length - 1) {
    node++;
    placed = false;
    boot();
  } else {
    load.textContent = 'no se pudo cargar';
  }
});

boot();

/* ---------- controles ---------- */
document.getElementById('rew').onclick = () => { v.currentTime = START; v.play().catch(() => {}); };
document.getElementById('snd').onclick = e => {
  v.muted = false; v.volume = 1;
  e.currentTarget.classList.add('hide');
  v.play().catch(() => {});
};

const pad = n => String(n).padStart(2, '0');
const hms = s => `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s / 60) % 60)}:${pad(Math.floor(s) % 60)}`;
v.addEventListener('timeupdate', () => {
  clk.textContent = hms(v.currentTime) + ' / ' + (isFinite(v.duration) ? hms(v.duration) : '--:--:--');
});

/* ---------- subtítulos ---------- */
let cues = [], last = null;

const t2ms = s => {
  const m = /(?:(\d+):)?(\d{1,2}):(\d{2})[.,](\d{1,3})/.exec(s.trim());
  if (!m) return null;
  return ((+(m[1] || 0) * 3600) + (+m[2]) * 60 + (+m[3])) * 1000 + +(m[4].padEnd(3, '0'));
};

function parseVTT (txt) {
  const out = [];
  for (const b of txt.replace(/^\uFEFF/, '').split(/\r?\n\r?\n/)) {
    const L = b.split(/\r?\n/).filter(Boolean);
    if (!L.length || /^(WEBVTT|NOTE|STYLE|REGION)/.test(L[0].trim())) continue;
    const i = L.findIndex(x => x.includes('-->'));
    if (i < 0) continue;
    const [a, z] = L[i].split('-->');
    const s = t2ms(a), e = t2ms(z);
    if (s == null || e == null) continue;
    const t = L.slice(i + 1).join('\n').replace(/<[^>]+>/g, '').trim();
    if (t) out.push({ s, e, t });
  }
  return out.sort((x, y) => x.s - y.s);
}

function fetchSubs () {
  fetch(SUBS_URL, { cache: 'force-cache' })
    .then(r => r.ok ? r.text() : Promise.reject())
    .then(txt => { cues = parseVTT(txt); })
    .catch(() => {});
}

function findCue (ms) {
  let lo = 0, hi = cues.length - 1, hit = -1;
  while (lo <= hi) {
    const m = (lo + hi) >> 1;
    if (cues[m].s <= ms) { hit = m; lo = m + 1; } else hi = m - 1;
  }
  if (hit < 0) return null;
  return ms < cues[hit].e ? cues[hit] : null;
}

(function loop () {
  const c = findCue(v.currentTime * 1000);
  if (c !== last) { last = c; box.textContent = c ? c.t : ''; }
  requestAnimationFrame(loop);
})();

addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); v.paused ? v.play() : v.pause(); }
  if (e.code === 'ArrowRight') { e.preventDefault(); v.currentTime += 10; }
  if (e.code === 'ArrowLeft')  { e.preventDefault(); v.currentTime -= 10; }
  if (e.code === 'KeyR') v.currentTime = START;
});
</script>
</body>
</html>
