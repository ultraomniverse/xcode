<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSYCHOTIC</title>
<link rel="preconnect" href="https://static.vecteezy.com">
<link rel="preconnect" href="https://upload.wikimedia.org">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=EB+Garamond:ital@1&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#000}
  body{
    min-height:100vh;
    background-image:url("https://static.vecteezy.com/system/resources/thumbnails/013/425/328/small_2x/halloween-day-concept-cemetery-or-graveyard-in-the-night-with-dark-sky-haunted-cemetery-spooky-and-creepy-burial-ground-horror-scene-of-graveyard-funeral-concept-halloween-day-background-photo.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
  }

  header{
    position:fixed;
    top:.9rem;
    left:1rem;
    right:1rem;
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    padding:1.1rem 5vw 1.3rem;
    background:rgba(0,0,0,.32);
    backdrop-filter:blur(7px) saturate(.85);
    -webkit-backdrop-filter:blur(7px) saturate(.85);
    border:1px solid rgba(255,255,255,.16);
    border-radius:18px;
    box-shadow:0 6px 34px rgba(0,0,0,.45);
    overflow:hidden;
  }

  .brand{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(8px,2vw,26px);
  }

  .gun{
    width:clamp(42px,7vw,92px);
    height:auto;
    object-fit:contain;
    mix-blend-mode:screen;
    filter:brightness(1.5) contrast(1.15) drop-shadow(0 0 14px rgba(0,0,0,.9));
  }
  .gun.l{transform:scaleX(-1)}

  h1{
    font-family:'Cinzel',serif;
    font-weight:900;
    font-size:clamp(1.5rem,5vw,3rem);
    line-height:1;
    letter-spacing:.14em;
    text-indent:.14em;
    color:#fff;
    white-space:nowrap;
    text-shadow:0 2px 18px rgba(0,0,0,.75);
  }

  .sub{
    font-family:'EB Garamond',serif;
    font-style:italic;
    font-size:clamp(.68rem,1.5vw,.95rem);
    letter-spacing:.1em;
    color:#ff2020;
    margin-top:.55rem;
    max-width:52ch;
    text-shadow:0 0 16px rgba(255,32,32,.4), 0 1px 3px rgba(0,0,0,.9);
  }

  .sigs{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    gap:clamp(30px,7vw,90px);
    margin-top:.9rem;
  }

  .sig{
    width:clamp(64px,9vw,116px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.45rem;
  }

  .ink{position:relative;width:100%;aspect-ratio:2.7/1}
  .ink img,.ink svg{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:contain;
    mix-blend-mode:screen;
  }
  .ink .flip{filter:invert(1)}

  .name{
    font-family:'Cinzel',serif;
    font-size:.44rem;
    letter-spacing:.28em;
    text-indent:.28em;
    color:rgba(255,255,255,.5);
    text-shadow:0 1px 8px rgba(0,0,0,.8);
  }

  main{height:100vh}
</style>
</head>
<body>

  <header>
    <div class="brand">
      <img class="gun l" alt="" src="https://freepngimg.com/thumb/revolver/138059-revolver.png">
      <h1>PSYCHOTIC</h1>
      <img class="gun r" alt="" src="https://freepngimg.com/thumb/revolver/138059-revolver.png">
    </div>

    <p class="sub">The future of horrific, chaotic and stressful streaming...</p>

    <div class="sigs">

      <div class="sig">
        <div class="ink">
          <img class="flip" alt="" src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/B%C3%A9la_Tarr_signature.svg/960px-B%C3%A9la_Tarr_signature.svg.png">
          <img alt="Béla Tarr" src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/B%C3%A9la_Tarr_signature.svg/960px-B%C3%A9la_Tarr_signature.svg.png">
        </div>
        <span class="name">BÉLA TARR</span>
      </div>

      <div class="sig">
        <div class="ink">
          <svg viewBox="0 0 340 120" role="img" aria-label="Charlie Brooker"
               fill="none" stroke="#fff" stroke-width="3.4"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M18,88 C22,60 30,34 44,26 C54,20 58,30 50,42 C42,54 30,66 36,72 C44,80 60,70 70,56"/>

            <path d="M98,76 C106,66 114,58 120,62 C126,66 118,74 112,78"/>
            <path d="M112,78 C120,68 128,60 134,64 C140,68 132,76 126,80"/>
            <path d="M126,80 C134,70 142,62 148,66 C154,70 146,78 140,82"/>
            <path d="M160,84 C168,60 176,34 190,28 C200,24 204,34 196,44 C190,52 182,58 188,62 C196,68 208,58 216,46"/>
            <path d="M216,46 C212,58 208,68 214,72 C220,76 230,68 236,58"/>
            <path d="M236,58 C242,50 248,46 252,50 C256,54 250,62 246,68"/>
            <path d="M246,68 C252,60 258,54 264,58 C270,62 262,70 258,74"/>
            <path d="M258,74 C266,64 274,58 280,62 C286,66 278,74 272,78"/>
            <path d="M272,78 C280,68 288,62 294,66 C300,70 292,78 286,82"/>
            <path d="M286,82 C292,74 298,70 304,74"/>
            <path d="M14,100 C80,112 200,108 320,94"/>
            <circle cx="103" cy="43" r="2.2" fill="#fff" stroke="none"/>
          </svg>
        </div>
        <span class="name">CHARLIE BROOKER</span>
      </div>

    </div>
  </header>

  <main></main>

</body>
</html>
