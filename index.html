<!DOCTYPE html>
<html>
<head>
<style>
  html,body{margin:0;padding:0;background:#000}
  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:30px;
    background-image:url("https://static.vecteezy.com/system/resources/thumbnails/013/425/328/small_2x/halloween-day-concept-cemetery-or-graveyard-in-the-night-with-dark-sky-haunted-cemetery-spooky-and-creepy-burial-ground-horror-scene-of-graveyard-funeral-concept-halloween-day-background-photo.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
  }
  img.cruz{
    width:clamp(120px,30vw,240px);
    height:auto;
    display:block;
    filter:invert(1) drop-shadow(0 0 26px rgba(0,0,0,.95)) drop-shadow(0 0 60px rgba(0,0,0,.8));
  }
  h1{
    margin:0;
    font-family:Georgia,'Times New Roman',serif;
    font-size:clamp(11px,2.4vw,20px);
    letter-spacing:.34em;
    text-transform:uppercase;
    color:#fff;
    text-shadow:0 0 24px #000,0 2px 6px #000;
  }
</style>
</head>
<body>
<img class="cruz" src="https://upload.wikimedia.org/wikipedia/commons/5/5b/Justice-cross.svg" alt="">

</body>
</html>
