<!DOCTYPE html>
<html lang="es-419">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Bandersnatch — reproductor interactivo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">
  <div id="stage">
    <video id="player"
           src="bandersnatch.mp4"
           preload="auto"
           playsinline
           tabindex="-1"
           draggable="false"
           disablepictureinpicture
           disableremoteplayback
           controlslist="nodownload noplaybackrate noremoteplayback"></video>

    <div id="clicklayer"></div>
    <div id="subs" aria-live="polite"></div>
    <div id="choices" class="hidden">
      <div id="choicelist"></div>
      <div id="timerwrap"><div id="timerbar"></div></div>
    </div>

    <div id="hud">
      <div id="segbar"><div id="segfill"></div></div>
      <div id="globalbar"><div id="globalfill"></div></div>
    </div>

    <button id="fsbtn" type="button" title="Pantalla completa simulada">⤢</button>
    <button id="exitfs" type="button" class="hidden" title="Salir (Esc)">✕</button>
  </div>

  <div id="start">
    <div class="startbox">
      <p class="kicker">BLACK MIRROR</p>
      <h1>BANDERSNATCH</h1>
      <p class="sub">Reproductor interactivo · subtítulos en español (Latinoamérica)</p>
      <button id="play" type="button">REPRODUCIR</button>
      <p class="hint">Las decisiones se toman con el ratón. La barra de tiempo está bloqueada.</p>
      <p class="hint small">La primera vez hay que pulsar «REPRODUCIR» para que el navegador permita el audio.</p>
      <p id="err" class="err hidden"></p>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
