<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XCODE · streaming by UltraOmniverse</title>
<link rel="preconnect" href="https://archive.org" crossorigin>
<link rel="preconnect" href="https://upload.wikimedia.org" crossorigin>
<link rel="dns-prefetch" href="//en.wikipedia.org">
<link rel="dns-prefetch" href="//mohetios.github.io">
<style>
:root{--bg:#0a0a0c;--panel:#121216;--p2:#17171d;--bd:#26262f;--fg:#e9e9ec;--mut:#8b8b96;--top:2147482000}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
@supports(height:100dvh){html,body{height:100dvh}}
body{background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--bd);background:var(--panel)}
.logo{font-weight:700;letter-spacing:.26em;font-size:15px}
.by{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#5f5f6b}
header h1{margin:0;font-size:12px;font-weight:500;color:#cfcfd6}
.sp{flex:1}
header button,.gate button,.end button{border:1px solid var(--bd);background:transparent;border-radius:99px;padding:6px 14px;font-size:12px}
.pri{background:#fff!important;color:#000!important;border-color:#fff!important;font-weight:500}
body[data-view=home] #btnBack,body[data-view=home] #hTitle{display:none}
body:not([data-mode=branch]) .only-branch{display:none!important}
body:not([data-mode=chaps]) .only-chaps{display:none!important}
#home{flex:1;min-height:0;overflow:auto;padding:24px 28px 40px}
body[data-view=player] #home{display:none}
.row{margin-bottom:28px}
.row h2{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);font-weight:500;margin:0 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px;max-width:1100px}
.card{display:flex;flex-direction:column;gap:8px;padding:0;border:0;background:none;text-align:left;border-radius:12px}
.poster{position:relative;aspect-ratio:2/3;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:linear-gradient(160deg,#1b1b24,#0d0d10);transition:transform .14s,box-shadow .14s}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;text-align:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#5f5f6b}
.badge{position:absolute;left:8px;top:8px;z-index:2;font-size:9px;letter-spacing:.12em;text-transform:uppercase;background:rgba(0,0,0,.78);border:1px solid rgba(255,255,255,.3);padding:2px 7px;border-radius:99px}
.prog{position:absolute;left:0;bottom:0;height:4px;background:#fff;z-index:2}
.meta b{display:block;font-weight:500}.meta span{font-size:11px;color:var(--mut)}
.card:hover .poster,.card:focus .poster{transform:translateY(-4px);box-shadow:0 0 0 3px #fff,0 16px 36px rgba(0,0,0,.6)}
.card:focus{outline:none;box-shadow:none}
.credit{margin-top:30px;padding-top:14px;border-top:1px solid var(--bd);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#5f5f6b;line-height:1.9}
#player{flex:1;min-height:0;display:none;flex-direction:column;padding:12px;gap:8px;position:relative}
body[data-view=player] #player{display:flex}
#stage{position:relative;flex:1;min-height:0;background:#000;border:1px solid var(--bd);border-radius:10px;overflow:hidden;outline:none}
#stage video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
#stage video.sb{position:absolute;inset:0;visibility:hidden;pointer-events:none}
.gate,.end{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#000;text-align:center;padding:24px}
.end{display:none;background:rgba(0,0,0,.95)}.end.on{display:flex}
.gate h2,.end h2{margin:0;font-size:22px;font-weight:500;letter-spacing:.12em}
.gate .s{margin:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#6c6c78}
.gate p,.end p{margin:0;max-width:520px;font-size:12px;color:var(--mut)}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.err{color:#ff9d9d!important}
#spin{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;display:none;z-index:35;pointer-events:none}
#spin.on{display:block}@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(0,0,0,.92);border:1px solid rgba(255,255,255,.3);font-size:11px;padding:7px 14px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:86%;text-align:center}
#toast.on{opacity:1}
.ov{position:absolute;left:0;right:0;bottom:0;min-height:36%;background:linear-gradient(to top,rgba(0,0,0,.97),rgba(0,0,0,.86) 60%,rgba(0,0,0,.1));display:none;flex-direction:column;justify-content:flex-end;padding-bottom:18px;z-index:30}
.ov.on,.pad.on{display:flex}
.ov .q{font-size:11px;letter-spacing:.24em;color:#9a9aa4;text-align:center;margin-bottom:10px}
.opts{display:flex;gap:14px;justify-content:center;padding:0 24px}
.opt{flex:1;max-width:340px;padding:15px 14px;border:1px solid rgba(255,255,255,.35);border-radius:10px;background:rgba(255,255,255,.07);font-size:13px;letter-spacing:.06em}
.opt:focus{transform:scale(1.03)}
.timer{height:4px;background:rgba(255,255,255,.18);margin:14px 24px 0;border-radius:2px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:#fff}
.pad{position:absolute;left:0;right:0;bottom:0;padding:16px;background:rgba(0,0,0,.94);display:none;flex-direction:column;align-items:center;gap:8px;z-index:30}
.pad .disp{letter-spacing:.55em;font-size:20px;font-variant-numeric:tabular-nums}
.keys{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:340px}
.keys button{width:42px;height:42px;border-radius:8px;border:1px solid rgba(255,255,255,.34);background:rgba(255,255,255,.06);font-size:16px}
.ctl{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ctl button{min-width:34px;height:31px;border-radius:6px;border:1px solid var(--bd);background:var(--p2);font-size:13px;padding:0 8px}
.ctl button.on{background:#fff;color:#000}.ctl button.off{opacity:.45}
.ctl .t{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums;min-width:100px}
.ctl input[type=range]{flex:1 1 140px;min-width:120px;accent-color:#fff}
aside{display:none;position:fixed;right:0;top:0;bottom:0;width:min(420px,92vw);z-index:60;background:var(--panel);border-left:1px solid var(--bd);flex-direction:column;box-shadow:-12px 0 34px rgba(0,0,0,.75)}
aside.show{display:flex}
aside .sec{padding:12px 14px;border-bottom:1px solid var(--bd)}
aside h3{margin:0 0 8px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:500}
.opt2{display:flex;align-items:center;gap:8px;font-size:12px;margin-top:6px;flex-wrap:wrap}
.opt2 button{border:1px solid var(--bd);background:transparent;border-radius:6px;padding:4px 9px;font-size:11px}
.opt2 input{accent-color:#fff}
#chap{flex:1;min-height:0;overflow:auto;padding:6px 8px}
#chap button{display:flex;gap:10px;width:100%;text-align:left;border:1px solid transparent;border-radius:6px;background:none;color:#a9a9b4;padding:9px;margin-bottom:2px;font-size:13px}
#chap .n{min-width:56px;font-size:11px;color:#5f5f6b;font-variant-numeric:tabular-nums}
#chap button.act{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.4)}
#map{flex:1;min-height:0;overflow:auto;padding:8px}
#log{max-height:32%;overflow:auto;padding:8px 14px;font-size:11px}
.ent{padding:6px 0;border-bottom:1px dashed #22222a;color:var(--mut)}.ent b{color:var(--fg);font-weight:500}
.ent button{background:none;border:0;color:#7a7a88;font-size:10px;text-decoration:underline;padding:2px 0}
.empty{color:#55555f;font-size:11px;padding:8px 0}
button:focus,input:focus{outline:none;box-shadow:0 0 0 3px rgba(255,255,255,.95),0 0 22px rgba(255,255,255,.35)}
.ctl button:focus,header button:focus,.gate button:focus,.end button:focus,.opt:focus,.keys button:focus{background:#fff;color:#000}
body.tv .meta b{font-size:18px}body.tv .grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:30px}
body.tv #home{padding:36px 52px}
body.tv .ctl button{height:46px;min-width:50px;font-size:18px}body.tv .ctl .t{font-size:14px}
body.tv #chap button{font-size:16px;padding:13px}
body.tv .gate h2{font-size:36px}body.tv .gate p{font-size:15px;max-width:660px}
body.tv .gate button,body.tv .end button{font-size:17px;padding:12px 34px}
body.tv #player{padding:6px}body.tv #stage{border:0;border-radius:0}
body.tv .opt{font-size:21px;padding:26px;border-width:2px}body.tv .ov .q{font-size:15px}
body.tv .timer{height:7px}
body.tv .keys{max-width:none;gap:14px}body.tv .keys button{width:78px;height:78px;font-size:28px}body.tv .pad .disp{font-size:38px}
body.pseudo header{display:none}
body.pseudo #player{padding:0;gap:0}
body.pseudo #stage{position:fixed;inset:0;z-index:var(--top);border:0;border-radius:0}
body.pseudo .ctl{position:fixed;left:0;right:0;bottom:0;z-index:calc(var(--top) + 2);padding:8px 16px;background:linear-gradient(to top,rgba(0,0,0,.9),transparent);opacity:0;transition:opacity .18s;pointer-events:none}
body.pseudo.showctl .ctl{opacity:1;pointer-events:auto}
body.pseudo aside{z-index:calc(var(--top) + 3)}
</style>
</head>
<body data-view="home" data-mode="plain">
<header>
  <span class="logo">XCODE</span><span class="by">by UltraOmniverse</span><span class="sp"></span>
  <h1 id="hTitle"></h1><span class="sp"></span>
  <button id="btnBack">‹ Catálogo</button>
</header>

<section id="home">
  <div id="rows"></div>
  <div class="credit"><b>XCODE</b> · by UltraOmniverse<br>Creada por Daniel Alejandro Gascón Castaño — Founder</div>
</section>

<section id="player">
  <div id="stage" tabindex="-1">
    <video id="v" preload="auto" playsinline webkit-playsinline><track id="trk" kind="subtitles" srclang="es" label="Español"></video>
    <div id="spin"></div><div id="toast"></div>
    <div class="gate" id="gate">
      <h2 id="gT"></h2><p class="s" id="gS"></p><p id="gD"></p>
      <div class="btns">
        <button class="pri" id="btnStart">Empezar</button>
        <button id="btnResume" style="display:none">Reanudar</button>
        <button id="btnCat">Catálogo</button>
      </div>
      <p id="gmsg"></p>
    </div>
    <div class="ov" id="ov"><div class="q">ELIGE</div><div class="opts" id="opts"></div><div class="timer"><i id="tbar"></i></div></div>
    <div class="pad" id="pad"><div class="disp" id="disp">-----</div><div class="keys" id="keys"></div></div>
    <div class="end" id="end"><h2>Fin</h2><p id="endP"></p>
      <div class="btns"><button class="pri" id="btnAgain">Volver a empezar</button><button id="btnCat2">Catálogo</button></div>
    </div>
  </div>
  <div class="ctl">
    <button id="btnPlay" title="Reproducir / pausa">▶</button>
    <button id="btnB" title="−10 s">↺</button>
    <button id="btnF" title="+10 s">↻</button>
    <span class="t" id="time">0:00 / 0:00</span>
    <input id="seek" type="range" min="0" max="1000" value="0" step="1">
    <button id="btnCC" title="Subtítulos (c)">CC</button>
    <button id="btnPanel" title="Panel (l)">☰</button>
    <button id="btnFs" title="Pantalla grande (f)">⛶</button>
  </div>
  <aside id="aside">
    <div class="sec"><h3>Ajustes</h3>
      <div class="opt2"><label><input type="checkbox" id="tvMode"> Modo TV (letras grandes)</label></div>
      <div class="opt2"><label><input type="checkbox" id="showSub" checked> Subtítulos</label></div>
      <div class="opt2"><label><input type="checkbox" id="sysFs"> Pantalla completa del sistema</label></div>
      <div class="opt2 only-branch"><label><input type="checkbox" id="noTimer"> Sin temporizador en decisiones</label></div>
      <div class="opt2">Sincronía <button id="subM">− 0.5 s</button><button id="subP">+ 0.5 s</button><span id="subOff">0.0 s</span></div>
      <div class="opt2"><button id="btnSubFile">Cargar subtítulos (.srt / .vtt)</button><input id="subFile" type="file" accept=".srt,.vtt,text/vtt" style="display:none"></div>
      <div class="opt2 only-branch"><button id="btnRestart">Reiniciar película</button></div>
      <div class="opt2" id="subState" style="color:#8b8b96">—</div>
    </div>
    <div class="sec only-chaps"><h3>Capítulos</h3></div>
    <div id="chap" class="only-chaps"></div>
    <div class="sec only-branch" style="padding-bottom:4px"><h3>Mapa del árbol</h3></div>
    <div id="map" class="only-branch"></div>
    <div class="sec only-branch" style="padding-bottom:4px"><h3>Registro</h3></div>
    <div id="log" class="only-branch"></div>
  </aside>
</section>

<script>
(()=>{"use strict";
/*@@BDATA@@*/const RAW="",GRAW="",PRAW="",ERAW="";

/* ===== CATÁLOGO: todo por enlaces. Añade títulos aquí =====
   src:  enlaces de video (si falla o tarda, pasa al siguiente)
   subs: enlaces .vtt/.srt (se piden en paralelo; gana el primero que responda)
   poster: enlace de portada; wiki: título en Wikipedia para sacar la portada si el enlace falla
   mode:"branch": película interactiva (usa los datos de arriba) */
const CATALOG=[
 {id:"bander",title:"Black Mirror: Bandersnatch",year:2018,dur:"5 h 12 min",mode:"branch",start:"1A",
  desc:"Cada elección salta al segmento que le corresponde. Muévete con flechas o puntero y confirma con OK.",
  poster:"https://upload.wikimedia.org/wikipedia/en/5/53/Black_mirror_bandersnatch_poster.jpg",wiki:"Black_Mirror:_Bandersnatch",
  src:["https://archive.org/download/black.-mirror.-bandersnatch.-2018.1080p.-nf.-web-dl.x-264.-aac-pter-web/Black.Mirror.Bandersnatch.2018.1080p.NF.WEB-DL.x264.AAC-PTerWEB.mp4"],
  subs:["https://mohetios.github.io/BandersnatchInteractive/subtitle/Black.Mirror.Bandersnatch.2018.720p.espanish.vtt"],
  credits:"Bandersnatch · Black Mirror"},
 {id:"satan",title:"Sátántangó",year:1994,dur:"7 h 19 min",
  desc:"Béla Tarr. Blanco y negro sobre una aldea húngara que espera a un hombre al que creían muerto.",
  poster:"https://upload.wikimedia.org/wikipedia/en/6/69/S%C3%A1t%C3%A1ntang%C3%B3_%282019_Rerelease_Poster%29.jpeg",wiki:"Sátántangó_(film)",
  src:["https://archive.org/download/satantango.-1994.-hungarian.-1080p.-blu-ray.-h-264.-aac-vxt/Satantango.1994.HUNGARIAN.1080p.BluRay.H264.AAC-VXT.mp4"],
  subs:["https://www.subtitlecat.com/subs/1324/Satantango.1994.HUNGARIAN.720p.BluRay.H264.AAC-VXT-es-419.srt","https://www.subtitlecat.com/subs/1249/Satantango.1994.HUNGARIAN.720p.BluRay.H264.AAC-VXT-es.srt"],
  chapters:[{t:0,n:"Inicio"},{t:632.75,n:"Noticias de su venida"},{t:8237.9,n:"Intermedio"},{t:8245.75,n:"El trabajo de la araña I"},{t:13078.1,n:"La obra de la araña II"},{t:15705.4,n:"Intermedio"},{t:15713.2,n:"Irimias hace un discurso"},{t:16551.5,n:"La perspectiva, vista desde el frente"},{t:21598.75,n:"La perspectiva, vista desde atrás"}],
  credits:"Sátántangó · Béla Tarr"},
 {id:"bbb",title:"Big Buck Bunny",year:2008,dur:"9 min 56 s",
  desc:"Corto de prueba de la Blender Foundation: sirve para comprobar que todo funciona.",
  poster:"https://upload.wikimedia.org/wikipedia/commons/c/c5/Big_buck_bunny_poster_big.jpg",wiki:"Big_Buck_Bunny",
  src:["https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"],subs:[],credits:"Blender Foundation"}
];
/* Proxy CORS de último recurso para subtítulos de sitios que no permiten CORS (servicio de terceros) */
const PROXIES=[u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u)];

const $=id=>document.getElementById(id);
const vMain=$("v"),stage=$("stage"),gate=$("gate"),endBox=$("end"),aside=$("aside"),chapEl=$("chap"),
  seek=$("seek"),btnPlay=$("btnPlay"),btnCC=$("btnCC"),showSub=$("showSub"),gmsg=$("gmsg"),btnStart=$("btnStart"),
  ov=$("ov"),optsEl=$("opts"),tbar=$("tbar"),pad=$("pad"),keysEl=$("keys"),dispEl=$("disp"),mapEl=$("map"),logEl=$("log");
let v=vMain,cur=null,seg=null,srcIdx=0,started=false,pseudo=false,subRaw=null,subOff=0,subUrl=null,subOk=false,subGen=0,
    saveT=0,ctlT=0,toastT=0,stallT=0,lastKey=0,dragging=false,curChap=-1,st={},shown=false,held=false,seq=0,pend=null,
    ovKey=null,code="",log=[],prepAt=0,prepDone=true,cands=[],noTimer=false;
const SEG={},CH={},GRP={},PREC={},EFF={},SB=[],pool=[];
const isB=()=>!!cur&&cur.mode==="branch";
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=t=>{t=Math.max(0,Math.floor(t||0));const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;
  return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0");};
const LS={get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},
          set(k,x){try{localStorage.setItem(k,JSON.stringify(x));}catch(e){}}};
const fp=()=>({preventScroll:true});
const spin=on=>$("spin").classList.toggle("on",!!on);
const any=ps=>new Promise((res,rej)=>{let n=ps.length,d=false;if(!n)rej();ps.forEach(p=>p.then(x=>{if(!d){d=true;res(x);}},()=>{if(--n===0&&!d)rej();}));});
function toast(m,ms){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),ms||3500);}

/* ===== PORTADAS: enlace → caché → Wikipedia ===== */
const posterCache=LS.get("xc_posters")||{};
async function wikiPoster(t){
  try{
    const r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(t.wiki));
    const j=await r.json();
    return (j.thumbnail&&j.thumbnail.source)||(j.originalimage&&j.originalimage.source)||null;
  }catch(e){return null;}
}
function loadPoster(img,t){
  const list=[posterCache[t.id],t.poster].filter((x,i,a)=>x&&a.indexOf(x)===i);let i=0,wiki=false;
  img.referrerPolicy="no-referrer";img.decoding="async";
  img.onload=()=>{if(posterCache[t.id]!==img.src){posterCache[t.id]=img.src;LS.set("xc_posters",posterCache);}};
  img.onerror=async()=>{
    if(i<list.length){img.src=list[i++];return;}
    if(!wiki&&t.wiki){wiki=true;const u=await wikiPoster(t);if(u){img.src=u;return;}}
    img.remove();
  };
  img.onerror();
}

/* ===== CATÁLOGO ===== */
const saved=id=>{const p=LS.get("xc_pos_"+id);return p&&p.t>60&&!p.done?p:null;};
const warmed=new Set();let warmT=0;
function warm(t){   /* abre DNS, TLS y redirecciones antes de pulsar Empezar */
  const u=t.src[0];if(warmed.has(t.id)||!/^https?:/.test(u))return;warmed.add(t.id);
  try{fetch(u,{method:"HEAD",mode:"no-cors"}).catch(()=>{});}catch(e){}
}
function card(t){
  const p=t.mode==="branch"?null:saved(t.id),b=document.createElement("button");b.type="button";b.className="card";b.dataset.id=t.id;
  b.innerHTML='<div class="poster"><div class="ph">'+esc(t.title)+'</div><span class="badge">'+(t.mode==="branch"?"interactiva":esc(t.dur))+'</span>'+
    (p&&p.d?'<i class="prog" style="width:'+Math.min(100,p.t/p.d*100)+'%"></i>':'')+
    '</div><div class="meta"><b>'+esc(t.title)+'</b><span>'+esc(t.year)+' · '+esc(t.dur)+'</span></div>';
  const im=document.createElement("img");im.alt="Portada de "+t.title;
  const po=b.querySelector(".poster");po.insertBefore(im,po.querySelector(".badge"));
  loadPoster(im,t);
  b.onclick=()=>openTitle(t.id);
  b.addEventListener("mouseenter",()=>{if(Date.now()-lastKey>250)b.focus(fp());});
  b.addEventListener("focus",()=>{clearTimeout(warmT);warmT=setTimeout(()=>warm(t),150);});
  return b;
}
function renderHome(){
  const rows=$("rows");rows.innerHTML="";
  const mk=(name,list)=>{const r=document.createElement("div");r.className="row";r.innerHTML="<h2>"+esc(name)+"</h2>";
    const g=document.createElement("div");g.className="grid";list.forEach(t=>g.appendChild(card(t)));r.appendChild(g);rows.appendChild(r);};
  const cont=CATALOG.filter(t=>t.mode!=="branch"&&saved(t.id));
  if(cont.length)mk("Continuar viendo",cont);

/* ===== SUBTÍTULOS (enlaces en paralelo + caché) ===== */
const ts=ms=>{ms=Math.max(0,Math.round(ms));const p=(n,l)=>String(n).padStart(l,"0");
  return p(Math.floor(ms/3600000),2)+":"+p(Math.floor(ms%3600000/60000),2)+":"+p(Math.floor(ms%60000/1000),2)+"."+p(ms%1000,3);};
function stamp(t,off){
  const m=t.trim().match(/^(?:(\d+):)?(\d{1,2}):(\d{2})[,.](\d{1,3})$/);
  return m?ts((+m[1]||0)*3600000+(+m[2])*60000+(+m[3])*1000+(+m[4].padEnd(3,"0"))+off):null;
}
function toVtt(raw,off){
  const srt=/,\d{3}\s*-->/.test(raw),out=["WEBVTT",""];
  for(const line of raw.replace(/^\uFEFF/,"").replace(/\r/g,"").split("\n")){
    if(line.indexOf("-->")>0){
      const p=line.split("-->"),a=stamp(p[0],off),b=stamp((p[1]||"").trim().split(/\s+/)[0],off);
      if(a&&b){out.push(a+" --> "+b);continue;}
    }
    if(/^WEBVTT/.test(line)||(srt&&/^\d+$/.test(line.trim())))continue;
    out.push(line);
  }
  return out.join("\n");
}
function applySub(){
  stage.querySelectorAll("video").forEach(el=>{const tt=el.textTracks&&el.textTracks[0];if(tt)tt.mode=(subOk&&showSub.checked)?"showing":"hidden";});
}
function refreshCC(){btnCC.classList.toggle("on",subOk&&showSub.checked);btnCC.classList.toggle("off",!subOk);}
function mountSub(){
  if(!subRaw)return;
  const old=subUrl;subUrl=URL.createObjectURL(new Blob([toVtt(subRaw,subOff)],{type:"text/vtt"}));
  stage.querySelectorAll("track").forEach(t=>{t.src=subUrl;});
  if(old)setTimeout(()=>URL.revokeObjectURL(old),5000);
  $("subOff").textContent=(subOff/1000).toFixed(1)+" s";applySub();refreshCC();
}
function setSub(raw,label){
  subRaw=raw;subOk=true;subOff=0;
  $("subState").textContent="Subtítulos: "+label+" · "+Math.max(1,Math.round(raw.length/1024))+" KB";
  toast("Subtítulos cargados");mountSub();
}
const getSub=async(u,px)=>{const r=await fetch(px?px(u):u);if(!r.ok)throw 0;const x=await r.text();if(x.indexOf("-->")<0)throw 0;return x;};
async function bootSubs(t){
  const my=++subGen,subs=t.subs||[];
  subRaw=null;subOk=false;stage.querySelectorAll("track").forEach(x=>x.removeAttribute("src"));refreshCC();
  if(!subs.length){$("subState").textContent="Este título no trae subtítulos.";return;}
  for(const u of subs){const c=LS.get("xc_sub_"+u);if(typeof c==="string"&&c.indexOf("-->")>0){setSub(c,u.split("/").pop()+" (caché)");return;}}
  $("subState").textContent="Buscando subtítulos…";
  let got=null;
  try{got=await any(subs.map(u=>getSub(u).then(x=>({x,u}))));}catch(e){}
  if(my!==subGen)return;
  if(!got){try{got=await any(subs.flatMap(u=>PROXIES.map(p=>getSub(u,p).then(x=>({x,u})))));}catch(e){}}
  if(my!==subGen)return;
  if(got){LS.set("xc_sub_"+got.u,got.x);setSub(got.x,got.u.split("/").pop());}
  else $("subState").textContent="No se pudieron descargar. Usa «Cargar subtítulos».";
}

/* ===== MOTOR BANDERSNATCH ===== */
const KEYS=["sp","tt","td","cs","w1","2b","3j","pt","cd","cj","sj","tud","lsd","vh","3l","3s","3z","ps","wb","kd","bo","5v","pc","sc","ty","cm","pr","3ad","s3af","nf","np","ne","pp","tp","bup","be","pe","pae","te","snt","8j","8d","8m","8q","8s","8v","vs","scs","3ab","3ac","3aj","3ah","3ak","3al","3af","5h","5ac","5ag","5ad","6c","8a","sj2"];
function resetState(){st={};KEYS.forEach(k=>st[k]=false);st.ps="n";st.pc="n";st.vs="n";}
const cloneState=()=>JSON.parse(JSON.stringify(st));
function parseAll(){
  [SEG,CH,GRP,PREC,EFF].forEach(o=>{for(const k in o)delete o[k];});
  RAW.trim().split("\n").forEach(l=>{
    const p=l.split("|"),id=(p[0]||"").trim();if(!id)return;
    const s={s:+p[1],e:+p[2],d:(p[3]||"").trim()};
    if(p[4]&&p[4].trim()!=="-"){s.ws=+p[4];s.we=+p[5];}
    const c=(p[6]||"").trim();
    if(c==="#CODE")s.pad=true;
    else if(c){const o=c.split("~").map(x=>{const i=x.indexOf(">");return i<0?null:{t:x.slice(0,i).trim(),g:x.slice(i+1).trim()};}).filter(Boolean);if(o.length)CH[id]=o;}
    SEG[id]=s;
  });
  GRAW.trim().split("\n").forEach(l=>{
    const p=l.split("|"),n=(p[0]||"").trim();if(!n)return;
    GRP[n]=(p[1]||"").split("~").map(x=>{const i=x.indexOf("?"),r=(i<0?x:x.slice(0,i)).trim();return i<0?{s:r}:{s:r,c:x.slice(i+1).trim()};});
  });
  PRAW.trim().split("\n").forEach(l=>{const i=l.indexOf("|");if(i>0)PREC[l.slice(0,i).trim()]=l.slice(i+1).trim();});
  ERAW.trim().split("\n").forEach(l=>{const p=l.split("|");if(p[0])EFF[p[0].trim()]=(p[1]||"").split(";");});
  if(!SEG["3Ax"]&&!GRP["3Ax"])GRP["3Ax"]=[{s:"2BChoice"}];
}
function ev(expr){
  if(!expr)return true;
  let i=0;const sk=()=>{while(expr[i]===" ")i++;};
  function or(){let x=and();sk();while(expr[i]==="|"){i++;const r=and();x=x||r;sk();}return x;}
  function and(){let x=un();sk();while(expr[i]==="&"){i++;const r=un();x=x&&r;sk();}return x;}
  function un(){sk();if(expr[i]==="!"){i++;return !un();}if(expr[i]==="("){i++;const x=or();sk();if(expr[i]===")")i++;return x;}return atom();}
  function atom(){sk();let s="";while(i<expr.length&&/[A-Za-z0-9_]/.test(expr[i])){s+=expr[i];i++;}
    if(!s)return true;
    if(expr[i]==="="){i++;let x="";while(i<expr.length&&/[A-Za-z0-9_]/.test(expr[i])){x+=expr[i];i++;}return st[s]===x;}
    return !!st[s];}
  try{return !!or();}catch(e){return true;}
}
function pick(g,d){
  if(d>14)return null;
  for(const e of g){
    const at=e.s[0]==="@",name=at?e.s.slice(1):e.s,ex=(e.c&&PREC[e.c]!==undefined)?PREC[e.c]:PREC[name];
    if(!ev(ex))continue;
    const r=at?(GRP[name]?pick(GRP[name],d+1):(SEG[name]?name:null)):(SEG[name]?name:(GRP[name]?pick(GRP[name],d+1):null));
    if(r)return r;
  }
  return null;
}
function resolveTarget(n){
  if(!n)return null;
  if(SEG[n]){if(PREC[n]!==undefined&&!ev(PREC[n])&&SEG[n+"cd"]&&ev(PREC[n+"cd"]))return n+"cd";return n;}
  return GRP[n]?pick(GRP[n],0):null;
}
function nextOf(id){const s=SEG[id];if(!s)return null;if(GRP[id]){const r=pick(GRP[id],0);if(r)return r;}return resolveTarget(s.d);}
function applyKV(list){for(const kv of list){const i=kv.indexOf("=");if(i<0)continue;const k=kv.slice(0,i),x=kv.slice(i+1);st[k]=x==="1"?true:x==="0"?false:x;}}
const GEFF={FlushThemChoice3X:["ps=f"],ThrowThemChoice:["ps=b"]};

/* ===== VIDEOS: principal + relevos precargados ===== */
function bind(el){
  const me=()=>el===v;
  el.addEventListener("play",()=>{if(me())btnPlay.textContent="❚❚";});
  el.addEventListener("pause",()=>{if(me()){btnPlay.textContent="▶";if(started&&!isB())saveProg();}});
  el.addEventListener("timeupdate",()=>{if(me()){ui();if(started&&!isB()&&Date.now()-saveT>5000){saveT=Date.now();saveProg();}}});
  el.addEventListener("waiting",()=>{if(me()&&started)spin(1);});
  el.addEventListener("seeking",()=>{if(me()&&started)spin(1);});
  ["playing","canplay","seeked"].forEach(n=>el.addEventListener(n,()=>{if(me()&&!el.seeking)spin(0);}));
  el.addEventListener("progress",()=>{
    if(!me()||started||!cur||gmsg.className==="err")return;
    const b=el.buffered,a=b.length?b.end(b.length-1):0;gmsg.textContent=a>=6?"Listo.":"Cargando el video… ("+Math.floor(a)+" s)";
  });
  el.addEventListener("loadedmetadata",()=>{
    if(el._want!=null&&Math.abs(el.currentTime-el._want)>.5){try{el.currentTime=el._want;}catch(e){}}
    if(me()){clearTimeout(stallT);if(!started&&gmsg.className!=="err")gmsg.textContent="Listo para reproducir.";}
  });
  el.addEventListener("ended",()=>{if(me()&&started)finish();});
  el.addEventListener("error",()=>{
    if(!el.getAttribute("src"))return;
    if(!me()){const i=SB.findIndex(x=>x.el===el);if(i>=0){SB.splice(i,1);recycle(el);}return;}
    nextSrc();
  });
}
bind(vMain);
function makeVideo(){
  const el=document.createElement("video");el.className="sb";el.preload="auto";el.muted=true;
  el.setAttribute("playsinline","");el.setAttribute("webkit-playsinline","");
  const tr=document.createElement("track");tr.kind="subtitles";tr.srclang="es";tr.label="Español";if(subUrl)tr.src=subUrl;
  el.appendChild(tr);stage.insertBefore(el,vMain.nextSibling);bind(el);applySub();return el;
}
function recycle(el){
  el._want=null;el.pause();el.removeAttribute("src");el.load();el.classList.add("sb");el.muted=true;
  if(el===vMain)return;
  if(pool.length<2)pool.push(el);else el.remove();
}
const releaseStandbys=()=>{while(SB.length)recycle(SB.pop().el);};
function loadMain(u){
  clearTimeout(stallT);v.preload="auto";v.src=u;v.load();
  stallT=setTimeout(()=>{if(cur&&!started&&v.readyState<1&&srcIdx<cur.src.length-1)nextSrc();},9000);  /* si tarda, prueba el siguiente enlace */
}
function nextSrc(){
  if(!cur)return;
  if(srcIdx<cur.src.length-1){srcIdx++;loadMain(cur.src[srcIdx]);return;}
  spin(0);gate.style.display="flex";gmsg.className="err";btnStart.textContent="Reintentar";
  gmsg.textContent="No se pudo cargar el video. Revisa tu conexión o el enlace.";
}
function candidates(id){
  const s=SEG[id],out=[],seen=new Set();
  const add=r=>{if(!r||seen.has(r)||!SEG[r])return;seen.add(r);if(SEG[r].s!==s.e)out.push({id:r,t:SEG[r].s/1000});};
  if(CH[id])CH[id].forEach(o=>add(resolveTarget(o.g)));
  if(s.pad){add(resolveTarget("6C"));add(resolveTarget("6D"));}
  add(nextOf(id));
  return out;
}
function prepare(){
  if(!cur)return;
  cands.slice(0,2).forEach(c=>{
    if(SB.some(x=>x.tid===c.id))return;
    const el=pool.pop()||makeVideo();
    el._want=c.t;el.muted=true;el.src=cur.src[srcIdx]+"#t="+c.t.toFixed(3);SB.push({el,tid:c.id});
  });
}
function swapTo(sb,t){
  const i=SB.indexOf(sb);if(i>=0)SB.splice(i,1);
  const nu=sb.el,old=v;nu._want=null;nu.muted=false;nu.volume=old.volume;
  old.pause();old.muted=true;v=nu;btnPlay.textContent="❚❚";
  const bail=()=>{
    if(v!==nu)return;
    v=old;nu.pause();nu.muted=true;recycle(nu);old.muted=false;try{old.currentTime=t;}catch(e){}old.play().catch(()=>{});
  };
  nu.play().then(()=>{if(v!==nu)return;nu.classList.remove("sb");old.classList.add("sb");recycle(old);}).catch(bail);
  setTimeout(()=>{if(v===nu&&nu.classList.contains("sb"))bail();},2500);
}

/* ===== ABRIR / CERRAR / INICIAR ===== */

function startAt(sec){

btnStart.onclick=()=>{if(gmsg.className==="err"&&cur){srcIdx=0;loadMain(cur.src[0]);gmsg.className="";}startAt(0);};

$("noTimer").onchange=e=>{noTimer=e.target.checked;if(!noTimer&&held){held=false;if(cur)v.play().catch(()=>{});}};

/* ===== REPRODUCCIÓN POR SEGMENTOS ===== */
function play(id,fromWindow){
  if(id==="IDNT"||!SEG[id]){finish();return;}
  const s=SEG[id];
  seg=id;if(EFF[id])applyKV(EFF[id]);hideOv();
  cands=candidates(id);prepAt=(s.ws||s.e||0)-25000;prepDone=!cands.length;
  const t=((fromWindow&&s.ws)?s.ws:s.s)/1000,far=Math.abs(v.currentTime-t)>0.4;
  const sb=(far&&!fromWindow)?SB.find(x=>x.tid===id):null;
  if(sb)swapTo(sb,t);
  else{if(far){try{v.currentTime=t;}catch(e){}}v.play().catch(()=>{});}
  releaseStandbys();
}
function advance(target){
  if(!seg)return;
  let r=target?resolveTarget(target):null;if(!r)r=nextOf(seg);
  if(!r){finish();return;}
  play(r);
}
function finish(){
  if(!cur)return;
  if(!isB())saveProg(true);
  seg=null;hideOv();releaseStandbys();v.pause();spin(0);
  $("endP").textContent=cur.credits||"";endBox.classList.add("on");$("btnAgain").focus(fp());
}
function tick(){
  if(!cur||!started||!isB()||!seg)return;
  const s=SEG[seg];if(!s)return;
  const ms=v.currentTime*1000;
  if(!prepDone&&ms>=prepAt){prepDone=true;prepare();}
  if(!shown&&s.ws&&ms>=s.ws&&ms<s.we-60){if(s.pad)showPad();else if(CH[seg])showChoices(seg);}
  if(shown){
    if(ms<s.ws-350){hideOv();return;}
    if(pend){
      const left=s.we-ms;tbar.style.width=Math.max(0,Math.min(100,left/(s.we-s.ws)*100))+"%";
      if(noTimer){if(left<=60){held=true;if(!v.paused)v.pause();}}
      else if(left<=60){pend.auto();return;}
    }
    if(held){if(!v.paused)v.pause();return;}
  }
  if(s.e>0&&ms>=s.e-45)advance();
}
setInterval(tick,120);

/* ===== DECISIONES ===== */
const isSelect=e=>e.key==="Select"||[23,66].includes(e.keyCode);
const isOk=e=>e.key==="Enter"||e.key===" "||isSelect(e);
const isBack=e=>e.key==="Escape"||e.key==="Backspace"||e.key==="GoBack"||[8,27,4,461].includes(e.keyCode);
function hideOv(){
  ov.classList.remove("on");pad.classList.remove("on");shown=false;held=false;pend=null;ovKey=null;
  optsEl.innerHTML="";keysEl.innerHTML="";
  const a=document.activeElement;if(a&&a!==document.body&&a.closest&&a.closest("#stage")&&a.blur)a.blur();
  stage.focus(fp());
}
function showChoices(id){
  const c=CH[id],my=++seq;shown=true;held=false;optsEl.innerHTML="";
  let dflt=0;{const dt=resolveTarget(SEG[id].d),k=c.findIndex(o=>resolveTarget(o.g)===dt);if(k>=0)dflt=k;}
  const take=k=>{if(!pend||pend.my!==my)return;const o=c[k];if(!o)return;
    hideOv();pushLog(id,o.t,c.map(x=>x.t));if(GEFF[o.g])applyKV(GEFF[o.g]);advance(o.g);};
  const idx=()=>{const k=[...optsEl.children].indexOf(document.activeElement);return k<0?dflt:k;};
  c.forEach((o,k)=>{
    const b=document.createElement("button");b.type="button";b.className="opt";b.textContent=o.t;
    b.addEventListener("mouseenter",()=>{if(Date.now()-lastKey>250)b.focus(fp());});
    b.onclick=e=>{e.stopPropagation();take(k);};optsEl.appendChild(b);
  });
  pend={my,auto:()=>take(idx())};
  ovKey=(e,ar)=>{
    if(ar){e.preventDefault();move(ar==="ArrowUp"?"ArrowLeft":ar==="ArrowDown"?"ArrowRight":ar,[...optsEl.children]);}
    else if(isOk(e)){e.preventDefault();take(idx());}
    else if(isBack(e))e.preventDefault();
  };
  ov.classList.add("on");tbar.style.width="100%";optsEl.children[dflt].focus(fp());
}
function showPad(){
  shown=true;held=false;code="";dispEl.textContent="-----";keysEl.innerHTML="";pad.classList.add("on");
  const my=++seq;let lock=false;
  const done=t=>{if(!pend||pend.my!==my)return;hideOv();advance(t);};
  pend={my,auto:()=>done("6D")};
  const press=k=>{
    if(!pend||pend.my!==my||lock||code.length>=5)return;
    code+=k;dispEl.textContent=code.padEnd(5,"-");
    if(code.length===5){lock=true;const typed=code;
      setTimeout(()=>{if(!pend||pend.my!==my)return;pushLog(seg,typed,typed==="20541"?["20541"]:["20541",typed]);done(typed==="20541"?"6C":"6D");},420);}
  };
  "1234567890".split("").forEach(k=>{
    const b=document.createElement("button");b.type="button";b.textContent=k;
    b.addEventListener("mouseenter",()=>{if(Date.now()-lastKey>250)b.focus(fp());});
    b.onclick=e=>{e.stopPropagation();press(k);};keysEl.appendChild(b);
  });
  ovKey=(e,ar)=>{
    if(ar){e.preventDefault();move(ar,[...keysEl.children]);}
    else if(/^[0-9]$/.test(e.key)){e.preventDefault();press(e.key);}
    else if(isOk(e)){e.preventDefault();const b=document.activeElement;if(b&&b.parentNode===keysEl)press(b.textContent);}
    else if(isBack(e)){e.preventDefault();if(code.length&&!lock){code=code.slice(0,-1);dispEl.textContent=code.padEnd(5,"-");}}
  };
  keysEl.children[4].focus(fp());
}

/* ===== REGISTRO / MAPA ===== */
function pushLog(segId,chosen,opts){log.push({seg:segId,chosen,opts,state:cloneState(),at:Date.now()});renderLog();renderMap();}
function renderLog(){
  if(!log.length){logEl.innerHTML='<div class="empty">Sin decisiones registradas.</div>';return;}
  logEl.innerHTML="";
  for(let i=log.length-1;i>=0;i--){
    const e=log[i],d=document.createElement("div");d.className="ent";
    let h=esc(e.seg);e.opts.forEach(o=>{h+=o===e.chosen?"<br><b>→ "+esc(o)+"</b>":'<br><span style="opacity:.45">· '+esc(o)+"</span>";});
    d.innerHTML=h;
    const b=document.createElement("button");b.textContent="volver a este punto";b.onclick=()=>rewindTo(i);
    d.appendChild(b);logEl.appendChild(d);
  }
}
function renderMap(){
  if(!log.length){mapEl.innerHTML='<div class="empty">Aún no hay decisiones.</div>';return;}
  const CW=132,RH=32,mx=Math.max(...log.map(e=>e.opts.length)),W=30+log.length*CW,H=46+mx*RH;
  let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="display:block;flex:none">';
  log.forEach((e,i)=>{
    const x=20+i*CW,y=16;
    s+='<circle cx="'+x+'" cy="'+y+'" r="5" fill="#fff"/><text x="'+x+'" y="'+(y+16)+'" fill="#6a6a76" font-size="8" text-anchor="middle">'+esc(e.seg)+'</text>';
    e.opts.forEach((o,k)=>{
      const oy=56+k*RH,tk=o===e.chosen;
      s+='<line x1="'+x+'" y1="'+(y+5)+'" x2="'+(x+18)+'" y2="'+(oy-4)+'" stroke="'+(tk?"#fff":"#3a3a46")+'"/>'+
         '<circle cx="'+(x+18)+'" cy="'+(oy-4)+'" r="3" fill="'+(tk?"#fff":"#2a2a33")+'" stroke="#3a3a46"/>'+
         '<text x="'+(x+25)+'" y="'+oy+'" fill="'+(tk?"#e9e9ec":"#5f5f6b")+'" font-size="9">'+esc(String(o).slice(0,17))+"</text>";
    });
  });
  mapEl.innerHTML=s+"</svg>";mapEl.scrollLeft=mapEl.scrollWidth;
}
function rewindTo(i){
  const e=log[i];if(!e)return;
  log=log.slice(0,i);renderLog();renderMap();st=JSON.parse(JSON.stringify(e.state));
  gate.style.display="none";endBox.classList.remove("on");started=true;releaseStandbys();
  toggleAside(false);play(e.seg,true);
}

/* ===== PROGRESO, CAPÍTULOS, INTERFAZ ===== */
function saveProg(done){
  if(!cur||!started||isB()||!isFinite(v.duration)||!v.duration)return;
  const d=v.duration;LS.set("xc_pos_"+cur.id,{t:done?0:v.currentTime,d,done:!!done||v.currentTime>d-90});
}
function renderChap(){
  chapEl.innerHTML="";curChap=-1;if(!cur||!cur.chapters)return;
  cur.chapters.forEach(c=>{
    const b=document.createElement("button");b.type="button";
    b.innerHTML='<span class="n">'+fmt(c.t)+"</span><span>"+esc(c.n)+"</span>";
    b.onclick=()=>{if(!started){startAt(c.t);return;}v.currentTime=c.t;if(v.paused)v.play().catch(()=>{});};
    chapEl.appendChild(b);
  });
}
function markChap(){
  if(!cur||!cur.chapters)return;
  let k=0;cur.chapters.forEach((c,i)=>{if(v.currentTime>=c.t-1.5)k=i;});
  if(k===curChap)return;curChap=k;[...chapEl.children].forEach((b,i)=>b.classList.toggle("act",i===k));
}
function ui(){
  let a=0,b=isFinite(v.duration)?v.duration:0;
  if(isB()&&seg&&SEG[seg]){const s=SEG[seg];a=s.s/1000;if(s.e)b=s.e/1000;}
  const len=Math.max(1,b-a),p=Math.min(Math.max(v.currentTime-a,0),len),tx=fmt(p)+" / "+fmt(len);
  if($("time").textContent!==tx)$("time").textContent=tx;
  if(!dragging)seek.value=Math.round(p/len*1000);
  markChap();
}
const toggle=()=>{if(started)v.paused?v.play().catch(()=>{}):v.pause();};
function skip(sec){
  if(isB()&&seg&&SEG[seg]){
    const s=SEG[seg];let hi=(s.e||v.currentTime*1000)-300;if(s.ws)hi=Math.min(hi,s.ws+400);
    v.currentTime=Math.min(Math.max(v.currentTime*1000+sec*1000,s.s),Math.max(s.s,hi))/1000;return;
  }
  const d=isFinite(v.duration)?v.duration:1e9;v.currentTime=Math.max(0,Math.min(d-1,v.currentTime+sec));
}
btnPlay.onclick=toggle;$("btnB").onclick=()=>skip(-10);$("btnF").onclick=()=>skip(10);
seek.addEventListener("pointerdown",()=>dragging=true);
seek.addEventListener("pointerup",()=>dragging=false);
seek.addEventListener("change",()=>dragging=false);
seek.addEventListener("input",()=>{
  if(isB()){const s=seg&&SEG[seg];if(s&&s.e)v.currentTime=(s.s+seek.value/1000*(s.e-s.s))/1000;}
  else if(isFinite(v.duration))v.currentTime=seek.value/1000*v.duration;
});
function vis(el){const r=el.getBoundingClientRect();return r.width>0&&r.height>0&&!el.disabled;}
const asideList=()=>[...aside.querySelectorAll("button,input")].filter(vis);
function toggleAside(on){
  aside.classList.toggle("show",on);
  if(on)setTimeout(()=>{const f=aside.querySelector("#chap .act")||asideList()[0];if(f)f.focus(fp());},0);
  else if(cur)stage.focus(fp());
}
$("btnPanel").onclick=()=>toggleAside(!aside.classList.contains("show"));
const tvEl=$("tvMode");
function setTV(on){document.body.classList.toggle("tv",on);tvEl.checked=on;}
tvEl.onchange=()=>setTV(tvEl.checked);
function setPseudo(on){pseudo=on;document.body.classList.toggle("pseudo",on);$("btnFs").classList.toggle("on",on);if(on)setTV(true);}
$("btnFs").onclick=()=>{
  if($("sysFs").checked){
    if(document.fullscreenElement)document.exitFullscreen();
    else{const el=$("player"),rq=el.requestFullscreen||el.webkitRequestFullscreen;if(rq){const p=rq.call(el);if(p&&p.catch)p.catch(()=>{});}}
    return;
  }
  setPseudo(!pseudo);
};
$("sysFs").onchange=()=>{if($("sysFs").checked)setPseudo(false);};
function revealCtl(){
  if(!pseudo||aside.classList.contains("show"))return;
  document.body.classList.add("showctl");clearTimeout(ctlT);
  ctlT=setTimeout(()=>{
    const a=document.activeElement;if(a&&a.closest&&a.closest(".ctl"))a.blur();
    document.body.classList.remove("showctl");stage.focus(fp());
  },3500);
}
["pointermove","pointerdown","touchstart"].forEach(n=>addEventListener(n,revealCtl,{passive:true}));

/* ===== TECLADO / CONTROL REMOTO ===== */
const ctlList=()=>[...document.querySelectorAll(".ctl button,.ctl input")].filter(vis);
const gateList=()=>[...gate.querySelectorAll("button")].filter(vis);
function move(dir,list){
  const a=document.activeElement;if(!list.length)return;
  if(!list.includes(a)){list[0].focus(fp());return;}
  const r=a.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let best=null,bs=1e9;
  for(const el of list){
    if(el===a)continue;
    const q=el.getBoundingClientRect(),x=q.left+q.width/2-cx,y=q.top+q.height/2-cy;
    const main=dir==="ArrowRight"?x:dir==="ArrowLeft"?-x:dir==="ArrowDown"?y:-y;
    const cross=(dir==="ArrowLeft"||dir==="ArrowRight")?Math.abs(y):Math.abs(x);
    if(main<=4)continue;
    const s=main+cross*2.5;if(s<bs){bs=s;best=el;}
  }
  if(best)best.focus({preventScroll:document.body.dataset.view!=="home"});
}
function arrow(e){
  const c=e.keyCode,k=e.key;
  if(k==="ArrowLeft"||c===21)return"ArrowLeft";if(k==="ArrowRight"||c===22)return"ArrowRight";
  if(k==="ArrowUp"||c===19)return"ArrowUp";if(k==="ArrowDown"||c===20)return"ArrowDown";
  return null;
}
addEventListener("keydown",e=>{
  lastKey=Date.now();
  const ar=arrow(e),ae=document.activeElement;
  if(document.body.dataset.view==="home"){
    const cards=[...document.querySelectorAll(".card")];
    if(ar){e.preventDefault();move(ar,cards);}
    else if(isSelect(e)){e.preventDefault();const c=cards.includes(ae)?ae:cards[0];if(c)c.click();}
    return;
  }
  if(shown&&ovKey){ovKey(e,ar);return;}
  const asideOn=aside.classList.contains("show"),gateOn=gate.style.display!=="none"&&!started,
        endOn=endBox.classList.contains("on"),inCtl=!!(ae&&ae.closest&&ae.closest(".ctl"));
  if(isBack(e)){
    e.preventDefault();
    if(asideOn)toggleAside(false);else if(pseudo)setPseudo(false);else closeTitle();
    return;
  }
  if(!e.ctrlKey&&!e.metaKey&&!e.altKey){
    const k=(e.key||"").toLowerCase();
    if(k==="c"){toggleSub();return;}if(k==="f"){$("btnFs").click();return;}if(k==="l"){$("btnPanel").click();return;}
  }
  const list=asideOn?asideList():gateOn?gateList():endOn?[...endBox.querySelectorAll("button")]:inCtl?ctlList():null;
  if(list){
    if(ar){
      if(ae===seek&&(ar==="ArrowLeft"||ar==="ArrowRight"))return;
      e.preventDefault();
      if(inCtl&&!asideOn&&!gateOn&&!endOn&&ar==="ArrowUp"){ae.blur();stage.focus(fp());return;}
      move(ar,list);revealCtl();
    }else if(isSelect(e)){e.preventDefault();if(ae&&ae.click)ae.click();}
    return;
  }
  revealCtl();
  if(ar==="ArrowLeft"){e.preventDefault();skip(-10);}
  else if(ar==="ArrowRight"){e.preventDefault();skip(10);}
  else if(ar==="ArrowUp"||ar==="ArrowDown"){e.preventDefault();btnPlay.focus(fp());}
  else if(e.key==="Enter"||e.code==="Space"||isSelect(e)){e.preventDefault();toggle();}
},true);

/* ===== ARRANQUE ===== */
(function(){
  if(Math.min(innerWidth,innerHeight)>=540&&!matchMedia("(pointer: coarse)").matches)setTV(true);
  renderHome();refreshCC();
  const f=document.querySelector(".card");if(f)f.focus(fp());
})();
})();
</script>
</body>
