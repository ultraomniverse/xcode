<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>XCODE://docuverse</title>
<link rel="preconnect" href="https://archive.org" crossorigin>
<link rel="preconnect" href="https://upload.wikimedia.org" crossorigin>
<link rel="dns-prefetch" href="//en.wikipedia.org">
<style>
:root{--bg:#05060a;--panel:#0a0b0f;--p2:#101217;--bd:#24262c;--ink:#ffb000;--grn:#3dff9e;--paper:#f4f1e6;--mut:#8a8b93;--top:2147482000}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
@supports(height:100dvh){html,body{height:100dvh}}
body{background:var(--bg);color:var(--paper);font:13px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
::selection{background:var(--ink);color:#000}

header{display:flex;align-items:center;gap:12px;padding:9px 18px;border-bottom:1px solid var(--bd);background:#000}
.logo{font-weight:700;letter-spacing:.3em;color:var(--ink);text-shadow:0 0 14px rgba(255,176,0,.55)}
.logo::after{content:"▌";animation:blk 1.1s steps(1) infinite}
@keyframes blk{50%{opacity:0}}
.by{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--grn);opacity:.75}
header h1{margin:0;font-size:11px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;opacity:.85}
.sp{flex:1}
.meta-h{font-size:9px;letter-spacing:.2em;color:#4a4d55;font-variant-numeric:tabular-nums}
#back{border:1px solid var(--bd);padding:5px 12px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
#back:hover{color:var(--ink);border-color:var(--ink)}
body[data-view=home] #back,body[data-view=home] #hTitle{display:none}
.only-branch,.only-chaps{display:none!important}
body[data-kind=branch] .only-branch{display:block!important}
body[data-kind=branch] .opt2.only-branch{display:flex!important}
body[data-kind=chaps] .only-chaps{display:block!important}

#home{flex:1;min-height:0;overflow:auto;padding:24px 28px 44px;position:relative}
#home::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.26) 0 1px,transparent 1px 3px)}
#home::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at 50% 40%,transparent 42%,rgba(0,0,0,.78) 100%)}
body[data-view=player] #home{display:none}
#rows{position:relative;z-index:3}
.row{margin-bottom:30px}
.row h2{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink);font-weight:400;margin:0 0 14px;display:flex;align-items:center;gap:10px}
.row h2::before{content:"▚"}
.row h2::after{content:"";flex:1;height:1px;background:linear-gradient(to right,var(--bd),transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:22px;max-width:1120px}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;padding:0}
.art{position:relative;aspect-ratio:2/3;border:1px solid var(--bd);overflow:hidden;
  background:linear-gradient(160deg,#131519,#07080b);transition:transform .16s,border-color .16s,box-shadow .16s}
.art::after{content:"";position:absolute;inset:5px;pointer-events:none;opacity:.4;transition:opacity .16s;
  background:linear-gradient(var(--ink),var(--ink)) left top/11px 1px no-repeat,linear-gradient(var(--ink),var(--ink)) left top/1px 11px no-repeat,
   linear-gradient(var(--ink),var(--ink)) right top/11px 1px no-repeat,linear-gradient(var(--ink),var(--ink)) right top/1px 11px no-repeat,
   linear-gradient(var(--ink),var(--ink)) left bottom/11px 1px no-repeat,linear-gradient(var(--ink),var(--ink)) left bottom/1px 11px no-repeat,
   linear-gradient(var(--ink),var(--ink)) right bottom/11px 1px no-repeat,linear-gradient(var(--ink),var(--ink)) right bottom/1px 11px no-repeat}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(.5) contrast(1.1) brightness(.9);transition:filter .16s}
.art .gen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:14px 12px;
  background:radial-gradient(circle at 30% 15%,var(--tint),transparent 70%)}
.art .gen .lbl{font-size:8px;letter-spacing:.3em;color:var(--ink);opacity:.8}
.art .gen .ttl{font-size:13px;line-height:1.25;text-transform:uppercase;letter-spacing:.06em}
.badge{position:absolute;left:0;top:0;z-index:2;font-size:9px;letter-spacing:.2em;font-weight:700;background:var(--ink);color:#000;padding:3px 7px}
.badge::before{content:"⟨"}.badge::after{content:"⟩"}
.prog{position:absolute;left:0;bottom:0;height:3px;z-index:2;background:repeating-linear-gradient(90deg,var(--grn) 0 6px,#0a3a24 6px 8px)}
.card:hover .art,.card:focus .art{transform:translateY(-5px);border-color:var(--ink);box-shadow:0 0 0 1px var(--ink),0 0 34px rgba(255,176,0,.25)}
.card:hover .art::after,.card:focus .art::after{opacity:1}
.card:hover .art img,.card:focus .art img{filter:grayscale(0) contrast(1.12) brightness(1)}
.card:focus{outline:none}
.meta b{display:block;font-weight:400;text-transform:uppercase;letter-spacing:.11em;font-size:12px}
.meta span{font-size:10px;color:var(--mut);letter-spacing:.06em}
.card:focus .meta b{color:var(--ink)}
.credit{margin-top:36px;padding-top:16px;border-top:1px solid var(--bd);font-size:9px;letter-spacing:.22em;
  text-transform:uppercase;color:#4a4d55;line-height:2.1;position:relative;z-index:3}
.credit b{color:var(--ink);letter-spacing:.3em}

#player{flex:1;min-height:0;display:none;flex-direction:column;padding:10px;gap:8px}
body[data-view=player] #player{display:flex}
#stage{position:relative;flex:1;min-height:0;background:#000;border:1px solid var(--bd);overflow:hidden;outline:none}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:18;
  background:radial-gradient(ellipse at 50% 50%,transparent 54%,rgba(0,0,0,.62) 100%)}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:19;opacity:.45;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.4) 0 1px,transparent 1px 3px)}
#v{width:100%;height:100%;object-fit:contain;display:block;background:#000}
#v::cue{background:rgba(0,0,0,.82);color:#fff;font:600 5.2vh/1.35 ui-monospace,Menlo,monospace;text-shadow:0 2px 6px #000}

.gate,.end{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:13px;background:#000;text-align:center;padding:26px}
.gate::before{content:"[ DOCUMENTO ]";font-size:9px;letter-spacing:.42em;color:var(--ink);opacity:.75}
.end{display:none;background:rgba(0,0,0,.96)}.end.on{display:flex}
.gate h2,.end h2{margin:0;font-size:22px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;line-height:1.35;max-width:640px}
.end h2{color:var(--ink)}
.gate .s{margin:0;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--grn);opacity:.8}
.gate p,.end p{margin:0;max-width:520px;font-size:12px;color:var(--mut);line-height:1.75}
.btns{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.gate button,.end button{border:1px solid var(--bd);padding:8px 20px;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.gate button:hover,.end button:hover{border-color:var(--ink);color:var(--ink)}
.pri{background:var(--ink)!important;color:#000!important;border-color:var(--ink)!important;font-weight:700!important}
.err{color:#ff7a5e!important}
#gmsg{font-size:10px;letter-spacing:.1em;color:var(--mut);min-height:1em;max-width:520px}

#spin{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;z-index:35;pointer-events:none;display:none;
  border:2px solid rgba(255,176,0,.2);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite}
#spin.on{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:50;pointer-events:none;background:#000;
  border:1px solid var(--ink);color:var(--ink);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  padding:6px 14px;opacity:0;transition:opacity .18s;max-width:86%;text-align:center}
#toast.on{opacity:1}
#toast::before{content:"» "}

.ov{position:absolute;left:0;right:0;bottom:0;min-height:38%;z-index:30;display:none;flex-direction:column;
  justify-content:flex-end;padding-bottom:18px;background:linear-gradient(to top,rgba(0,0,0,.98),rgba(0,0,0,.9) 55%,transparent)}
.ov.on{display:flex}
.ov .q{font-size:10px;letter-spacing:.44em;color:var(--ink);text-align:center;margin-bottom:12px}
.ov .q::before{content:"▸ "}.ov .q::after{content:" ◂"}
.opts{display:flex;gap:12px;justify-content:center;padding:0 22px}
.opt{flex:1;max-width:340px;padding:14px 12px;border:1px solid rgba(244,241,230,.3);background:rgba(255,255,255,.04);
  font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.opt::before{content:"> ";color:var(--ink);opacity:0}
.opt:focus::before,.opt:hover::before{opacity:1}
.opt:focus{outline:none;border-color:var(--ink);background:rgba(255,176,0,.14);color:var(--ink);
  box-shadow:0 0 0 1px var(--ink),0 0 30px rgba(255,176,0,.3)}
.timer{height:3px;background:rgba(255,255,255,.14);margin:14px 22px 0;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--ink);box-shadow:0 0 12px var(--ink)}
.pad{position:absolute;left:0;right:0;bottom:0;padding:16px;z-index:30;display:none;flex-direction:column;
  align-items:center;gap:10px;background:rgba(0,0,0,.96);border-top:1px solid var(--bd)}
.pad.on{display:flex}
.pad .disp{letter-spacing:.7em;font-size:19px;color:var(--ink);text-shadow:0 0 16px rgba(255,176,0,.6)}
.keys{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:340px}
.keys button{width:42px;height:42px;border:1px solid rgba(244,241,230,.28);background:rgba(255,255,255,.05);font-size:15px}
.keys button:focus{outline:none;background:var(--ink);color:#000;border-color:var(--ink);box-shadow:0 0 0 1px #000,0 0 24px rgba(255,176,0,.45)}

.ctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ctl button{min-width:34px;height:30px;padding:0 8px;border:1px solid var(--bd);background:var(--p2);font-size:12px;color:var(--mut)}
.ctl button:hover{border-color:var(--ink);color:var(--ink)}
.ctl button.on{background:var(--ink);color:#000;border-color:var(--ink);font-weight:700}
.ctl button.off{opacity:.4}
.ctl .t{font-size:10px;color:var(--mut);font-variant-numeric:tabular-nums;min-width:104px}
.ctl input[type=range]{flex:1 1 140px;min-width:110px;accent-color:var(--ink);height:3px}
button:focus,input:focus{outline:none}
.ctl button:focus{background:var(--ink);color:#000;border-color:var(--ink);box-shadow:0 0 0 2px #000,0 0 0 3px var(--ink)}

aside{display:none;position:fixed;right:0;top:0;bottom:0;width:min(420px,92vw);z-index:60;background:var(--panel);
  border-left:1px solid var(--ink);flex-direction:column;box-shadow:-16px 0 40px rgba(0,0,0,.8)}
aside.show{display:flex}
aside .sec{padding:11px 14px;border-bottom:1px solid var(--bd)}
aside h3{margin:0 0 8px;font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink);font-weight:400}
aside h3::before{content:"▚ "}
.opt2{display:flex;align-items:center;gap:8px;font-size:11px;margin-top:7px;flex-wrap:wrap;color:var(--mut)}
.opt2 button{border:1px solid var(--bd);padding:3px 8px;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.opt2 button:hover{border-color:var(--ink);color:var(--ink)}
.opt2 input{accent-color:var(--ink)}
#subState{font-size:10px;color:var(--mut);line-height:1.6}
#chap{flex:1;min-height:0;overflow:auto;padding:6px 8px}
#chap button{display:flex;gap:10px;width:100%;text-align:left;border:1px solid transparent;padding:8px;margin-bottom:1px;font-size:12px;color:#a3a4ac}
#chap .n{min-width:56px;font-size:10px;color:#4a4d55;font-variant-numeric:tabular-nums}
#chap button:hover{border-color:var(--bd);color:var(--paper)}
#chap button.act{background:rgba(255,176,0,.12);color:var(--ink);border-color:var(--ink)}
#chap button:focus{outline:none;border-color:var(--ink);color:var(--ink)}
#map{flex:1;min-height:0;overflow:auto;padding:8px}
#log{max-height:32%;overflow:auto;padding:8px 14px;font-size:10px}
.ent{padding:6px 0;border-bottom:1px dashed #1c1e24;color:var(--mut)}
.ent b{color:var(--ink);font-weight:400}
.ent button{color:#5a5d66;font-size:9px;text-decoration:underline;padding:2px 0;letter-spacing:.1em}
.empty{color:#41444c;font-size:10px;padding:8px 0;letter-spacing:.12em}

body.tv .meta b{font-size:17px}
body.tv .grid{grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:30px}
body.tv #home{padding:38px 54px}
body.tv .ctl button{height:46px;min-width:50px;font-size:17px}
body.tv #chap button{font-size:15px;padding:12px}
body.tv .gate h2{font-size:34px}body.tv .gate p{font-size:14px}
body.tv .gate button,body.tv .end button{font-size:15px;padding:13px 34px}
body.tv #player{padding:6px}
body.tv .opt{font-size:19px;padding:24px}
body.tv .keys{max-width:none;gap:13px}body.tv .keys button{width:76px;height:76px;font-size:26px}
body.tv .pad .disp{font-size:36px}
body.tv #toast{font-size:13px;padding:10px 20px}

body.pseudo header{display:none}
body.pseudo #player{padding:0;gap:0}
body.pseudo #stage{position:fixed;inset:0;z-index:var(--top);border:0}
body.pseudo .ctl{position:fixed;left:0;right:0;bottom:0;z-index:calc(var(--top) + 2);padding:8px 16px;
  background:linear-gradient(to top,rgba(0,0,0,.94),transparent);opacity:0;transition:opacity .18s;pointer-events:none}
body.pseudo.showctl .ctl{opacity:1;pointer-events:auto}
body.pseudo aside{z-index:calc(var(--top) + 3)}
@media (max-width:620px){.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}#home{padding:18px 16px 36px}}
</style>
</head>
<body data-view="home" data-kind="plain">
<header>
  <span class="logo">XCODE://</span><span class="by">ultraomniverse</span>
  <span class="sp"></span><h1 id="hTitle"></h1>
  <span class="meta-h" id="hNode">—</span><span class="meta-h" id="hClock">--:--:--</span>
  <span class="sp"></span><button id="back">‹ índice</button>
</header>

<section id="home"><div id="rows"></div>
  <div class="credit"><b>XCODE://docuverse</b> · by UltraOmniverse<br>Creada por Daniel Alejandro Gascón Castaño — Founder</div>
</section>

<section id="player">
  <div id="stage" tabindex="-1">
    <video id="v" preload="auto" playsinline webkit-playsinline><track id="trk" kind="subtitles" srclang="es" label="Español"></video>
    <div id="spin"></div><div id="toast"></div>
    <div class="gate" id="gate">
      <h2 id="gT"></h2><p class="s" id="gS"></p><p id="gD"></p>
      <div class="btns"><button class="pri" id="btnStart">Empezar</button>
        <button id="btnResume" style="display:none">Reanudar</button>
        <button id="btnCat">Índice</button></div>
      <p id="gmsg"></p>
    </div>
    <div class="ov" id="ov"><div class="q">ELIGE</div><div class="opts" id="opts"></div><div class="timer"><i id="tbar"></i></div></div>
    <div class="pad" id="pad"><div class="disp" id="disp">-----</div><div class="keys" id="keys"></div></div>
    <div class="end" id="end"><h2>Fin del documento</h2><p id="endP"></p>
      <div class="btns"><button class="pri" id="btnAgain">Volver a empezar</button><button id="btnCat2">Índice</button></div></div>
  </div>
  <div class="ctl">
    <button id="btnPlay" title="Reproducir / pausa">▶</button>
    <button id="btnB" title="−10 s">↺</button>
    <button id="btnF" title="+10 s">↻</button>
    <span class="t" id="time">0:00 / 0:00</span>
    <input id="seek" type="range" min="0" max="1000" value="0" step="1">
    <button id="btnCC" title="Subtítulos (c)">CC</button>
    <button id="btnPanel" title="Panel (l)">☰</button>
    <button id="btnFs" title="Pantalla grande (f)">⛶</button>
  </div>
  <aside id="aside">
    <div class="sec"><h3>Ajustes</h3>
      <div class="opt2"><label><input type="checkbox" id="tvMode"> Modo TV</label></div>
      <div class="opt2"><label><input type="checkbox" id="showSub" checked> Subtítulos</label></div>
      <div class="opt2"><label><input type="checkbox" id="sysFs"> Pantalla completa del sistema</label></div>
      <div class="opt2 only-branch"><label><input type="checkbox" id="noTimer"> Sin temporizador</label></div>
      <div class="opt2">Sincronía <button id="subM">− 0.5 s</button><button id="subP">+ 0.5 s</button><span id="subOff">0.0 s</span></div>
      <div class="opt2"><button id="btnSubFile">Cargar subtítulos</button><input id="subFile" type="file" accept=".srt,.vtt,text/vtt" style="display:none"></div>
      <div class="opt2 only-branch"><button id="btnRestart">Reiniciar película</button></div>
      <div class="opt2" id="subState">—</div>
    </div>
    <div class="sec only-chaps"><h3>Capítulos</h3></div>
    <div id="chap" class="only-chaps"></div>
    <div class="sec only-branch" style="padding-bottom:4px"><h3>Mapa</h3></div>
    <div id="map" class="only-branch"></div>
    <div class="sec only-branch" style="padding-bottom:4px"><h3>Rastro</h3></div>
    <div id="log" class="only-branch"></div>
  </aside>
</section>

<script>

  return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0");};

          set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}};

  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),3200);}

const sub={raw:null,mode:"none",off:0,gen:0,url:null,

  mount(){

const ts=ms=>{ms=Math.max(0,Math.round(ms));const p=(n,l)=>String(n).padStart(l,"0");

const grab=async u=>{const r=await fetch(u);if(!r.ok)throw 0;const x=await r.text();if(x.indexOf("-->")<0)throw 0;return x;};

const KEYS=["sp","tt","td","cs","w1","2b","3j","pt","cd","cj","sj","tud","lsd","vh","3l","3s","3z","ps","wb","kd","bo","5v","pc","sc","ty","cm","pr","3ad","s3af","nf","np","ne","pp","tp","bup","be","pe","pae","te","snt","8j","8d","8m","8q","8s","8v","vs","scs","3ab","3ac","3aj","3ah","3ak","3al","3af","5h","5ac","5ag","5ad","6c","8a","sj2"];

const cloneState=()=>JSON.parse(JSON.stringify(st));
function parseAll(){
  [SEG,CH,GRP,PREC,EFF].forEach(o=>{for(const k in o)delete o[k];});
  RAW.trim().split("\n").forEach(l=>{
    const p=l.split("|"),id=(p[0]||"").trim();if(!id)return;
    const s={s:+p[1],e:+p[2],d:(p[3]||"").trim()};
    if(p[4]&&p[4].trim()!=="-"){s.ws=+p[4];s.we=+p[5];}
    const c=(p[6]||"").trim();
    if(c==="#CODE")s.pad=true;
    else if(c){const o=c.split("~").map(x=>{const i=x.indexOf(">");return i<0?null:{t:x.slice(0,i).trim(),g:x.slice(i+1).trim()};}).filter(Boolean);if(o.length)CH[id]=o;}
    SEG[id]=s;
  });
  GRAW.trim().split("\n").forEach(l=>{
    const p=l.split("|"),n=(p[0]||"").trim();if(!n)return;
    GRP[n]=(p[1]||"").split("~").map(x=>{const i=x.indexOf("?"),r=(i<0?x:x.slice(0,i)).trim();return i<0?{s:r}:{s:r,c:x.slice(i+1).trim()};});
  });
  PRAW.trim().split("\n").forEach(l=>{const i=l.indexOf("|");if(i>0)PREC[l.slice(0,i).trim()]=l.slice(i+1).trim();});
  ERAW.trim().split("\n").forEach(l=>{const p=l.split("|");if(p[0])EFF[p[0].trim()]=(p[1]||"").split(";");});
  if(!SEG["3Ax"]&&!GRP["3Ax"])GRP["3Ax"]=[{s:"2BChoice"}];
}
function ev(ex){
  if(!ex)return true;
  let i=0;const sk=()=>{while(ex[i]===" ")i++;};
  const or=()=>{let x=and();sk();while(ex[i]==="|"){i++;const r=and();x=x||r;sk();}return x;};
  const and=()=>{let x=un();sk();while(ex[i]==="&"){i++;const r=un();x=x&&r;sk();}return x;};
  const un=()=>{sk();if(ex[i]==="!"){i++;return !un();}if(ex[i]==="("){i++;const x=or();sk();if(ex[i]===")")i++;return x;}return atom();};
  const atom=()=>{sk();let s="";while(i<ex.length&&/[A-Za-z0-9_]/.test(ex[i]))s+=ex[i++];
    if(!s)return true;
    if(ex[i]==="="){i++;let x="";while(i<ex.length&&/[A-Za-z0-9_]/.test(ex[i]))x+=ex[i++];return st[s]===x;}
    return !!st[s];};

}
function pick(g,d){
  if(d>14)return null;
  for(const e of g){
    const at=e.s[0]==="@",n=at?e.s.slice(1):e.s,ex=(e.c&&PREC[e.c]!==undefined)?PREC[e.c]:PREC[n];
    if(!ev(ex))continue;
    const r=at?(GRP[n]?pick(GRP[n],d+1):(SEG[n]?n:null)):(SEG[n]?n:(GRP[n]?pick(GRP[n],d+1):null));
    if(r)return r;
  }
  return null;
}
function resolveTarget(n){
  if(!n)return null;
  if(SEG[n]){if(PREC[n]!==undefined&&!ev(PREC[n])&&SEG[n+"cd"]&&ev(PREC[n+"cd"]))return n+"cd";return n;}

}

/* ============ reproducción ============ */
function play(id,fromWindow){
  if(id==="IDNT"||!SEG[id]){finish();return;}
  const s=SEG[id];seg=id;if(EFF[id])applyKV(EFF[id]);hideOv();
  const t=((fromWindow&&s.ws)?s.ws:s.s)/1000;
  try{v.currentTime=t;}catch{}
  if(v.paused)v.play().catch(()=>{});
}
function advance(target){
  if(!seg)return;
  let r=target?resolveTarget(target):null;
  if(!r)r=nextOf(seg);
  if(!r){finish();return;}
  play(r);
}
function finish(){
  if(!cur)return;
  if(cur.kind!=="branch")saveProg(true);
  seg=null;hideOv();v.pause();spin(0);
  $("endP").textContent=cur.title+" · "+cur.year;
  endBox.classList.add("on");$("btnAgain").focus(fp);
}
function saveProg(done){
  if(!cur||!started||cur.kind==="branch"||!isFinite(v.duration)||!v.duration)return;
  const d=v.duration;
  LS.set("xc_p_"+cur.id,{t:done?0:v.currentTime,d,done:!!done||v.currentTime>d-90});
}
function tick(){
  if(!cur||!started)return;
  ui();
  if(cur.kind!=="branch"||!seg)return;
  const s=SEG[seg];if(!s)return;
  const ms=v.currentTime*1000;
  if(!shown&&s.ws&&ms>=s.ws&&ms<s.we-60){s.pad?showPad():CH[seg]&&showChoices(seg);}
  if(shown){
    if(ms<s.ws-350){hideOv();return;}
    if(pend){
      const left=s.we-ms;
      tbar.style.width=Math.max(0,Math.min(100,left/(s.we-s.ws)*100))+"%";
      if(noTimer){if(left<=60){held=true;v.pause();}}
      else if(left<=60){pend.auto();return;}
    }
    if(held){v.pause();return;}
  }
  if(s.e>0&&ms>=s.e-45)advance();
  if(Date.now()-saveT>5000){saveT=Date.now();saveProg();}
}
setInterval(tick,120);

/* ============ decisiones ============ */
const isSelect=e=>e.key==="Select"||[23,66].includes(e.keyCode);
const isOk=e=>e.key==="Enter"||e.key===" "||isSelect(e);
const isBack=e=>e.key==="Escape"||e.key==="Backspace"||e.key==="GoBack"||[8,27,4,461].includes(e.keyCode);
function hideOv(){
  ov.classList.remove("on");padEl.classList.remove("on");shown=false;held=false;pend=null;ovKey=null;
  optsEl.innerHTML="";keysEl.innerHTML="";stage.focus(fp);
}
function showChoices(id){
  const c=CH[id],my=++seq;shown=true;held=false;optsEl.innerHTML="";
  let dflt=0;{const dt=resolveTarget(SEG[id].d),k=c.findIndex(o=>resolveTarget(o.g)===dt);if(k>=0)dflt=k;}
  const idx=()=>{const k=[...optsEl.children].indexOf(document.activeElement);return k<0?dflt:k;};
  const take=k=>{if(!pend||pend.my!==my)return;const o=c[k];if(!o)return;
    hideOv();pushLog(id,o.t,c.map(x=>x.t));if(GEFF[o.g])applyKV(GEFF[o.g]);advance(o.g);};
  c.forEach((o,k)=>{
    const b=document.createElement("button");b.type="button";b.className="opt";b.textContent=o.t;
    b.addEventListener("mouseenter",()=>{if(Date.now()-lastKey>250)b.focus(fp);});
    b.onclick=e=>{e.stopPropagation();take(k);};optsEl.appendChild(b);
  });
  pend={my,auto:()=>take(idx())};
  ovKey=(e,ar)=>{
    if(ar){e.preventDefault();move(ar==="ArrowUp"?"ArrowLeft":ar==="ArrowDown"?"ArrowRight":ar,[...optsEl.children]);}
    else if(isOk(e)){e.preventDefault();take(idx());}
    else if(isBack(e))e.preventDefault();
  };
  ov.classList.add("on");tbar.style.width="100%";optsEl.children[dflt].focus(fp);
}
function showPad(){
  shown=true;held=false;code="";dispEl.textContent="-----";keysEl.innerHTML="";padEl.classList.add("on");
  const my=++seq;let lock=false;
  const done=t=>{if(!pend||pend.my!==my)return;hideOv();advance(t);};
  pend={my,auto:()=>done("6D")};
  const press=k=>{
    if(!pend||pend.my!==my||lock||code.length>=5)return;
    code+=k;dispEl.textContent=code.padEnd(5,"-");
    if(code.length===5){lock=true;const typed=code;
      setTimeout(()=>{if(!pend||pend.my!==my)return;pushLog(seg,typed,typed==="20541"?["20541"]:["20541",typed]);done(typed==="20541"?"6C":"6D");},420);}
  };
  "1234567890".split("").forEach(k=>{
    const b=document.createElement("button");b.type="button";b.textContent=k;
    b.addEventListener("mouseenter",()=>{if(Date.now()-lastKey>250)b.focus(fp);});
    b.onclick=e=>{e.stopPropagation();press(k);};keysEl.appendChild(b);
  });
  ovKey=(e,ar)=>{
    if(ar){e.preventDefault();move(ar,[...keysEl.children]);}
    else if(/^[0-9]$/.test(e.key)){e.preventDefault();press(e.key);}
    else if(isOk(e)){e.preventDefault();const b=document.activeElement;if(b&&b.parentNode===keysEl)press(b.textContent);}
    else if(isBack(e)){e.preventDefault();if(code.length&&!lock){code=code.slice(0,-1);dispEl.textContent=code.padEnd(5,"-");}}
  };
  keysEl.children[4].focus(fp);
}

/* ============ rastro / mapa ============ */
function pushLog(s,chosen,opts){log.push({seg:s,chosen,opts,state:cloneState(),at:Date.now()});renderLog();renderMap();}
function renderLog(){
  if(!log.length){logEl.innerHTML='<div class="empty">Sin decisiones.</div>';return;}
  logEl.innerHTML="";
  for(let i=log.length-1;i>=0;i--){
    const e=log[i],d=document.createElement("div");d.className="ent";
    let h=esc(e.seg);
    e.opts.forEach(o=>{h+=o===e.chosen?"<br><b>→ "+esc(o)+"</b>":'<br><span style="opacity:.45">· '+esc(o)+"</span>";});
    d.innerHTML=h;
    const b=document.createElement("button");b.textContent="volver aquí";b.onclick=()=>rewindTo(i);
    d.appendChild(b);logEl.appendChild(d);
  }
}
function renderMap(){
  if(!log.length){mapEl.innerHTML='<div class="empty">Aún no hay decisiones.</div>';return;}
  const CW=132,RH=32,mx=Math.max(...log.map(e=>e.opts.length)),W=30+log.length*CW,H=46+mx*RH;
  let s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" style="display:block;flex:none">';
  log.forEach((e,i)=>{
    const x=20+i*CW,y=16;
    s+='<circle cx="'+x+'" cy="'+y+'" r="5" fill="#ffb000"/><text x="'+x+'" y="'+(y+16)+'" fill="#6a6a76" font-size="8" text-anchor="middle">'+esc(e.seg)+'</text>';
    e.opts.forEach((o,k)=>{
      const oy=56+k*RH,tk=o===e.chosen;
      s+='<line x1="'+x+'" y1="'+(y+5)+'" x2="'+(x+18)+'" y2="'+(oy-4)+'" stroke="'+(tk?"#ffb000":"#2c2e36")+'"/>'+
         '<circle cx="'+(x+18)+'" cy="'+(oy-4)+'" r="3" fill="'+(tk?"#ffb000":"#17181d")+'" stroke="#2c2e36"/>'+
         '<text x="'+(x+25)+'" y="'+oy+'" fill="'+(tk?"#f4f1e6":"#5f6169")+'" font-size="9">'+esc(String(o).slice(0,17))+"</text>";
    });
  });
  mapEl.innerHTML=s+"</svg>";mapEl.scrollLeft=mapEl.scrollWidth;
}
function rewindTo(i){
  const e=log[i];if(!e)return;
  log=log.slice(0,i);renderLog();renderMap();st=JSON.parse(JSON.stringify(e.state));
  gate.style.display="none";endBox.classList.remove("on");started=true;toggleAside(false);play(e.seg,true);
}

/* ============ capítulos / interfaz ============ */
function renderChap(){
  chapEl.innerHTML="";curChap=-1;if(!cur||!cur.chapters)return;
  cur.chapters.forEach(c=>{
    const b=document.createElement("button");b.type="button";
    b.innerHTML='<span class="n">'+fmt(c.t)+"</span><span>"+esc(c.n)+"</span>";
    b.onclick=()=>{if(!started){startAt(c.t);return;}v.currentTime=c.t;if(v.paused)v.play().catch(()=>{});};
    chapEl.appendChild(b);
  });
}
function markChap(){
  if(!cur||!cur.chapters)return;
  let k=0;cur.chapters.forEach((c,i)=>{if(v.currentTime>=c.t-1.5)k=i;});
  if(k===curChap)return;curChap=k;
  [...chapEl.children].forEach((b,i)=>b.classList.toggle("act",i===k));
}
function ui(){
  let a=0,b=isFinite(v.duration)?v.duration:0;
  if(cur&&cur.kind==="branch"&&seg&&SEG[seg]){const s=SEG[seg];a=s.s/1000;if(s.e)b=s.e/1000;}
  const len=Math.max(1,b-a),p=Math.min(Math.max(v.currentTime-a,0),len),tx=fmt(p)+" / "+fmt(len);
  if($("time").textContent!==tx)$("time").textContent=tx;
  if(!dragging)seek.value=Math.round(p/len*1000);
  markChap();
}
const toggle=()=>{if(started)v.paused?v.play().catch(()=>{}):v.pause();};
function skip(sec){
  if(cur&&cur.kind==="branch"&&seg&&SEG[seg]){
    const s=SEG[seg];let hi=(s.e||v.currentTime*1000)-300;if(s.ws)hi=Math.min(hi,s.ws+400);
    v.currentTime=Math.min(Math.max(v.currentTime*1000+sec*1000,s.s),Math.max(s.s,hi))/1000;return;
  }
  const d=isFinite(v.duration)?v.duration:1e9;
  v.currentTime=Math.max(0,Math.min(d-1,v.currentTime+sec));
}
btnPlay.onclick=toggle;$("btnB").onclick=()=>skip(-10);$("btnF").onclick=()=>skip(10);
seek.addEventListener("pointerdown",()=>dragging=true);
seek.addEventListener("pointerup",()=>dragging=false);
seek.addEventListener("input",()=>{
  if(cur&&cur.kind==="branch"){const s=seg&&SEG[seg];if(s&&s.e)v.currentTime=(s.s+seek.value/1000*(s.e-s.s))/1000;}
  else if(isFinite(v.duration))v.currentTime=seek.value/1000*v.duration;
});
v.addEventListener("play",()=>btnPlay.textContent="❚❚");
v.addEventListener("pause",()=>{btnPlay.textContent="▶";saveProg();});
v.addEventListener("waiting",()=>spin(1));
v.addEventListener("seeking",()=>spin(1));
["playing","canplay","seeked"].forEach(n=>v.addEventListener(n,()=>{if(!v.seeking)spin(0);}));
v.addEventListener("progress",()=>{
  if(started||!cur||gmsg.className==="err")return;
  const b=v.buffered,a=b.length?b.end(b.length-1):0;
  gmsg.textContent=a>=6?"Listo.":"Cargando el documento… ("+~~a+" s)";
});
v.addEventListener("loadedmetadata",()=>{if(!started&&gmsg.className!=="err")gmsg.textContent="Listo para reproducir.";});
v.addEventListener("ended",()=>{if(started)finish();});
v.addEventListener("error",()=>{
  spin(0);
  if(!v.getAttribute("src"))return;
  if(cur&&cur.src.length>1){cur.src.shift();v.src=cur.src[0];v.load();return;}
  gate.style.display="flex";gmsg.className="err";btnStart.textContent="Reintentar";
  gmsg.textContent="No se pudo cargar el documento. Revisa la conexión o el enlace.";
});

function vis(el){const r=el.getBoundingClientRect();return r.width>0&&r.height>0&&!el.disabled;}
const asideList=()=>[...aside.querySelectorAll("button,input")].filter(vis);
function toggleAside(on){
  aside.classList.toggle("show",on);
  if(on)setTimeout(()=>{const f=aside.querySelector("#chap .act")||asideList()[0];if(f)f.focus(fp);},0);
  else stage.focus(fp);
}
$("btnPanel").onclick=()=>toggleAside(!aside.classList.contains("show"));
const tvEl=$("tvMode");
function setTV(on){document.body.classList.toggle("tv",on);tvEl.checked=on;}
tvEl.onchange=()=>setTV(tvEl.checked);
function setPseudo(on){
  pseudo=on;document.body.classList.toggle("pseudo",on);
  $("btnFs").classList.toggle("on",on);if(on)setTV(true);
}
$("btnFs").onclick=()=>{
  if($("sysFs").checked){
    if(document.fullscreenElement)document.exitFullscreen();
    else{const rq=$("player").requestFullscreen;if(rq)rq.call($("player")).catch(()=>{});}
    return;
  }
  setPseudo(!pseudo);
};
$("sysFs").onchange=()=>{if($("sysFs").checked)setPseudo(false);};
function revealCtl(){
  if(!pseudo||aside.classList.contains("show"))return;
  document.body.classList.add("showctl");clearTimeout(ctlT);
  ctlT=setTimeout(()=>{
    const a=document.activeElement;if(a&&a.closest&&a.closest(".ctl"))a.blur();
    document.body.classList.remove("showctl");stage.focus(fp);
  },3500);
}
["pointermove","pointerdown","touchstart"].forEach(n=>addEventListener(n,revealCtl,{passive:true}));

/* ============ teclado ============ */
const ctlList=()=>[...document.querySelectorAll(".ctl button,.ctl input")].filter(vis);
const gateList=()=>[...gate.querySelectorAll("button")].filter(vis);
function move(dir,list){
  const a=document.activeElement;if(!list.length)return;
  if(!list.includes(a)){list[0].focus(fp);return;}
  const r=a.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  let best=null,bs=1e9;
  for(const el of list){
    if(el===a)continue;
    const q=el.getBoundingClientRect(),x=q.left+q.width/2-cx,y=q.top+q.height/2-cy;
    const main=dir==="ArrowRight"?x:dir==="ArrowLeft"?-x:dir==="ArrowDown"?y:-y;
    const cross=(dir==="ArrowLeft"||dir==="ArrowRight")?Math.abs(y):Math.abs(x);
    if(main<=4)continue;
    const s=main+cross*2.5;if(s<bs){bs=s;best=el;}
  }
  if(best)best.focus({preventScroll:document.body.dataset.view!=="home"});
}
function arrow(e){
  const c=e.keyCode,k=e.key;
  if(k==="ArrowLeft"||c===21)return"ArrowLeft";if(k==="ArrowRight"||c===22)return"ArrowRight";
  if(k==="ArrowUp"||c===19)return"ArrowUp";if(k==="ArrowDown"||c===20)return"ArrowDown";
  return null;
}
addEventListener("keydown",e=>{
  lastKey=Date.now();
  const ar=arrow(e),ae=document.activeElement;
  if(document.body.dataset.view==="home"){
    const cards=[...document.querySelectorAll(".card")];
    if(ar){e.preventDefault();move(ar,cards);}
    else if(isSelect(e)){e.preventDefault();(cards.includes(ae)?ae:cards[0]).click();}
    return;
  }
  if(shown&&ovKey){ovKey(e,ar);return;}
  const asideOn=aside.classList.contains("show"),gateOn=gate.style.display!=="none"&&!started,
        endOn=endBox.classList.contains("on"),inCtl=!!(ae&&ae.closest&&ae.closest(".ctl"));
  if(isBack(e)){e.preventDefault();asideOn?toggleAside(false):pseudo?setPseudo(false):(location.hash="");return;}
  if(!e.ctrlKey&&!e.metaKey&&!e.altKey){
    const k=(e.key||"").toLowerCase();
    if(k==="c"){btnCC.click();return;}
    if(k==="f"){$("btnFs").click();return;}
    if(k==="l"){$("btnPanel").click();return;}
  }
  const list=asideOn?asideList():gateOn?gateList():endOn?[...endBox.querySelectorAll("button")]:inCtl?ctlList():null;
  if(list){
    if(ar){
      if(ae===seek&&(ar==="ArrowLeft"||ar==="ArrowRight"))return;
      e.preventDefault();
      if(inCtl&&!asideOn&&!gateOn&&!endOn&&ar==="ArrowUp"){ae.blur();stage.focus(fp);return;}
      move(ar,list);revealCtl();
    }else if(isSelect(e)){e.preventDefault();if(ae&&ae.click)ae.click();}
    return;
  }
  revealCtl();
  if(ar==="ArrowLeft"){e.preventDefault();skip(-10);}
  else if(ar==="ArrowRight"){e.preventDefault();skip(10);}
  else if(ar==="ArrowUp"||ar==="ArrowDown"){e.preventDefault();btnPlay.focus(fp);}
  else if(isOk(e)){e.preventDefault();toggle();}
},true);

/* ============ router + arranque ============ */
function route(){
  const m=location.hash.match(/^#\/t\/([\w-]+)$/);
  if(m&&CATALOG.some(t=>t.id===m[1])){
    if(!cur||cur.id!==m[1]){if(cur)closeTitle();openTitle(m[1]);}
  }else if(cur)closeTitle();
}
addEventListener("hashchange",route);
(function init(){
  if(Math.min(innerWidth,innerHeight)>=540&&!matchMedia("(pointer: coarse)").matches)setTV(true);
  const clk=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");
    $("hClock").textContent=p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());};
  clk();setInterval(clk,1000);
  renderHome();sub.ui();
  document.querySelector(".card")?.focus(fp);
  route();
})();

/*@@BDATA@@*/const RAW="",GRAW="",PRAW="",ERAW="";
</script>
