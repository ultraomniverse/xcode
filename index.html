  }

  .brand{
    display:flex;

    justify-content:center;
    gap:clamp(8px,2vw,26px);
  }

  .gun{
    width:clamp(42px,7vw,92px);
    height:auto;
    object-fit:contain;

  }
  .gun.l{transform:scaleX(-1)}

  h1{
    font-family:'Cinzel',serif;

    white-space:nowrap;

  .sub{
    font-family:'EB Garamond',serif;
    font-style:italic;
    font-size:clamp(.68rem,1.5vw,.95rem);
    letter-spacing:.1em;
    color:#ff2020;
    margin-top:.55rem;
    max-width:52ch;
    text-shadow:0 0 16px rgba(255,32,32,.4), 0 1px 3px rgba(0,0,0,.9);
  }

  .sigs{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    gap:clamp(30px,7vw,90px);
    margin-top:.9rem;
  }

  .sig{
    width:clamp(64px,9vw,116px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:.45rem;
  }

  .ink{position:relative;width:100%;aspect-ratio:2.7/1}
  .ink img,.ink svg{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:contain;
    mix-blend-mode:screen;
  }
  .ink .flip{filter:invert(1)}

  .name{
    font-family:'Cinzel',serif;
    font-size:.44rem;
    letter-spacing:.28em;
    text-indent:.28em;
    color:rgba(255,255,255,.5);
    text-shadow:0 1px 8px rgba(0,0,0,.8);
  }

  main{height:100vh}
</style>
</head>
