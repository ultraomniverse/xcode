<script>
"use strict";
const SUBS_VTT="WEBVTT\n\n1\n00:00:19.792 --> 00:00:27.792\nPor alf negrita\n\n2\n00:00:29.292 --> 00:00:37.292\npresenta:\n\n3\n00:01:24.542 --> 00:01:29.912\nProtagonizada por:\n\n4\n00:01:31.125 --> 00:01:39.125\nUna película de:\n\n5\n00:01:46.083 --> 00:01:54.083\nsatantango\n\n6\n00:09:48.458 --> 00:09:52.371\nUna mañana de octubre\nantes de las primeras gotas\n\n7\n00:09:52.500 --> 00:10:00.500\nde las largas lluvias de otoño\ncayó sobre el suelo reseco,\n\n8\n00:10:00.708 --> 00:10:08.708\ncortando la ciudad\nconvirtiendo los caminos en barro,\n\n9\n00:10:09.083 --> 00:10:14.077\nfutaki fue despertado\npor el sonido de las campanas.\n\n10\n00:10:14.208 --> 00:10:20.534\nLa solitaria capilla estaba\na ocho kilómetros de distancia,\n\n11\n00:10:20.667 --> 00:10:25.707\ny no tenía campana como ni siquiera su torre\nhabía colapsado durante la guerra.\n\n12\n00:10:25.833 --> 00:10:31.658\nY la ciudad estaba muy lejos\nPara escuchar cualquier ruido desde allí.\n\n13\n00:10:32.750 --> 00:10:40.750\nNoticias de su venida\n\n14\n00:14:20.375 --> 00:14:22.787\n¿Qué es?\n\n15\n00:14:22.917 --> 00:14:25.909\nNada, sólo vuelve a dormir.\n\n16\n00:14:31.083 --> 00:14:35.326\nrecogeré mi parte\ny vete esta noche.\n\n17\n00:14:50.708 --> 00:14:53.450\nO mañana a más tardar.\n\n18\n00:15:06.083 --> 00:15:08.495\nMañana por la mañana.\n\n19\n00:16:30.750 --> 00:16:34.038\n- ¿Tuviste un mal sueño?\n- Sí.\n\n20\n00:16:34.917 --> 00:16:37.499\nEstaba sentado en una habitación.\n\n21\n00:16:38.125 --> 00:16:41.697\nDe repente hubo un golpe\nen la ventana.\n\n22\n00:16:42.583 --> 00:16:44.949\nNo me atrevía a abrirlo.\n\n23\n00:16:45.083 --> 00:16:48.575\nMiré a través de las cortinas.\n\n24\n00:16:49.667 --> 00:16:53.455\nSólo pude ver su espalda,\nmientras intentaba abrir la puerta.\n\n25\n00:16:54.167 --> 00:16:58.706\nY su boca mientras gritaba\nalgo, no pude entender qué.\n\n26\n00:16:59.833 --> 00:17:02.495\nTenía la cara sin afeitar.\n\n27\n00:17:03.500 --> 00:17:06.617\nSus ojos eran como de cristal.\n\n28\n00:17:13.250 --> 00:17:19.906\nEntonces, la señora halics miró hacia adentro\npor la ventana, sonriendo...\n\n29\n00:17:24.792 --> 00:17:28.455\nElla estaba mirando hacia adentro\ny luego ella desapareció.\n\n30\n00:17:29.000 --> 00:17:34.370\nEl hombre siguió pateando la puerta.\nestaba a punto de estallar.\n\n31\n00:17:36.250 --> 00:17:41.870\nCorrí hacia el aparador\nQuería abrir el cajón.\n\n32\n00:17:42.417 --> 00:17:45.864\nEntonces escuché la puerta chocar.\n\n33\n00:17:47.000 --> 00:17:50.242\nQuienquiera que fuera,\nya estaba bajando por el pasillo.\n\n34\n00:17:51.333 --> 00:17:55.576\nPor fin abrí el cajón\ny sacó el cuchillo.\n\n35\n00:17:55.708 --> 00:17:57.869\nY él venía hacia mí.\n\n36\n00:17:58.000 --> 00:18:02.619\nDe repente estaba mintiendo\ndebajo de la mesa de la cocina,\n\n37\n00:18:03.333 --> 00:18:07.076\nrodeado\npor cacerolas rojas y azules,\n\n38\n00:18:07.208 --> 00:18:10.280\nresonando y rodando.\n\n39\n00:18:11.042 --> 00:18:14.830\nY luego el suelo\nse movía bajo mis pies.\n\n40\n00:18:16.167 --> 00:18:19.489\nToda la cocina empezó a moverse.\n\n41\n00:18:20.000 --> 00:18:22.286\ncomo si fuera un coche.\n\n42\n00:18:24.583 --> 00:18:27.074\nMe despertaron las campanas.\n\n43\n00:18:27.208 --> 00:18:28.664\n¿Dónde? ¿Aquí?\n\n44\n00:18:28.792 --> 00:18:32.489\nTocaron dos veces.\n\n45\n00:18:33.417 --> 00:18:37.615\n- Al final nos volveremos locos.\n- No.\n\n46\n00:18:37.750 --> 00:18:41.572\nestoy seguro de algo\nva a pasar hoy.\n\n47\n00:18:50.083 --> 00:18:52.995\nEs mi marido, lo reconozco.\n\n48\n00:18:54.833 --> 00:18:57.119\nApurarse.\n\n49\n00:19:04.625 --> 00:19:08.243\nEscucha, haz exactamente lo que te digo.\n\n50\n00:19:09.292 --> 00:19:11.658\n¿Está eso claro?\n\n51\n00:19:13.292 --> 00:19:16.739\nEmpiece a empacar. ¡Mover!\n\n52\n00:19:18.750 --> 00:19:19.830\nNos vamos esta noche.\n\n53\n00:19:19.958 --> 00:19:26.739\nEmpacar nuestra ropa, botas,\nabrigos, la radio, todo.\n\n54\n00:19:26.875 --> 00:19:29.491\nTenemos que desaparecer de aquí esta noche.\n\n55\n00:19:29.625 --> 00:19:31.957\n¿Tú entiendes?\n\n56\n00:19:36.042 --> 00:19:38.408\n- ¿Lo entendiste?\n- Estás loco.\n\n57\n00:19:38.542 --> 00:19:40.578\n¿Qué estás diciendo?\n\n58\n00:19:40.708 --> 00:19:44.200\nHe hablado con Kraner,\nEsta noche nos vamos con el dinero.\n\n59\n00:19:44.333 --> 00:19:48.372\nSi lo dividimos en ocho partes,\nNunca saldremos de aquí.\n\n60\n00:19:48.500 --> 00:19:50.582\nCrees que los demás\n¿Simplemente lo aceptará?\n\n61\n00:19:50.708 --> 00:19:54.075\n¿Halics, el maestro de escuela y futaki?\n\n62\n00:19:54.208 --> 00:19:58.952\nno trabajé por un año\nSólo para regalarlo ahora.\n\n63\n00:19:59.500 --> 00:20:01.240\nPueden irse al infierno.\n\n64\n00:20:01.375 --> 00:20:04.117\nPero no llegará a eso.\n\n65\n00:20:04.250 --> 00:20:07.572\nPor fin podemos comprar la granja,\n¿no lo ves?\n\n66\n00:20:07.708 --> 00:20:10.905\nEstás loco.\nDebes estar loco.\n\n67\n00:20:11.042 --> 00:20:15.706\nEmpiece a empacar. Los bidones,\nla manteca, la harina, la cama...\n\n68\n00:20:37.417 --> 00:20:39.874\nDejé mi bastón afuera.\n\n69\n00:21:08.167 --> 00:21:10.203\n¡Salir!\n\n70\n00:22:38.292 --> 00:22:41.079\nSchmidt, ¿estás dentro?\n\n71\n00:22:51.500 --> 00:22:54.333\nQuerías escapar\ncon el dinero, ¿no?\n\n72\n00:22:54.917 --> 00:22:57.533\nno te hubiera llevado\npara alguien que haría eso.\n\n73\n00:22:58.833 --> 00:23:01.040\nPuedo explicarlo.\n\n74\n00:23:02.958 --> 00:23:04.949\n¿Kraner también está involucrado?\n\n75\n00:23:05.083 --> 00:23:07.039\nCincuenta y cincuenta.\n\n76\n00:23:10.292 --> 00:23:12.157\nEntonces, ¿qué pasa ahora?\n\n77\n00:23:13.375 --> 00:23:17.197\n¿Qué pasaría?\nNosotros también te tratamos.\n\n78\n00:23:18.875 --> 00:23:21.537\nEsperamos hasta el anochecer\ny luego partimos.\n\n79\n00:23:25.083 --> 00:23:27.039\n¿Qué quieres decir?\n\n80\n00:23:29.292 --> 00:23:31.078\nQuiero decir, lo dividimos en tres partes.\n\n81\n00:23:33.417 --> 00:23:35.499\nPero no me arruines.\n\n82\n00:23:38.042 --> 00:23:42.365\nTodo lo que estoy pidiendo\nes pedir prestada tu parte.\n\n83\n00:23:43.375 --> 00:23:47.323\nSólo por un corto tiempo... un año.\n\n84\n00:23:48.333 --> 00:23:52.030\nHasta que podamos encontrar un lugar\nestablecerse en alguna parte.\n\n85\n00:23:55.750 --> 00:23:58.617\ny donde mas\n¿Necesitas que te bese?\n\n86\n00:23:58.750 --> 00:24:01.537\nDijiste que no te moverías\na cualquier parte desde aquí.\n\n87\n00:24:01.667 --> 00:24:04.409\nno quiero quedarme aquí\nhasta el final de mi vida.\n\n88\n00:24:06.750 --> 00:24:10.117\nNo lo pido como regalo.\nQuiero un préstamo.\n\n89\n00:24:11.750 --> 00:24:15.242\nTrabajé tanto como los demás.\n\n90\n00:24:15.375 --> 00:24:17.741\nY ahora estás hablando de \"un préstamo\".\n\n91\n00:24:18.750 --> 00:24:21.036\n¿Entonces no confías en mí?\n\n92\n00:24:21.167 --> 00:24:23.032\nPor supuesto que no.\n\n93\n00:24:23.958 --> 00:24:26.324\nEstás del lado de Kraner.\n\n94\n00:24:26.458 --> 00:24:28.870\nquieres alejarte\ncon todo el dinero.\n\n95\n00:24:29.000 --> 00:24:31.241\n¿Y debería confiar en ti después de todo esto?\n\n96\n00:24:37.083 --> 00:24:41.122\n- ¿Qué pasa con los demás?\n- ¿Cómo lo sabría?\n\n97\n00:24:43.667 --> 00:24:46.739\nTenemos que esperar hasta que oscurezca.\nantes de que nos vayamos.\n\n98\n00:24:48.167 --> 00:24:52.661\nLe dijimos lo mismo a Kraner.\nNos reunimos en la cruz después del anochecer.\n\n99\n00:24:58.333 --> 00:25:01.291\n¿Por qué volviste?\n\n100\n00:25:02.917 --> 00:25:07.115\nsolo pensamos en eso\nen el camino de regreso a casa.\n\n101\n00:25:07.250 --> 00:25:10.538\n¿Y dejar atrás a la mujer?\n\n102\n00:25:10.667 --> 00:25:14.740\nEso es cierto.\nElla realmente lo vale.\n\n103\n00:25:17.958 --> 00:25:22.531\n- ¿Y los kraners?\n- Quieren ir al norte.\n\n104\n00:25:23.042 --> 00:25:26.455\nLa esposa de Kraner escuchó\nsobre un almacén de madera allí...\n\n105\n00:27:25.792 --> 00:27:27.532\nEstá lloviendo.\n\n106\n00:27:30.542 --> 00:27:32.373\nPuedo oírlo.\n\n107\n00:27:45.958 --> 00:27:49.871\nvoy al sur,\nLos inviernos son más cortos allí.\n\n108\n00:27:51.750 --> 00:27:54.036\nAlquilaré una granja.\n\n109\n00:27:55.250 --> 00:27:58.037\nCerca de un pueblo próspero.\n\n110\n00:27:59.917 --> 00:28:03.739\nRemojar mis pies todo el día.\nen un recipiente con agua caliente.\n\n111\n00:28:03.875 --> 00:28:05.285\nO...\n\n112\n00:28:07.625 --> 00:28:11.117\nseré un vigilante\nen una fábrica de chocolate.\n\n113\n00:28:12.042 --> 00:28:15.739\nO un portero en un dormitorio de chicas.\n\n114\n00:28:17.250 --> 00:28:19.992\nY trata de olvidarlo todo.\n\n115\n00:28:23.500 --> 00:28:27.163\nUn recipiente con agua caliente\ny nada que hacer.\n\n116\n00:28:28.125 --> 00:28:31.242\nSólo mira pasar la puta vida.\n\n117\n00:28:58.292 --> 00:29:01.284\n¿A dónde diablos queremos ir?\n\n118\n00:29:02.250 --> 00:29:05.117\nSeríamos atrapados por la policía.\nen el primer pueblo.\n\n119\n00:29:06.042 --> 00:29:08.624\nNi siquiera preguntarían\nnuestros nombres.\n\n120\n00:29:13.292 --> 00:29:17.991\n- Tienes el bolsillo lleno de dinero.\n- Ése es precisamente el punto.\n\n121\n00:29:18.500 --> 00:29:22.038\nHaz la maleta y vete\ncomo un grupo de mendigos.\n\n122\n00:29:22.167 --> 00:29:26.035\n- No es asunto tuyo.\n- ¿Indulto?\n\n123\n00:29:28.208 --> 00:29:30.324\nNada.\n\n124\n00:29:30.458 --> 00:29:32.995\nSilencio o se despertará.\n\n125\n00:30:51.042 --> 00:30:52.907\n¿Qué estamos esperando?\n\n126\n00:30:53.875 --> 00:30:55.957\n¿Por qué no dividimos el dinero?\n\n127\n00:31:43.792 --> 00:31:45.532\n¿No puede esperar?\n\n128\n00:31:50.458 --> 00:31:52.289\nVamos a dividirlo ahora.\n\n129\n00:31:56.875 --> 00:31:59.161\nNo te preocupes, obtendrás tu parte.\n\n130\n00:32:01.375 --> 00:32:06.995\nEsperemos hasta Kraner.\nnos da la otra mitad.\n\n131\n00:32:11.625 --> 00:32:13.957\nEs todo muy sencillo.\n\n132\n00:32:14.458 --> 00:32:16.915\nDividiremos lo que tienes.\n\n133\n00:32:17.042 --> 00:32:20.489\nY el resto, cuando lo tengamos,\nNos dividiremos en el crucifijo.\n\n134\n00:32:26.625 --> 00:32:28.911\nTráeme la linterna.\n\n135\n00:32:40.625 --> 00:32:42.707\nEl documento...\n\n136\n00:32:52.167 --> 00:32:56.831\nPara ver mejor el dinero.\nEntonces verás que no estoy haciendo trampa.\n\n137\n00:33:00.625 --> 00:33:02.365\nVamos a contarlo.\n\n138\n00:34:42.958 --> 00:34:45.040\nEs exactamente eso.\n\n139\n00:34:56.875 --> 00:34:59.708\n¡Sra. schmidt! ¿Estás dentro?\n\n140\n00:34:59.833 --> 00:35:01.744\n- ¿Sra. Schmidt?\n- Escóndelo rápidamente.\n\n141\n00:35:04.250 --> 00:35:05.990\nDeshazte de ella.\n\n142\n00:35:07.125 --> 00:35:10.868\nSi ella pone un pie aquí\nLa estrangularé.\n\n143\n00:35:40.625 --> 00:35:45.449\n- ¿Tu esposa se ausentará por un tiempo?\n- Le romperé la cara.\n\n144\n00:35:57.292 --> 00:35:59.533\n- ¿Qué quería ella?\n- Se ha vuelto loca.\n\n145\n00:35:59.667 --> 00:36:02.955\nElla esta diciendo que irimias\ny petrina vienen por el camino.\n\n146\n00:36:03.083 --> 00:36:05.790\nY quizás ya estén en el pub.\n\n147\n00:36:07.042 --> 00:36:12.582\nY que... ellos pueden...\nYa llegaron.\n\n148\n00:36:12.708 --> 00:36:17.031\nEl conductor los vio irse.\n\n149\n00:36:17.167 --> 00:36:22.036\nel tambien dijo\nlos había visto llegar al pueblo.\n\n150\n00:36:23.250 --> 00:36:26.413\nLuego en el cruce de elek.\nEllos vienen aquí.\n\n151\n00:36:27.375 --> 00:36:29.661\nLa Biblia la ha vuelto loca.\n\n152\n00:36:29.792 --> 00:36:32.864\n- ¿Pero y si es realmente cierto?\n- Bueno, si es así...\n\n153\n00:36:33.458 --> 00:36:36.746\nMurieron hace un año y medio,\ntodo el mundo lo sabe.\n\n154\n00:36:37.333 --> 00:36:39.870\nNo caigas en eso, es una trampa.\n\n155\n00:36:40.000 --> 00:36:43.242\nEs posible que sanyi horgos\n¿Simplemente ha mentido?\n\n156\n00:36:44.167 --> 00:36:48.615\n- También lo escuchamos de él.\n- ¡Muerto desde hace un año y medio!\n\n157\n00:36:49.417 --> 00:36:53.706\nLo sospeché entonces,\npero nadie me escuchó.\n\n158\n00:36:54.333 --> 00:36:57.040\nNos dijo una mentira.\nPor supuesto que estaba mintiendo.\n\n159\n00:36:59.042 --> 00:37:01.283\nEstás loco.\n\n160\n00:37:15.667 --> 00:37:18.955\nTodo va a cambiar,\nya verás.\n\n161\n00:37:21.000 --> 00:37:23.241\nIrimías es un mago.\n\n162\n00:37:25.875 --> 00:37:29.038\nÉl podría construir un castillo.\nIncluso con mierda de vaca.\n\n163\n00:37:29.958 --> 00:37:31.823\nSi él quiere.\n\n164\n00:37:33.000 --> 00:37:34.956\nDe ninguna manera.\n\n165\n00:37:36.208 --> 00:37:40.201\n- No arruinarás mis planes.\n- No tengo intención de hacerlo.\n\n166\n00:37:42.375 --> 00:37:44.991\n¿Un muerto vuelve a la vida?\nFutakil\n\n167\n00:37:45.125 --> 00:37:47.537\ntú, al menos,\ndebería tener más sentido.\n\n168\n00:37:50.167 --> 00:37:54.661\nsospechan algo\ny quieres atraparnos\n\n169\n00:37:57.667 --> 00:38:01.034\n- Voy al pub.\n- Puede que sea cierto.\n\n170\n00:38:01.750 --> 00:38:03.536\nMalditos tontos.\n\n171\n00:38:04.042 --> 00:38:08.911\nSi están aquí,\nNo puedes huir de las irimias.\n\n172\n00:38:09.042 --> 00:38:12.409\nYa lo sabes. ¿Bien?\n\n173\n00:38:13.375 --> 00:38:15.457\nSois unos malditos tontos.\n\n174\n00:38:17.542 --> 00:38:21.080\n- Si no lo crees...\n- Vete al infierno.\n\n175\n00:38:23.042 --> 00:38:27.991\nPero será mejor que te vayas\nMi dinero aquí sobre la mesa.\n\n176\n00:38:28.125 --> 00:38:31.492\nSi no crees esto\nEntonces deja que tu esposa vaya primero.\n\n177\n00:38:32.625 --> 00:38:34.490\n¿Y el dinero?\n\n178\n00:38:34.625 --> 00:38:37.788\nBueno...\nDejémoslo donde está.\n\n179\n00:38:38.375 --> 00:38:40.832\nDebes confiar en ella, ¿no?\n\n180\n00:38:52.542 --> 00:38:54.828\nEntonces me iré.\n\n181\n00:40:10.208 --> 00:40:11.869\n¿Has oído? Están aquí.\n\n182\n00:40:12.000 --> 00:40:15.788\nMi marido ya se fue\nMe acaba de enviar para decírtelo.\n\n183\n00:40:15.917 --> 00:40:19.489\nPero deberías saberlo.\nVimos a la señora halics aquí.\n\n184\n00:40:19.625 --> 00:40:24.039\nYa me voy, no quiero molestarte.\nMi marido dice: \"A la mierda el dinero\".\n\n185\n00:40:24.167 --> 00:40:28.706\nEsto no es para nosotros. ¿Estar huyendo por ello?\n¿No pasar una noche tranquila?\n\n186\n00:40:28.833 --> 00:40:31.950\n¡De ninguna manera!\nIrimías y petrina, ya veréis...\n\n187\n00:40:32.083 --> 00:40:38.659\nSiempre conocí al niño horgos de ojos furtivos\ninventó todo.\n\n188\n00:40:38.792 --> 00:40:44.241\nTú también puedes verlo, él simplemente lo inventó todo.\nY lo creímos desde el principio.\n\n189\n00:40:44.375 --> 00:40:48.163\n- ¡Tú también estás en esto!\n- Que vengan, no me importa.\n\n190\n00:41:08.792 --> 00:41:10.373\nEntonces, ¿nos vamos?\n\n191\n00:42:45.042 --> 00:42:49.331\nEntonces schmidt fue primero.\nFutaki se tambaleó detrás de él.\n\n192\n00:42:50.042 --> 00:42:55.241\nEstaba tratando de sentir su camino\ncon su bastón en la oscuridad\n\n193\n00:42:56.042 --> 00:43:00.206\ny la lluvia implacable\nlas malas palabras de Schmidt mezclado\n\n194\n00:43:00.333 --> 00:43:04.702\ncon el alegre y alentador fulaki\npalabras, mientras repetía,\n\n195\n00:43:04.833 --> 00:43:08.405\n\"No importa, viejo, ya verás.\n¡Tendremos una gran vida!\n\n196\n00:43:08.542 --> 00:43:10.498\n\"¡Una gran vida!\"\n\n197\n00:43:26.833 --> 00:43:34.833\n¡Seremos resucitados!\n\n198\n00:48:03.667 --> 00:48:06.864\nLos dos relojes muestran\ndiferentes tiempos.\n\n199\n00:48:09.375 --> 00:48:14.324\nAmbos están equivocados, por supuesto.\nÉste de aquí es demasiado lento.\n\n200\n00:48:16.917 --> 00:48:22.742\nEl otro, como si mostrara la\nperpetuidad de la indefensión.\n\n201\n00:48:24.250 --> 00:48:28.072\nSólo nos relacionamos con eso\ncomo ramitas a la lluvia.\n\n202\n00:48:29.292 --> 00:48:31.999\nNo somos capaces de defendernos.\n\n203\n00:48:33.667 --> 00:48:35.874\n¿Ramitas y lluvia?\n\n204\n00:48:40.583 --> 00:48:43.575\nEres un gran poeta, te lo digo.\n\n205\n00:48:58.000 --> 00:49:03.040\n- ¿Crees que aquí hay un snack bar?\n- No me parece.\n\n206\n00:49:20.667 --> 00:49:23.079\n¿Qué estás esperando?\n\n207\n00:49:23.208 --> 00:49:25.950\n- Nos convocaron.\n- Déjeme ver.\n\n208\n00:49:31.292 --> 00:49:34.580\n¿No sabes leer?\n¿Qué piso es este?\n\n209\n00:49:37.792 --> 00:49:41.410\n- El segundo.\n- Sólo sígueme.\n\n210\n00:50:48.958 --> 00:50:50.914\nIdentificación.\n\n211\n00:50:51.042 --> 00:50:54.455\n¿Puedo tener la citación?\ny tus cédulas de identidad?\n\n212\n00:51:00.375 --> 00:51:04.072\nLlene esto y lea la información\nen la espalda.\n\n213\n00:51:44.417 --> 00:51:46.123\nSígueme.\n\n214\n00:52:54.083 --> 00:52:57.280\n- ¿Irimías?\n- Sí. Ese soy yo.\n\n215\n00:52:59.125 --> 00:53:00.990\nSentarse.\n\n216\n00:53:05.333 --> 00:53:09.827\n- ¿Eres gitana?\n- No. Mi nombre es petrina.\n\n217\n00:53:09.958 --> 00:53:13.371\n¿Peterina?\n¿Qué clase de nombre es ese?\n\n218\n00:53:13.500 --> 00:53:15.081\nRumano.\n\n219\n00:53:15.208 --> 00:53:19.781\n- ¿Conocías a tu madre?\n- No.\n\n220\n00:53:22.667 --> 00:53:24.658\nIrimías.\n\n221\n00:53:32.583 --> 00:53:34.619\nAsí que aquí...\n\n222\n00:53:42.000 --> 00:53:45.913\ntodo depende\nen qué estado de ánimo estoy.\n\n223\n00:53:56.125 --> 00:53:58.707\nDéjame preguntarte.\n\n224\n00:53:58.833 --> 00:54:06.205\nDesde que fuiste liberado,\n¿Por qué no has buscado trabajo?\n\n225\n00:54:12.292 --> 00:54:16.205\nEstoy seguro de que has estado ocupado\npero podrías haberlo intentado.\n\n226\n00:54:16.333 --> 00:54:18.870\nEstás bajo vigilancia,\ndespués de todo.\n\n227\n00:54:19.000 --> 00:54:26.873\nY está muy claro que no fue así.\nSe te ocurre nada para encontrar trabajo.\n\n228\n00:54:27.000 --> 00:54:31.198\nYa nos conoce, capitán.\n\n229\n00:54:31.333 --> 00:54:33.289\nNo tan bien\n\n230\n00:54:33.417 --> 00:54:36.580\n¿Te refieres a tu futuro?\n\n231\n00:54:36.708 --> 00:54:39.495\nPero eres un hombre joven.\n\n232\n00:54:42.083 --> 00:54:44.870\nno estoy enamorado\ncon mi trabajo tampoco,\n\n233\n00:54:45.000 --> 00:54:48.367\npero realmente quieres\nestar sin trabajo\n\n234\n00:54:48.500 --> 00:54:49.831\nel resto de tu vida?\n\n235\n00:54:54.042 --> 00:54:55.042\nSí.\n\n236\n00:54:55.167 --> 00:54:59.080\nAquí está este documento, mira,\ndice que\n\n237\n00:54:59.208 --> 00:55:03.497\nno respetas el trabajo,\n\n238\n00:55:03.625 --> 00:55:06.913\no aquellos que trabajan duro.\n\n239\n00:55:07.417 --> 00:55:09.373\nPalabras bonitas.\n\n240\n00:55:10.333 --> 00:55:12.949\nPero los años pasarán un día.\n\n241\n00:55:13.083 --> 00:55:17.122\n¿Tienes esposa e hijos?\n\n242\n00:55:17.250 --> 00:55:21.163\nEsperas que tu hijo te apoye,\no que?\n\n243\n00:55:21.625 --> 00:55:24.992\nCuando tu pierna está rota,\n\n244\n00:55:25.125 --> 00:55:26.851\no te rompes la espalda,\ntienes una herida en la cabeza,\n\n245\n00:55:26.875 --> 00:55:30.993\ncosas serias, cuando no se puede\ncuidarte más.\n\n246\n00:55:32.583 --> 00:55:35.700\nEstamos del lado de la ley,\nigual que tú.\n\n247\n00:55:39.125 --> 00:55:44.040\nconocemos la ley\ny no lo hemos roto hasta ahora.\n\n248\n00:55:44.167 --> 00:55:48.490\nSegún este documento\nlo único que has hecho es romperlo.\n\n249\n00:55:48.625 --> 00:55:53.324\n- No.\n- Y con un esfuerzo considerable.\n\n250\n00:55:54.875 --> 00:55:56.831\nEso es exactamente lo que parece.\n\n251\n00:55:58.417 --> 00:56:01.955\nY entonces ¿cuál es la verdad?\n¿Si eso es lo que \"parece\"?\n\n252\n00:56:02.083 --> 00:56:04.324\nQue respetamos la ley.\n\n253\n00:56:04.458 --> 00:56:09.873\n- ¿Y por qué empezar ahora mismo?\n- No empezamos ahora.\n\n254\n00:56:10.000 --> 00:56:13.492\nHas respetado la ley\n¿Desde tu primera infancia?\n\n255\n00:56:13.625 --> 00:56:16.662\n- Así es.\n- Mi abuelo lo respetaba.\n\n256\n00:56:16.792 --> 00:56:19.158\nEse era tu abuelo, no tú.\n\n257\n00:56:20.875 --> 00:56:23.742\nHabla de ti mismo\nno sobre tu abuelo.\n\n258\n00:56:26.250 --> 00:56:31.119\nSomos ciudadanos leales\nde este país, capitán.\n\n259\n00:56:31.250 --> 00:56:38.656\nDéjame recordarte nuestros servicios.\nse han utilizado durante muchos años.\n\n260\n00:56:43.000 --> 00:56:45.207\n¿Cómo sucedió esto?\n\n261\n00:56:48.708 --> 00:56:52.326\nNo llamen a sus vidas una tragedia.\n\n262\n00:56:53.417 --> 00:56:56.614\nSea humilde, no haya tragedia.\n\n263\n00:56:56.750 --> 00:57:00.163\n- Ya nos conoce, capitán.\n- Por supuesto que sí.\n\n264\n00:57:00.292 --> 00:57:03.534\nPero esto no es una tragedia,\nes pura villanía.\n\n265\n00:57:03.667 --> 00:57:06.283\n¿Por qué no dejamos todo?\ncomo antes?\n\n266\n00:57:06.417 --> 00:57:10.911\n¿Dejarlo como antes?\n¿Nunca querrás cambiar?\n\n267\n00:57:12.625 --> 00:57:18.200\nNo esa vida humana\nes tan valorado.\n\n268\n00:57:18.958 --> 00:57:23.827\nMantener el orden puede parecer\nla responsabilidad de las autoridades.\n\n269\n00:57:24.917 --> 00:57:28.739\nPero últimamente es asunto del pueblo.\nEl orden.\n\n270\n00:57:29.625 --> 00:57:34.915\nSin embargo, en libertad existe\nalgo no humano,\n\n271\n00:57:36.625 --> 00:57:41.119\nsino más bien divino.\n\n272\n00:57:42.042 --> 00:57:45.830\nPero nuestras vidas son demasiado cortas\npara que podamos descubrirlo correctamente.\n\n273\n00:57:45.958 --> 00:57:53.958\nSi busca un vínculo entre el pedido\ny libertad, piensa en pericles.\n\n274\n00:57:58.583 --> 00:58:03.577\nDijo orden y libertad.\nestán unidos por la pasión.\n\n275\n00:58:04.583 --> 00:58:08.872\nTenemos que creer en ambos,\nya que sufrimos de ambos.\n\n276\n00:58:09.375 --> 00:58:12.287\nTanto desde el orden como desde la libertad.\n\n277\n00:58:14.583 --> 00:58:19.031\nPero la vida humana tiene sentido,\nrica, hermosa y sucia.\n\n278\n00:58:19.167 --> 00:58:21.328\nLo abarca todo.\n\n279\n00:58:21.875 --> 00:58:28.872\nPero abusamos de la libertad,\ndesperdiciarlo como si fuera sólo basura.\n\n280\n00:58:29.000 --> 00:58:34.324\nA la gente no le gusta la libertad.\nLe tienen miedo.\n\n281\n00:58:35.000 --> 00:58:42.623\nEsto es extraño, porque no hay nada.\ntemer cuando se trata de libertad.\n\n282\n00:58:44.458 --> 00:58:50.203\nEl orden, por otra parte,\nmuchas veces puede ser aterrador.\n\n283\n00:58:56.708 --> 00:59:00.326\nPero debo llamar tu atención.\na ciertos puntos.\n\n284\n00:59:00.458 --> 00:59:04.201\nEl quid de la cuestión es,\n\n285\n00:59:05.250 --> 00:59:08.788\nno tienes elección\nsino cooperar.\n\n286\n00:59:11.083 --> 00:59:17.079\nY mi punto es que\nsi realmente respetas la ley,\n\n287\n00:59:17.208 --> 00:59:23.033\nentonces, es obvio, que solo estoy\nun poco por delante de ti en esto.\n\n288\n00:59:23.167 --> 00:59:27.240\nPrácticamente tienes...\nSe lo ofreció.\n\n289\n00:59:27.375 --> 00:59:30.993\nTe respetamos mucho\ncapitán...\n\n290\n00:59:31.125 --> 00:59:34.037\nNo \"capitán\". ¡La ley!\n\n291\n00:59:35.125 --> 00:59:37.707\nPero usted es la ley misma, capitán.\n\n292\n00:59:37.833 --> 00:59:41.451\nOh, no. la ley,\nEsos somos todos nosotros juntos.\n\n293\n00:59:42.208 --> 00:59:43.869\n¿Por qué no dejar las cosas como están?\n\n294\n00:59:44.000 --> 00:59:47.492\nAhora mismo, por ejemplo,\nson proscritos.\n\n295\n00:59:48.458 --> 00:59:50.949\nY sabes muy bien por qué.\n\n296\n00:59:53.250 --> 00:59:56.447\nSupongo\nNo tengo que leerlo todo.\n\n297\n00:59:57.458 --> 01:00:00.120\nNo diré esto otra vez.\n\n298\n01:00:00.708 --> 01:00:03.871\nDe ahora en adelante,\no trabajas para mi\n\n299\n01:00:04.000 --> 01:00:07.697\no... bueno, tengo que decir,\nRealmente no tienes otra opción.\n\n300\n01:00:13.000 --> 01:00:15.116\nSeñor irimias.\n\n301\n01:00:30.833 --> 01:00:32.994\nPuedes irte ahora.\n\n302\n01:01:47.417 --> 01:01:49.783\nDos ron y licores.\n\n303\n01:01:51.042 --> 01:01:53.454\nY un paquete de cigarrillos.\n\n304\n01:02:02.000 --> 01:02:04.867\n- A los grandes me refiero.\n- Lo siento.\n\n305\n01:02:05.000 --> 01:02:07.082\nHazte a un lado, por favor.\n\n306\n01:02:15.708 --> 01:02:18.905\n¿Puedo recordarte los cigarrillos?\n\n307\n01:02:19.042 --> 01:02:21.499\nLo siento, lo olvidé.\n\n308\n01:02:22.792 --> 01:02:25.374\n¿Podemos preguntar qué es tan gracioso?\n\n309\n01:02:25.500 --> 01:02:28.572\nNada. Lo siento.\n\n310\n01:02:43.333 --> 01:02:45.415\n¿Puedes oír eso?\n\n311\n01:02:49.333 --> 01:02:51.369\n¿Qué es?\n\n312\n01:02:51.500 --> 01:02:53.365\n¿Una máquina?\n\n313\n01:02:58.000 --> 01:02:59.991\n¿Las luces?\n\n314\n01:03:01.333 --> 01:03:03.574\n¿Alguien está cantando?\n\n315\n01:03:05.000 --> 01:03:07.332\n¿Quién se atrevería a cantar aquí?\n\n316\n01:03:11.417 --> 01:03:13.783\n¡Tranquilo!\n\n317\n01:03:52.333 --> 01:03:55.325\nLo volaremos todo.\n\n318\n01:03:55.917 --> 01:03:59.080\n- ¿Deberíamos llamar a la policía?\n- No es necesario.\n\n319\n01:04:07.083 --> 01:04:09.870\nLos volaremos a todos.\n\n320\n01:04:11.250 --> 01:04:14.913\nColocaremos explosivos en sus\nchaquetas... o en sus oídos.\n\n321\n01:04:15.500 --> 01:04:18.572\nLe pegaremos la dinamita\nen sus narices.\n\n322\n01:04:22.875 --> 01:04:26.322\nTendremos que detener esto de alguna manera.\n¿no crees?\n\n323\n01:04:35.500 --> 01:04:38.492\nClaro, ¿por qué complicar las cosas?\n\n324\n01:04:39.333 --> 01:04:42.370\nLos volaremos uno por uno.\n\n325\n01:04:51.875 --> 01:04:54.457\nLos mataremos a todos.\n\n326\n01:04:54.583 --> 01:04:57.245\nEn muy poco tiempo.\n\n327\n01:05:35.083 --> 01:05:38.155\n¿Cómo lo sabes?\n¿todavía están ahí?\n\n328\n01:05:38.292 --> 01:05:42.240\nCreo que se habían escapado hace mucho tiempo.\nsi tienen algún sentido.\n\n329\n01:05:42.375 --> 01:05:48.496\n¿A ellos? eran sirvientes\ny así seguirá siendo toda su vida.\n\n330\n01:05:48.625 --> 01:05:51.697\nSe sientan en la cocina\nmierda en la esquina,\n\n331\n01:05:51.833 --> 01:05:54.245\nDe vez en cuando miran por la ventana.\npara ver lo que hacen los demás.\n\n332\n01:05:54.375 --> 01:05:57.208\nLos conozco de adentro hacia afuera.\n\n333\n01:05:57.333 --> 01:06:00.450\n¿Qué te hace estar tan seguro?\n\n334\n01:06:00.583 --> 01:06:05.873\nCreo que no hay nadie allí. las casas\nestán vacíos, las tejas son robadas...\n\n335\n01:06:06.000 --> 01:06:09.492\nEn el mejor de los casos, hay una o dos ratas en el molino,\ntodo piel y hueso.\n\n336\n01:06:09.625 --> 01:06:14.324\nSimplemente se sientan en el mismo\nheces sucias.\n\n337\n01:06:14.458 --> 01:06:19.623\nRellenarse de patatas\ny no sé qué ha pasado.\n\n338\n01:06:19.750 --> 01:06:24.119\nSe miran con recelo\nmientras eructan en el silencio,\n\n339\n01:06:24.250 --> 01:06:31.031\ny esperar con determinación, porque\ncreen que han sido engañados.\n\n340\n01:06:31.500 --> 01:06:33.491\nson esclavos\nque han perdido a su amo.\n\n341\n01:06:33.625 --> 01:06:37.914\nNo pueden vivir sin orgullo\ndignidad y coraje,\n\n342\n01:06:38.042 --> 01:06:43.491\npero no sienten tales cualidades\nresiden dentro de ellos.\n\n343\n01:06:43.625 --> 01:06:46.287\nellos solo saben vivir\na la sombra de tales cosas.\n\n344\n01:06:46.417 --> 01:06:47.827\nYa basta, ¿quieres?\n\n345\n01:06:47.958 --> 01:06:52.873\nSiguen esa sombra,\ncomo lemmings, por un acantilado.\n\n346\n01:06:53.000 --> 01:06:58.074\nno pueden vivir\nsin sus fantasías.\n\n347\n01:06:58.917 --> 01:07:06.917\nPero cuando se acercan demasiado,\nno pueden manejarlo.\n\n348\n01:07:08.750 --> 01:07:12.618\nLo que realmente necesitan es una habitación con calefacción.\ny un plato de guiso de pimentón picante.\n\n349\n01:07:12.750 --> 01:07:16.163\nSon felices si por la noche,\nbajo una cálida colcha\n\n350\n01:07:16.292 --> 01:07:19.250\nencuentran a la gordita esposa del vecino.\n\n351\n01:07:19.375 --> 01:07:22.367\n- ¿Estás escuchando en absoluto?\n- Claro, lo que sea.\n\n352\n01:08:39.708 --> 01:08:42.950\n- Te he estado esperando por un tiempo.\n- ¿Cómo supiste que íbamos a venir?\n\n353\n01:08:43.083 --> 01:08:45.790\n- Del director.\n- ¿Qué director?\n\n354\n01:08:45.917 --> 01:08:49.159\n- Kelemen.\n- ¿Por qué? ¿Kelemen se convirtió en director de orquesta?\n\n355\n01:08:49.292 --> 01:08:52.534\nDesde la primavera, en el autocar.\n\n356\n01:08:52.667 --> 01:08:56.330\nPero el entrenador no corre ahora.\n\n357\n01:08:57.958 --> 01:09:02.748\nPrometiste que si me extendía\nel rumor en la finca de que habías muerto,\n\n358\n01:09:02.875 --> 01:09:04.706\nme conectarías\ncon la señora schmidt.\n\n359\n01:09:04.833 --> 01:09:06.915\nCumplo mis promesas.\n\n360\n01:09:07.042 --> 01:09:11.365\nY usted me lo prometió a la señora kraner.\nElla tiene buenas tetas, esa.\n\n361\n01:09:11.500 --> 01:09:13.491\nEso también pasará, sanyi.\n\n362\n01:09:14.667 --> 01:09:18.455\nDesde que te fuiste de aquí,\nNo ha cambiado mucho.\n\n363\n01:09:19.042 --> 01:09:22.239\nel maestro de escuela\nTodavía en casa, solo.\n\n364\n01:09:22.375 --> 01:09:25.867\nLa señora schmidt está con futaki.\nYa sabes, el lisiado.\n\n365\n01:09:26.000 --> 01:09:30.073\nMi hermana menor está totalmente loca.\nEspía a todo el mundo.\n\n366\n01:09:32.167 --> 01:09:36.661\nMi mamá intenta sacarla a golpes,\npero todo el mundo sabe que está loca de por vida.\n\n367\n01:09:37.292 --> 01:09:39.908\nEl médico reflexiona en casa.\n\n368\n01:09:40.792 --> 01:09:44.364\nÉl se sienta en su sillón,\nDeja las luces encendidas todo el tiempo.\n\n369\n01:09:50.792 --> 01:09:53.033\nA veces duerme en su silla.\n\n370\n01:09:55.125 --> 01:09:59.164\nSu casa huele a infierno,\naunque fuma buenos cigarrillos.\n\n371\n01:10:02.208 --> 01:10:06.907\nBebe mucha fruta Brandy.\nLa señora kraner lo mantiene abastecido.\n\n372\n01:10:09.250 --> 01:10:12.913\nSchmidt y Kraner traen\nel dinero para el ganado hoy.\n\n373\n01:10:15.375 --> 01:10:18.538\nTodo el mundo ha estado haciendo eso\ndesde febrero, excepto mamá.\n\n374\n01:10:18.667 --> 01:10:23.286\nEsos bastardos no la incluían.\nestán felices de tener mucho dinero.\n\n375\n01:10:23.958 --> 01:10:26.495\nel dueño del bar\nvendió su buena panonia\n\n376\n01:10:26.625 --> 01:10:30.664\ny compré una porquería\ntienes que esforzarte para empezar.\n\n377\n01:10:30.792 --> 01:10:34.330\nÉl usa eso para ir a la ciudad.\nver a su esposa una vez al mes,\n\n378\n01:10:34.458 --> 01:10:39.248\naunque ahora vive en casa de mi hermana\nporque todavía le debemos\n\n379\n01:10:40.875 --> 01:10:43.412\npor lo que nos prestó\ncomprar semillas el año pasado.\n\n380\n01:14:58.833 --> 01:15:03.122\nEn el este, el cielo se aclara\ntan rápido como se olvida un recuerdo.\n\n381\n01:15:04.292 --> 01:15:08.991\nAl amanecer, se pone todo rojo.\nen el horizonte ondulante.\n\n382\n01:15:09.125 --> 01:15:16.657\nDe la misma manera el mendigo truages\npor las escaleras traseras de una iglesia,\n\n383\n01:15:16.792 --> 01:15:21.240\nel sol sale para dar vida\npara las sombras,\n\n384\n01:15:21.375 --> 01:15:27.450\ny separar la tierra y el cielo,\nhombre y animal,\n\n385\n01:15:27.583 --> 01:15:30.495\nde lo inquietante,\nextraña unidad\n\n386\n01:15:30.625 --> 01:15:33.992\nen el que se convirtieron\ninextricablemente entrelazados.\n\n387\n01:15:34.125 --> 01:15:38.198\nVio la noche que huía\ndel otro lado,\n\n388\n01:15:38.333 --> 01:15:42.326\nmientras sus elementos terroríficos desaparecen\nen el horizonte occidental,\n\n389\n01:15:42.458 --> 01:15:47.327\ncomo un desesperado,\nejército derrotado y confundido.\n\n390\n01:15:49.458 --> 01:15:57.458\nsaber algo\n\n391\n01:22:26.792 --> 01:22:33.038\nFutaki... Parece...\n\n392\n01:22:34.333 --> 01:22:40.078\nTengo miedo... de algo.\n\n393\n01:22:42.250 --> 01:22:50.250\nTemprano... mañana... sobresaltado...\n\n394\n01:22:50.583 --> 01:22:55.907\nÉl estaba mirando...\nFuera de la ventana.\n\n395\n01:22:59.167 --> 01:23:01.453\nFutaki\n\n396\n01:23:02.208 --> 01:23:10.208\nesta aterrorizado...\nTiene miedo a la muerte.\n\n397\n01:23:36.000 --> 01:23:43.122\nMorirán de todos modos.\nTú también, futaki, tú también morirás.\n\n398\n01:30:23.708 --> 01:30:31.708\nSchmidt... se marcha...\nLa puerta trasera.\n\n399\n01:30:35.458 --> 01:30:39.030\nY se para... encima de...\n\n400\n01:30:39.625 --> 01:30:47.625\nEl camino hacia... el parque sódico.\n\n401\n01:30:49.417 --> 01:30:57.417\nFutaki... en silencio...\nSe escapa de... la casa...\n\n402\n01:31:02.417 --> 01:31:08.242\nCruza... hacia los establos\n\n403\n01:31:09.167 --> 01:31:16.869\ny se esconde... junto a la pared.\n\n404\n01:31:25.000 --> 01:31:30.415\nÉl espera... por un momento.\n\n405\n01:31:31.250 --> 01:31:39.250\nEntonces... él también... corre...\nHacia la puerta.\n\n406\n01:31:43.250 --> 01:31:51.250\nLlama, y... entra rápidamente...\nDespués de Schmidt.\n\n407\n01:31:56.000 --> 01:32:03.122\nQué... ajetreo y bullicio.\n\n408\n01:32:07.292 --> 01:32:13.162\nHa comenzado. . A llover.\n\n409\n01:32:13.833 --> 01:32:20.659\nNo... parará...\nHasta... la primavera.\n\n410\n01:34:02.167 --> 01:34:05.534\nEs fascinante ver,\n\n411\n01:34:05.667 --> 01:34:12.618\nla erosión causada\npor agua y viento\n\n412\n01:34:12.750 --> 01:34:15.082\nen el borde del pontico,\n\n413\n01:34:15.208 --> 01:34:21.454\ncuando el mar en la gran llanura\nhabía retrocedido significativamente\n\n414\n01:34:21.583 --> 01:34:27.328\ny parecía un lago poco profundo,\ncomo lo hace ahora el lago balaton.\n\n415\n01:35:53.000 --> 01:35:54.831\nBuenos días doctor.\n\n416\n01:36:00.208 --> 01:36:02.494\nRápido, doctor,\nno dejes que se enfríe.\n\n417\n01:36:03.083 --> 01:36:04.914\nLlévatelo.\n\n418\n01:36:30.417 --> 01:36:34.740\nVerás, está lloviendo\npronto tendremos nieve también.\n\n419\n01:36:34.875 --> 01:36:39.869\nMi marido y yo sentimos que sería bueno.\nSi pudieras hablar con el dueño del pub.\n\n420\n01:36:40.000 --> 01:36:43.322\nEl tiene un auto\nÉl podría traerte estas cosas.\n\n421\n01:36:43.792 --> 01:36:47.865\n¿Quieres decir que ya no lo harás?\n\n422\n01:36:49.125 --> 01:36:54.119\nLo haré, pero no puedo ir a pie a la ciudad.\nen esta lluvia.\n\n423\n01:36:54.250 --> 01:36:58.789\nAdemás, él tiene un auto y podría hacer tu\ncomprando durante dos o tres semanas.\n\n424\n01:36:58.917 --> 01:37:01.875\nEl autobús sólo empieza a funcionar de nuevo.\nen primavera.\n\n425\n01:37:02.000 --> 01:37:04.992\nEstá bien, señora kraner, puede irse.\n\n426\n01:37:06.833 --> 01:37:08.789\n¿Entonces hablarás con el dueño del pub?\n\n427\n01:37:08.917 --> 01:37:11.454\n¡Hablaré con quien quiera!\n\n428\n01:37:14.125 --> 01:37:18.448\n- ¿Dónde dejo las llaves?\n- Donde quieras.\n\n429\n01:37:22.792 --> 01:37:24.828\nAdiós.\n\n430\n01:40:50.625 --> 01:40:54.243\nK. ha renunciado.\n\n431\n01:40:58.833 --> 01:41:00.869\nElla no puede...\n\n432\n01:41:03.833 --> 01:41:06.245\nHazlo... por más tiempo.\n\n433\n01:41:08.958 --> 01:41:14.032\nLe pregunté a Autumn... ella no...\n\n434\n01:41:14.583 --> 01:41:20.328\nMente\n\n435\n01:41:20.875 --> 01:41:23.082\nla lluvia...\n\n436\n01:41:25.417 --> 01:41:29.410\nNi eso...\n\n437\n01:41:30.750 --> 01:41:35.870\nTenía que... caminar.\n\n438\n01:41:40.750 --> 01:41:42.581\nk tiene\n\n439\n01:41:49.125 --> 01:41:54.825\nUn plan específico.\n\n440\n01:42:01.000 --> 01:42:05.164\nElla está pensando... en algo...\nEn su cabeza.\n\n441\n01:46:00.583 --> 01:46:03.575\nParece que me emborraché bastante.\n\n442\n01:51:19.667 --> 01:51:27.667\nHoy se me acabó... la última gota...\nDe fruta Brandy.\n\n443\n01:51:32.375 --> 01:51:38.530\nParece que necesito...\n\n444\n01:51:39.208 --> 01:51:45.704\nPara irse. La casa.\n\n445\n01:57:27.458 --> 01:57:30.325\nVamos, deja eso.\n\n446\n01:57:31.667 --> 01:57:34.784\n¿Me oyes? Deja eso.\n\n447\n01:57:36.125 --> 01:57:38.537\nEn lugar de eso, cuida el fuego,\nTengo frio.\n\n448\n01:57:38.667 --> 01:57:40.328\nYo cuidaré de mi trasero, hombre.\n\n449\n01:57:40.458 --> 01:57:44.155\nAcabo de cuidarlo...\nEres el siguiente.\n\n450\n01:57:44.292 --> 01:57:48.160\n- ¿Me oyes?\n- Está bien, está bien.\n\n451\n01:57:50.417 --> 01:57:55.286\nNos volveremos a congelar.\n\n452\n01:58:00.292 --> 01:58:03.864\n- ¿Cuánto tiempo se supone que debemos esperar?\n- ¿Cómo lo sé?\n\n453\n01:58:04.000 --> 01:58:05.911\nMe dejo en paz.\n\n454\n01:58:06.667 --> 01:58:09.283\nAl diablo con todo el asunto.\n\n455\n02:00:27.000 --> 02:00:29.366\nDeja de quejarte. Alguien viene.\n\n456\n02:00:33.083 --> 02:00:34.994\nBuenas noches.\n\n457\n02:00:38.292 --> 02:00:41.284\nHace mucho que no lo veo, doctor.\n\n458\n02:00:42.667 --> 02:00:44.783\n¿Te sientes como un tornillo?\n\n459\n02:00:44.917 --> 02:00:47.124\nme gustaria calentarme un poco\nsi no te importa.\n\n460\n02:00:47.250 --> 02:00:51.493\n- ¿Sólo calentar, doctor?\n- Sí.\n\n461\n02:00:55.625 --> 02:00:58.162\n¿Y qué tal un buen polvo?\ncomo en los viejos tiempos?\n\n462\n02:00:59.167 --> 02:01:03.080\nVamos, doctor.\nNo cuesta mucho.\n\n463\n02:01:05.125 --> 02:01:07.958\nPara un viejo amigo.\n\n464\n02:01:15.000 --> 02:01:17.992\n¿Puedo fumar un cigarrillo?\n\n465\n02:01:20.375 --> 02:01:24.038\n- Allí mismo, a tus pies.\n- Gracias.\n\n466\n02:01:49.292 --> 02:01:53.535\n- ¿Cómo va el negocio?\n- Malo.\n\n467\n02:01:53.667 --> 02:02:00.789\nVerás, nos sentamos aquí día tras día.\ny nada.\n\n468\n02:02:01.292 --> 02:02:05.865\nTodos somos nervios\nCasi nos atacamos el uno al otro.\n\n469\n02:02:06.000 --> 02:02:08.457\n¿Qué va a ser de nosotros, doctor?\n\n470\n02:02:08.583 --> 02:02:11.780\nEs la forma en que una persona se desanima\nen todo el asunto.\n\n471\n02:02:16.667 --> 02:02:19.374\n¿De qué crees que vivimos?\n\n472\n02:02:21.667 --> 02:02:27.617\nTenemos a sanyi viviendo con nosotros,\nEstike loco, mamá también.\n\n473\n02:02:29.833 --> 02:02:32.449\nellos siguen preguntando\n¿dónde está el dinero?\n\n474\n02:02:34.000 --> 02:02:35.740\nDáselo.\n\n475\n02:02:36.292 --> 02:02:38.999\nEl dinero esto, el dinero aquello,\n\n476\n02:02:40.000 --> 02:02:42.286\npero ¿a quién le importa?\n\n477\n02:02:43.583 --> 02:02:47.656\nNos iremos de aquí de todos modos.\nNos mudaremos a la ciudad.\n\n478\n02:02:47.792 --> 02:02:51.284\nDéjate de tonterías. O vete o quédate.\n\n479\n02:02:51.417 --> 02:02:54.375\nTe haría feliz\nSi me fuera, ¿no?\n\n480\n02:02:56.250 --> 02:02:59.663\nHoy, cuando finalmente consiguen\nel dinero?\n\n481\n02:03:00.375 --> 02:03:03.822\nNo vienen.\nDeberían haber llegado hace años.\n\n482\n02:03:03.958 --> 02:03:07.155\nEllos vendrán. Los conozco.\n\n483\n02:03:07.292 --> 02:03:10.864\nCuando tienen dinero,\ncorren tras sus pollas.\n\n484\n02:03:11.500 --> 02:03:15.322\n¿Crees que Kraner admite?\nal importe total en casa?\n\n485\n02:03:16.208 --> 02:03:18.870\nHabrá un infierno\n¡Hay mucho dinero aquí hoy!\n\n486\n02:03:19.000 --> 02:03:22.322\n- ¿Puedo fumar un cigarrillo para el camino?\n- Seguro.\n\n487\n02:03:27.458 --> 02:03:30.245\n- ¿Partidos?\n- Tómalos.\n\n488\n02:03:36.125 --> 02:03:39.288\nEntonces, no lo harás\n¿Cambió de opinión, doctor?\n\n489\n02:03:39.958 --> 02:03:43.826\nNo, buena suerte.\n\n490\n02:03:44.958 --> 02:03:46.789\nTú también.\n\n491\n02:04:09.000 --> 02:04:11.616\nel no tiene\nqueda mucho tiempo.\n\n492\n02:04:15.417 --> 02:04:18.409\nDifícilmente lo reconocerías.\n\n493\n02:04:22.875 --> 02:04:25.241\n¿Qué diablos está haciendo aquí?\nbajo la lluvia?\n\n494\n02:04:25.375 --> 02:04:29.618\nCasi no sale de casa.\n¿Ahora sale con este clima?\n\n495\n02:04:33.667 --> 02:04:36.158\nEstúpido. ¿No viste la botella?\n\n496\n02:04:36.292 --> 02:04:38.499\nVa a recoger su Brandy.\n\n497\n02:04:42.083 --> 02:04:45.871\nNi siquiera tiene\nel dinero para pagarle a la señora kraner.\n\n498\n02:09:32.292 --> 02:09:34.123\n- Doctor.\n- ¿Qué deseas?\n\n499\n02:09:34.250 --> 02:09:38.573\n- Doctor.\n- ¿Qué estás haciendo? Déjame ir.\n\n500\n02:09:38.708 --> 02:09:42.326\n- Déjame, vete ahora, mocoso.\n- ¡Doctor!\n\n501\n02:09:42.458 --> 02:09:44.790\nDéjame en paz, mocoso.\n\n502\n02:09:48.000 --> 02:09:49.661\nMaldito infierno.\n\n503\n02:09:55.000 --> 02:09:58.993\n¿Adónde vas ahora? Esperar.\n\n504\n02:10:02.417 --> 02:10:04.248\n¿Adónde vas?\n\n505\n02:10:07.250 --> 02:10:09.081\n¡Detener!\n\n506\n02:10:10.792 --> 02:10:12.623\nNo te haré daño.\n\n507\n02:10:13.458 --> 02:10:15.119\n¡Detener!\n\n508\n02:10:18.542 --> 02:10:20.954\n¿Adónde estás corriendo?\n\n509\n02:10:21.083 --> 02:10:22.914\nEsperar.\n\n510\n02:12:07.083 --> 02:12:11.747\nHola, hola...\n\n511\n02:12:11.875 --> 02:12:13.706\nAhora ahí\n\n512\n02:15:33.500 --> 02:15:35.206\nHora de bajar.\n\n513\n02:16:35.083 --> 02:16:39.076\n\"Mi corazón\" pensó,\nuna y otra vez\n\n514\n02:16:40.625 --> 02:16:45.039\nanhelaba descansar en una habitación cálida,\n\n515\n02:16:45.167 --> 02:16:49.240\npara ser atendido\npor dulces y pequeñas enfermeras,\n\n516\n02:16:49.375 --> 02:16:51.616\nsorbiendo su sopa caliente,\n\n517\n02:16:51.750 --> 02:16:54.492\nluego girando hacia la pared.\n\n518\n02:16:55.667 --> 02:16:57.749\nSe sintió ligero y tranquilo.\n\n519\n02:16:57.875 --> 02:17:03.040\naunque las palabras de regaño del conductor\nresonó largamente en sus oídos.\n\n520\n02:17:04.167 --> 02:17:07.000\n\"No debería haberlo hecho doctor.\n\n521\n02:17:07.125 --> 02:17:09.457\n\"No deberías haberlo hecho\"\n\n522\n02:17:17.917 --> 02:17:24.573\nIntermedio\n\n523\n02:17:25.750 --> 02:17:33.750\nel trabajo de la araña yo\n\n524\n02:18:35.417 --> 02:18:37.373\nPodrías encender un fuego.\n\n525\n02:18:42.292 --> 02:18:43.953\nPodría.\n\n526\n02:18:55.375 --> 02:18:57.957\nDije que podrías encender un fuego.\n\n527\n02:19:09.917 --> 02:19:12.533\nDetén esto.\n\n528\n02:19:28.083 --> 02:19:30.165\nUn litro.\n\n529\n02:20:01.458 --> 02:20:04.450\nRecoge los cien para mí también.\n\n530\n02:20:08.292 --> 02:20:10.999\nSólo te equivocaste en la denominación.\n\n531\n02:20:16.375 --> 02:20:18.832\nNo te preocupes, cabeza de alfiler.\n\n532\n02:20:20.375 --> 02:20:25.199\nNo te haré ningún daño.\nSimplemente deja de señalar.\n\n533\n02:22:05.500 --> 02:22:07.365\nEstá lloviendo.\n\n534\n02:22:15.417 --> 02:22:17.078\nMal tiempo.\n\n535\n02:22:23.042 --> 02:22:24.327\nSí.\n\n536\n02:22:27.000 --> 02:22:28.706\nDestruye todo.\n\n537\n02:22:32.833 --> 02:22:35.745\nMira este abrigo,\ncómo me queda.\n\n538\n02:22:40.667 --> 02:22:43.454\nEsto solía ser tan suave como la mantequilla.\n\n539\n02:22:50.042 --> 02:22:52.408\nY ahora está tan seco,\n\n540\n02:22:54.458 --> 02:22:57.416\nsi quiero sentarme,\ntengo que romperlo.\n\n541\n02:22:58.417 --> 02:22:59.827\nYo también.\n\n542\n02:23:00.667 --> 02:23:04.615\nAquí, en mi ingle,\ncon el borde de mi mano.\n\n543\n02:23:05.833 --> 02:23:07.824\nAsí es como lo hago.\n\n544\n02:23:13.792 --> 02:23:17.865\nFlexibilidad, ya sabes,\neso es lo que falta.\n\n545\n02:23:18.000 --> 02:23:19.661\nTotalmente desaparecido.\n\n546\n02:23:21.917 --> 02:23:25.080\nEntonces el viento,\nTampoco puede impedirlo.\n\n547\n02:23:26.417 --> 02:23:31.992\nTodo está arrugado.\nEl cuero se está desmoronando, ¿ves?\n\n548\n02:23:35.458 --> 02:23:40.157\nVas de aquí y de allá.\nNo puedo quedarme adentro todo el tiempo.\n\n549\n02:23:41.000 --> 02:23:44.868\nY se empapa\ndentro y fuera\n\n550\n02:23:47.833 --> 02:23:50.905\nporque lo peor no está ahí afuera,\n\n551\n02:23:51.042 --> 02:23:53.533\npero aquí.\n\n552\n02:23:57.125 --> 02:24:00.083\nno has escuchado\nde las lluvias interiores, por supuesto que no.\n\n553\n02:24:02.042 --> 02:24:03.953\nHas estado diciendo esto durante años.\n\n554\n02:24:08.875 --> 02:24:12.914\nBañan tus órganos\nnoche y día.\n\n555\n02:24:14.417 --> 02:24:17.739\nVienen del corazón,\n\n556\n02:24:17.875 --> 02:24:23.791\ny lavar el hígado, el estómago,\nel bazo y los riñones.\n\n557\n02:24:30.292 --> 02:24:32.408\nEstoy empapado.\n\n558\n02:24:35.000 --> 02:24:37.787\nSi no fuera por este abrigo,\nNo sé qué pasaría.\n\n559\n02:24:41.042 --> 02:24:42.828\nNi siquiera me atrevo a desabrocharlo.\n\n560\n02:24:45.958 --> 02:24:48.324\nUna copa de vino, por supuesto, ayudaría.\n\n561\n02:25:00.667 --> 02:25:04.535\nLuego está la demanda constante\ndel hígado,\n\n562\n02:25:04.667 --> 02:25:09.161\nel estómago,\nel bazo y los riñones.\n\n563\n02:25:12.417 --> 02:25:15.079\nTienen que trabajar todo el tiempo.\n\n564\n02:25:17.125 --> 02:25:18.831\nSin descanso.\n\n565\n02:25:20.333 --> 02:25:24.246\nEntonces este constante empapado\npuede convertirse en\n\n566\n02:25:24.375 --> 02:25:26.366\nuna desecación repentina.\n\n567\n02:25:28.417 --> 02:25:33.036\nQue pronto puede... volverse fatal\n\n568\n02:25:42.292 --> 02:25:44.157\nEscucha, dame un vaso.\n\n569\n02:25:46.542 --> 02:25:50.285\nSchmidt y Kraner\nEstaré aquí pronto de todos modos,\n\n570\n02:25:50.417 --> 02:25:53.409\nellos contarán\nlo que se supone que debo conseguir.\n\n571\n02:25:58.417 --> 02:25:59.907\nBien.\n\n572\n02:26:22.500 --> 02:26:24.832\nBuen vino.\n\n573\n02:26:24.958 --> 02:26:26.949\nDame uno más.\n\n574\n02:27:04.333 --> 02:27:06.073\nSe ha quedado dormido.\n\n575\n02:27:14.750 --> 02:27:17.287\ncuanto piensas\n¿Se supone que este debe comer?\n\n576\n02:27:19.333 --> 02:27:21.415\nNo come, devora.\n\n577\n02:27:27.083 --> 02:27:30.200\nPuede comerse medio cerdo de una vez.\n¿Creerías eso?\n\n578\n02:27:34.958 --> 02:27:36.448\nYo lo haría.\n\n579\n02:27:45.500 --> 02:27:47.240\nEso estuvo muy cerca.\n\n580\n02:28:09.042 --> 02:28:12.284\nirimias y petrina\nvienen hacia el patio.\n\n581\n02:28:20.167 --> 02:28:23.159\n- No pueden serlo.\n- Es tan cierto como que estoy aquí.\n\n582\n02:28:23.833 --> 02:28:28.156\nEl transportista del almacén de madera\nestaba allí,\n\n583\n02:28:28.292 --> 02:28:30.874\ndos cargadores.\n\n584\n02:28:32.083 --> 02:28:38.909\nEl maestro de escuela,\nel profesor de educación física..\n\n585\n02:28:40.167 --> 02:28:41.998\nY el barman nocturno\nde la cafetería de la estación.\n\n586\n02:28:42.125 --> 02:28:44.286\nY me senté allí.\n\n587\n02:28:45.625 --> 02:28:47.707\n¡Sólo siéntate ahí!\n\n588\n02:28:47.833 --> 02:28:50.666\nNo podía creer lo que veía.\n\n589\n02:28:56.333 --> 02:29:00.076\nY... ¡allí estaban!\n\n590\n02:29:00.208 --> 02:29:03.575\nIrimías y petrina,\nbebiendo ron y licores!\n\n591\n02:29:05.875 --> 02:29:09.038\nEsperé hasta que bebieron,\n\n592\n02:29:09.167 --> 02:29:11.283\ny se acercó a ellos.\n\n593\n02:29:11.417 --> 02:29:14.580\nIrimias me dio un abrazo y me preguntó:\n\n594\n02:29:14.708 --> 02:29:17.780\n\"¡kelemen! ¿Cómo te va?\"\n\n595\n02:29:19.167 --> 02:29:22.409\nLuego me contó todo.\n\n596\n02:29:23.833 --> 02:29:26.905\nLuego nos fuimos.\n\n597\n02:29:27.042 --> 02:29:31.035\nTenía que ver a hochan el carnicero.\n\n598\n02:29:32.792 --> 02:29:38.867\nEntonces... conocí al joven téth,\n\n599\n02:29:39.000 --> 02:29:43.824\nquien solía ser mi vecino\nen pestanya.\n\n600\n02:29:45.292 --> 02:29:50.116\nMe dijo que irimias\n\n601\n02:29:50.250 --> 02:29:55.324\nHabía estado en casa de Steigerwald.\n\n602\n02:29:55.458 --> 02:29:58.450\ny habló de pólvora.\n\n603\n02:29:59.417 --> 02:30:03.490\nLos niños de Steigerwald\nhablaban de ello en la calle.\n\n604\n02:30:05.417 --> 02:30:09.581\nY cuando estaba de regreso...\n\n605\n02:30:10.792 --> 02:30:13.283\nY apagó _.\n\n606\n02:30:16.542 --> 02:30:19.955\nEn el cruce de Elek...\n\n607\n02:30:21.458 --> 02:30:24.450\nLos vi.\n\n608\n02:30:25.833 --> 02:30:29.155\nY entonces entendí,\n\n609\n02:30:29.292 --> 02:30:32.955\nqué, cómo y por qué.\n\n610\n02:32:55.708 --> 02:32:58.120\n¡Irimías! Petrina! yo\n\n611\n02:32:58.250 --> 02:33:00.491\n¡Me desharé de ellos, cerdos borrachos!\n\n612\n02:33:03.167 --> 02:33:06.705\napagaré las luces\ny tapiar el lugar.\n\n613\n02:33:07.417 --> 02:33:10.614\nIrimias y petrinales\nNo pueden tomar lo que es mío.\n\n614\n02:33:10.750 --> 02:33:13.822\n¡Mío! ¡Todo aquí es mío!\n¡Mío!\n\n615\n02:33:14.333 --> 02:33:19.748\n¡Irimías! Petrinal\n¡todo es mío! ¡Mío!\n\n616\n02:33:20.208 --> 02:33:21.493\nPetrinal\n\n617\n02:36:09.208 --> 02:36:11.415\nLuego me acerqué a ellos.\n\n618\n02:36:11.542 --> 02:36:16.411\nIrimías me abrazó\ny dijo calurosamente,\n\n619\n02:36:16.542 --> 02:36:20.205\n\"¡kelemen! ¿Cómo te va?\"\n\n620\n02:36:20.333 --> 02:36:23.825\nY enseguida compró una ronda.\n\n621\n02:36:23.958 --> 02:36:30.079\nLas camareras sonrieron\ny saltaron hacia él como saltamontes.\n\n622\n02:36:30.208 --> 02:36:33.371\nY luego me contó todo.\n\n623\n02:36:36.208 --> 02:36:39.826\nEntonces dime,\n¿Has aprendido la lección?\n\n624\n02:36:39.958 --> 02:36:41.494\n¿Qué lección?\n\n625\n02:36:41.625 --> 02:36:45.664\nDéjame en paz.\nHe aprendido todo lo que necesito.\n\n626\n02:36:45.792 --> 02:36:47.912\nNunca has aprendido nada.\nSigue bebiendo.\n\n627\n02:36:48.042 --> 02:36:50.158\nlo he aprendido todo,\ntu vieja bruja.\n\n628\n02:36:50.292 --> 02:36:53.659\nNo quiero que nadie se entrometa\nen mi negocio.\n\n629\n02:36:53.792 --> 02:36:56.124\nSin embargo, en el libro de tu destino,\n\n630\n02:36:56.250 --> 02:36:57.990\nesta resurrección está escrita.\n\n631\n02:36:58.125 --> 02:37:01.117\n- No me vengas con esas tonterías.\n- Pero sigues bebiendo.\n\n632\n02:37:01.250 --> 02:37:03.992\nBebiendo, seguro que estoy bebiendo.\n\n633\n02:37:04.125 --> 02:37:07.413\nEscucha, bruja,\n¿Por qué crees que estoy aquí?\n\n634\n02:37:07.542 --> 02:37:13.367\nVine a beber, no a verme bonita.\npara gente como tú.\n\n635\n02:37:13.500 --> 02:37:15.331\nsabes lo que esta esperando\n¿para gente como tú?\n\n636\n02:37:15.458 --> 02:37:17.949\nResulta que nadie me está esperando.\n\n637\n02:37:18.083 --> 02:37:19.243\nEl fuego más negro del infierno.\n\n638\n02:37:19.375 --> 02:37:22.162\nEs posible que hayas visto un puto culo negro.\npero no un fuego negro,\n\n639\n02:37:22.292 --> 02:37:27.332\nAsí que a la mierda el culo negro y el fuego.\ny vete al puto infierno. Eso es todo.\n\n640\n02:37:27.458 --> 02:37:29.699\n¿Crees que tolerarán esto?\n¿Para siempre ahí arriba?\n\n641\n02:37:29.833 --> 02:37:31.164\nNo.\n\n642\n02:37:31.292 --> 02:37:33.157\nCreo que se sientan ahí arriba\ny simplemente ignorar\n\n643\n02:37:33.292 --> 02:37:35.783\n¿Esta Sodoma y Gomorra?\n\n644\n02:37:35.917 --> 02:37:37.748\nEso es exactamente.\n\n645\n02:37:37.875 --> 02:37:42.539\nHabrá llanto y luto,\ncomo dice el profeta.\n\n646\n02:37:42.667 --> 02:37:49.368\nNinguna creación. ¡Spritzer!\nLa creación es un spritzer.\n\n647\n02:37:49.500 --> 02:37:52.458\n- No es asunto tuyo.\n- Siempre es así, lo siento.\n\n648\n02:37:52.583 --> 02:37:57.623\nToda una bruja.\nViejo coño lleno de telarañas.\n\n649\n02:37:57.750 --> 02:37:59.786\nSerá mejor que leas esto.\n\n650\n02:37:59.917 --> 02:38:02.579\nDeja en paz a la pobre.\n\n651\n02:38:02.708 --> 02:38:05.620\nEn su lugar, consíguele un spritzer.\n\n652\n02:38:05.750 --> 02:38:10.198\nretirada de spritzer\nEs una especie de asesinato.\n\n653\n02:38:10.333 --> 02:38:13.450\nNo leas Génesis, pobrecito.\n\n654\n02:38:13.583 --> 02:38:16.074\nEso es un misterio.\n\n655\n02:38:16.208 --> 02:38:18.699\nLeer revelación.\n\n656\n02:38:18.833 --> 02:38:22.200\n¿Sabes qué?\n¿Todos estamos esperando?\n\n657\n02:38:22.333 --> 02:38:27.999\nSi no lo has escuchado antes,\npara que te vayas al infierno.\n\n658\n02:38:29.958 --> 02:38:34.702\nPero no sirve de nada esperar\nno importa si te vas.\n\n659\n02:38:34.833 --> 02:38:39.247\nNo importa si no podemos verte\no escucharte.\n\n660\n02:38:39.375 --> 02:38:42.492\nDejarás atrás tu hedor.\n\n661\n02:38:42.625 --> 02:38:45.207\nDura para siempre.\n\n662\n02:38:46.208 --> 02:38:50.156\nNo sirve de nada abrir una ventana\ny ventilar la habitación.\n\n663\n02:38:50.292 --> 02:38:51.953\nQueda.\n\n664\n02:38:59.958 --> 02:39:01.789\nSeñora schmidt.\n\n665\n02:39:03.292 --> 02:39:07.535\nHalics no puede imaginar\n¿Qué le pasó a tu marido?\n\n666\n02:39:09.500 --> 02:39:11.912\nVerás, este mal tiempo.\n\n667\n02:39:23.667 --> 02:39:25.658\n¿Qué puedo conseguirte?\n\n668\n02:39:29.417 --> 02:39:33.035\n- ¿Un poco de cereza palinka?\n- Realmente no lo sé.\n\n669\n02:39:35.458 --> 02:39:36.948\nUno pequeño.\n\n670\n02:39:58.875 --> 02:40:02.868\n- ¿Lo has oído?\n- ¿Estás seguro de que deben ser ellos?\n\n671\n02:40:03.917 --> 02:40:05.407\nDebe ser.\n\n672\n02:40:07.208 --> 02:40:09.699\nEstarán aquí por la mañana.\n\n673\n02:40:22.458 --> 02:40:27.157\nEstarán aquí a medianoche.\nTarda tres horas en llegar hasta aquí.\n\n674\n02:40:27.292 --> 02:40:30.159\n- No son tres horas.\n- ¿Por qué no son tres horas?\n\n675\n02:40:30.292 --> 02:40:32.704\nPorque lleva mucho más tiempo.\n\n676\n02:40:32.833 --> 02:40:36.246\nNo habrá llegadas.\nantes de la mañana.\n\n677\n02:40:36.375 --> 02:40:37.706\n¿Por qué la mañana?\n\n678\n02:40:37.833 --> 02:40:42.076\nSi las tres horas\nme tomó tres horas,\n\n679\n02:40:42.208 --> 02:40:46.372\nlas tres horas\nles llevará cuatro horas.\n\n680\n02:40:46.500 --> 02:40:49.082\nEstarán aquí a medianoche.\n\n681\n02:40:49.208 --> 02:40:53.497\nPor la mañana, ese camino\nestá lleno de baches y surcos.\n\n682\n02:40:53.625 --> 02:40:56.947\nRodearán los baches.\nEvitarán los surcos.\n\n683\n02:40:57.083 --> 02:41:02.077\nNo pasarán por los baches\no los surcos, tienes razón,\n\n684\n02:41:02.208 --> 02:41:07.077\nasí que no estarán aquí\na medianoche, sino a la mañana.\n\n685\n02:41:07.208 --> 02:41:10.530\nPor la mañana si usan la carretera.\nYo vengo de aquí.\n\n686\n02:41:10.667 --> 02:41:14.159\nSólo pueden venir por ese camino,\nsolo caminarán sobre eso,\n\n687\n02:41:14.292 --> 02:41:16.954\n- les importan sus zapatos.\n- ¿Sus zapatos?\n\n688\n02:41:17.083 --> 02:41:18.851\nSí, sus zapatos.\nEse camino es un largo rodeo.\n\n689\n02:41:18.875 --> 02:41:20.285\nEstá empapado.\n\n690\n02:41:20.417 --> 02:41:22.248\nes como tener\npara dar la vuelta al mar.\n\n691\n02:41:22.375 --> 02:41:24.741\n¡Sus zapatos! No les importa.\n\n692\n02:41:24.875 --> 02:41:26.866\nEstarán aquí a medianoche.\n\n693\n02:41:27.000 --> 02:41:29.662\nNo estaban empapados.\nEl camino pasa junto al fuego.\n\n694\n02:41:29.792 --> 02:41:32.784\n¿Eres de aquí?\n¿Has estado allí?\n\n695\n02:41:32.917 --> 02:41:36.660\nLos vi, seguí adelante,\ny vine aquí.\n\n696\n02:41:36.792 --> 02:41:39.204\nyo los vi,\ny estarán aquí a medianoche.\n\n697\n02:41:39.333 --> 02:41:42.245\nVienen por el camino\ny no estará aquí antes de mañana.\n\n698\n02:41:42.375 --> 02:41:46.789\n- No me vengas con eso.\n- Sólo pueden venir por la carretera.\n\n699\n02:41:46.917 --> 02:41:51.536\ny eso da un giro\ncomo dar la vuelta al mar.\n\n700\n02:41:51.667 --> 02:41:55.660\nNo me des eso\nSoy de aquí.\n\n701\n02:41:59.333 --> 02:42:01.995\n¿Qué pasa?\n¿Con esta maldita estufa?\n\n702\n02:42:02.125 --> 02:42:05.197\nEsto es una taberna,\nno una sala de espera.\n\n703\n02:42:06.500 --> 02:42:10.448\n- ¿Qué hora es?\n- 11.\n\n704\n02:42:10.583 --> 02:42:15.247\nA más tardar... 11 o 12.\n\n705\n02:42:17.917 --> 02:42:20.408\n¿Quién se ha llevado mi vino?\n\n706\n02:42:20.542 --> 02:42:22.373\nLo derramaste.\n\n707\n02:42:23.417 --> 02:42:27.080\n- Eres un mentiroso, tonto.\n- Lo derramaste.\n\n708\n02:42:28.583 --> 02:42:31.245\nEntonces tráeme otro.\n\n709\n02:42:39.250 --> 02:42:41.491\n¿Qué es ese olor?\n\n710\n02:42:41.625 --> 02:42:43.957\nNo había ninguno hace un minuto.\n\n711\n02:42:46.083 --> 02:42:49.155\nsolo las arañas\n\n712\n02:42:49.292 --> 02:42:52.705\no el carbón.\n\n713\n02:42:52.833 --> 02:42:54.323\nNo.\n\n714\n02:43:23.167 --> 02:43:25.408\nEs la tierra.\n\n715\n02:43:46.917 --> 02:43:54.917\nDesentrañar\n\n716\n02:44:43.917 --> 02:44:45.498\nVamos.\n\n717\n02:47:50.167 --> 02:47:52.158\nDame el dinero.\n\n718\n02:48:28.042 --> 02:48:30.078\nMira, con el nudo hacia arriba...\n\n719\n02:48:38.167 --> 02:48:40.499\n¿Estás seguro de que comienza el robo de dinero?\n¿Brotará en cuatro días?\n\n720\n02:48:40.625 --> 02:48:45.198\nSeguro. Pero sólo si lo das\nsuficiente agua todos los días.\n\n721\n02:48:48.417 --> 02:48:51.409\n- ¿Vamos a ser ricos?\n- Seguro.\n\n722\n02:48:56.417 --> 02:49:00.080\n- ¿Los demás nos envidiarán?\n- Por supuesto.\n\n723\n02:49:05.833 --> 02:49:08.495\nPuedo quedarme en la mejor habitación\nesa noche?\n\n724\n02:49:08.625 --> 02:49:10.115\nSí.\n\n725\n02:49:11.750 --> 02:49:13.991\nToma, llévate eso a casa.\n\n726\n02:51:16.333 --> 02:51:19.166\nHola. Entra.\n\n727\n02:51:19.792 --> 02:51:21.373\n¿Qué pasa?\n\n728\n02:51:58.292 --> 02:52:02.331\n¿Dónde está tu lugar?\nQuédate ahí.\n\n729\n02:52:02.458 --> 02:52:04.699\nPórtate bien.\n\n730\n03:02:26.208 --> 03:02:29.041\nTe has ensuciado los pantalones.\n\n731\n03:02:46.042 --> 03:02:48.283\nTienes mucho valor.\n\n732\n03:03:30.000 --> 03:03:32.992\nPuedo hacer lo que quiera contigo.\n\n733\n03:03:54.417 --> 03:03:56.658\nSoy más fuerte que tú.\n\n734\n03:04:35.750 --> 03:04:37.581\nVamos ahora.\n\n735\n03:04:44.292 --> 03:04:46.123\nVamos.\n\n736\n03:05:11.583 --> 03:05:14.746\n¡Estás muerto!\nNo sentiré pena por ti.\n\n737\n03:05:28.708 --> 03:05:32.280\nEntonces vamos. Vamos.\n\n738\n03:07:14.333 --> 03:07:16.915\nNos vemos pronto.\n\n739\n03:20:50.000 --> 03:20:51.831\n¡Sanyi!\n\n740\n03:20:55.750 --> 03:20:59.993\n¡Sanyi, ven aquí!\nHan robado el negocio del dinero.\n\n741\n03:21:00.125 --> 03:21:03.788\n- Ah, vamos.\n- También robaron el dinero.\n\n742\n03:21:03.917 --> 03:21:07.114\nNo fue robado, lo necesitaba.\nFue para mí de todos modos.\n\n743\n03:21:07.250 --> 03:21:11.289\n- También era mi dinero.\n- Ah, vete.\n\n744\n03:21:11.417 --> 03:21:15.239\n- ¿Por qué? ¿Sabías?\n- ¡Quítame las manos de encima!\n\n745\n03:21:15.375 --> 03:21:18.697\nVete ahora. ¡Dije que te fueras!\n\n746\n03:21:18.833 --> 03:21:20.994\nNo lo volveré a decir.\n\n747\n03:21:25.708 --> 03:21:29.451\nVuelve aquí.\n¡Dije, regresa!\n\n748\n03:21:32.708 --> 03:21:34.539\ndije, ven aquí\n\n749\n03:21:36.833 --> 03:21:39.324\n¡Vamos, muévete!\n\n750\n03:21:54.083 --> 03:21:57.496\nRaticida.\nLo robaste, ¿no?\n\n751\n03:21:57.625 --> 03:21:59.240\nLo robaste.\n\n752\n03:21:59.375 --> 03:22:02.663\nY tienes toda la casa\nexterminado, ¿verdad?\n\n753\n03:22:02.792 --> 03:22:05.909\nAhora, aquí, pero ten cuidado,\nTe echaré un ojo.\n\n754\n03:22:06.042 --> 03:22:08.579\nY ahora váyanse.\n\n755\n03:22:08.708 --> 03:22:11.290\nDije, vete.\n\n756\n03:28:52.208 --> 03:28:55.120\n- ¡Doctor!\n- ¿Qué deseas?\n\n757\n03:28:55.250 --> 03:28:57.662\n- ¡Doctor!\n- ¿Qué deseas?\n\n758\n03:28:57.792 --> 03:29:00.784\n- ¡Doctor!\n- Déjame ir. ¡Pequeño mocoso!\n\n759\n03:29:02.292 --> 03:29:04.123\n¡Maldito infierno!\n\n760\n03:29:11.500 --> 03:29:13.331\n¿Qué diablos quieres?\n\n761\n03:29:15.208 --> 03:29:17.574\nVamos, dímelo.\n\n762\n03:29:17.708 --> 03:29:19.699\n¿Qué deseas?\n\n763\n03:29:23.625 --> 03:29:25.616\n¿Adónde vas? Detente ahora.\nNo te haré daño.\n\n764\n03:29:25.750 --> 03:29:27.581\n¡Detener!\n\n765\n03:29:29.333 --> 03:29:31.665\n¡No te haré ningún daño!\n\n766\n03:35:53.458 --> 03:35:57.747\n\"Sí\", se dijo a sí misma en voz baja.\n\n767\n03:35:57.875 --> 03:36:02.039\nLos ángeles ven esto\ny entender.\n\n768\n03:36:02.167 --> 03:36:06.240\nElla sintió paz por dentro,\ny a su alrededor los árboles, el camino,\n\n769\n03:36:06.375 --> 03:36:11.369\nla lluvia y la noche\nTodos respiraban tranquilidad.\n\n770\n03:36:12.583 --> 03:36:16.280\nTodo lo que pasa es bueno,\nella pensó\n\n771\n03:36:16.417 --> 03:36:19.614\ntodo fue,\nen fin, sencillo.\n\n772\n03:36:20.917 --> 03:36:23.659\nElla recordó el día anterior,\n\n773\n03:36:23.792 --> 03:36:28.206\ny sonriendo se dio cuenta\ncómo se conectan las cosas.\n\n774\n03:36:29.125 --> 03:36:34.290\nElla sintió que estos eventos\nno están conectados por accidente\n\n775\n03:36:34.417 --> 03:36:39.491\npero hay algo indescriptible\nhermoso significado que los une.\n\n776\n03:36:40.917 --> 03:36:44.830\nY ella supo que no estaba sola,\npor todas las cosas y personas,\n\n777\n03:36:44.958 --> 03:36:49.031\nsu padre allá arriba, su madre,\nsus hermanos, el doctor,\n\n778\n03:36:49.167 --> 03:36:54.082\nel gato estas acacias,\neste camino muday, este cielo,\n\n779\n03:36:54.208 --> 03:36:57.655\nesta noche aquí abajo\ndependía de ella,\n\n780\n03:36:57.792 --> 03:37:01.239\ntal como ella misma\ndependía de todo.\n\n781\n03:37:02.458 --> 03:37:05.165\nNo tenía motivos para preocuparse.\n\n782\n03:37:05.292 --> 03:37:09.205\nElla sabía bien que sus ángeles\nse había propuesto recogerla\n\n783\n03:37:58.125 --> 03:38:06.125\nLa obra de la araña ii.\n\n784\n03:38:08.917 --> 03:38:12.364\nEstaba trabajando y trabajando,\nsimplemente avanzando pesadamente.\n\n785\n03:38:12.500 --> 03:38:16.413\nLos niños de Steigerwald\ny hochan el carnicero, las chicas,\n\n786\n03:38:16.542 --> 03:38:21.036\nmientras saltaban como saltamontes\ncuando irimias me abrazó\n\n787\n03:38:21.167 --> 03:38:24.125\ny preguntó,\n\"¿Cómo te va, kelemen?\"\n\n788\n03:38:24.250 --> 03:38:28.789\nY compré una ronda\ny me contó todo,\n\n789\n03:38:28.917 --> 03:38:30.873\ny estaban bebiendo licor de ron,\n\n790\n03:38:31.000 --> 03:38:34.037\nincluso entonces estaba trabajando pesadamente\ny trabajando pesadamente\n\n791\n03:38:34.167 --> 03:38:36.783\ny avanzando pesadamente y avanzando pesadamente.\n\n792\n03:38:36.917 --> 03:38:41.206\nEstarán aquí.\nEstarán aquí en el patio.\n\n793\n03:38:41.333 --> 03:38:45.451\nEstarán aquí. El chico téth,\n\n794\n03:38:45.583 --> 03:38:47.323\nirimias.\n\n795\n03:38:49.333 --> 03:38:52.245\nY han sido\na los steigerwald.\n\n796\n03:38:52.375 --> 03:38:58.905\nY mientras avanzaba con dificultad,\ncuando quedó claro\n\n797\n03:38:59.042 --> 03:39:05.368\nsalían hacia el patio,\nentonces lo supe todo.\n\n798\n03:39:05.500 --> 03:39:10.494\nirimias y petrina\nvenían hacia el patio.\n\n799\n03:39:10.625 --> 03:39:17.781\nConocí a hochan el carnicero\ny me topé con el niño téth.\n\n800\n03:39:17.917 --> 03:39:21.535\nY mientras avanzaba con dificultad,\n\n801\n03:39:21.667 --> 03:39:24.249\nporque tuve que trabajar pesadamente...\n\n802\n03:39:25.500 --> 03:39:28.947\nY los vi junto al camino,\n\n803\n03:39:29.083 --> 03:39:35.989\nrevelación en qué dirección...\n¿Por qué... a dónde?\n\n804\n03:39:36.125 --> 03:39:41.950\ny el trabajo pesado, el por qué,\nel hacia dónde y el camino,\n\n805\n03:39:42.083 --> 03:39:47.248\nel niño toth,\nlos niños steigerwald,\n\n806\n03:39:47.375 --> 03:39:50.663\nirimias y petrina\n\n807\n03:39:50.792 --> 03:39:53.625\ny la pólvora\nEn casa de los steigerwald.\n\n808\n03:39:56.417 --> 03:39:59.705\nY los niños Steigerwald hablando\nsobre la pólvora,\n\n809\n03:39:59.833 --> 03:40:03.530\ny yo trabajando y trabajando pesadamente...\n\n810\n03:40:03.667 --> 03:40:06.625\nY los niños steigerwald\nEstaban hablando de pólvora.\n\n811\n03:40:06.750 --> 03:40:09.662\nY los niños steigerwald,\nhablando de pólvora...\n\n812\n03:40:13.083 --> 03:40:16.530\nPero el chico téth,\n\n813\n03:40:16.667 --> 03:40:19.909\nél estaba allí...\nEn el puente de pesaje.\n\n814\n03:40:21.042 --> 03:40:23.624\n- Ponle un poco de refresco.\n- Ya le he puesto un poco.\n\n815\n03:40:23.750 --> 03:40:27.413\n- Y los niños Steigerwald...\n- Una botella de vino.\n\n816\n03:40:27.542 --> 03:40:32.081\nLa pólvora no es pólvora.\nEstaban hablando de pólvora.\n\n817\n03:40:32.208 --> 03:40:35.575\n- Cuidado o se te sube a la cabeza.\n- No pólvora, pólvora.\n\n818\n03:40:35.708 --> 03:40:38.120\nEstaba avanzando, avanzando pesadamente...\n\n819\n03:40:38.250 --> 03:40:44.246\n¡La pólvora no es pólvora!\n¡Pólvora! ¡No es pólvora!\n\n820\n03:40:44.375 --> 03:40:49.324\nMe abrazó...las camareras\nsaltaban como saltamontes...\n\n821\n03:40:49.458 --> 03:40:51.665\nEstaban bebiendo ron y licor.\n\n822\n03:40:51.792 --> 03:40:54.909\nSé que no debería beber más\nporque se me subirá a la cabeza.\n\n823\n03:40:55.042 --> 03:40:57.829\nEstaba avanzando, avanzando pesadamente...\n\n824\n03:40:57.958 --> 03:41:00.574\nLo estás ofreciendo de manera tan tentadora.\n\n825\n03:41:00.708 --> 03:41:03.541\n¡Se te sube directamente a la cabeza!\nEstás enojado hasta los ojos.\n\n826\n03:41:03.667 --> 03:41:07.785\nMientras avanzas pesadamente\naprendes todo.\n\n827\n03:41:07.917 --> 03:41:13.833\n¡No le des otro carajo!\n¿No puedes ver el estado de ella?\n\n828\n03:41:13.958 --> 03:41:19.407\nNo debería beber. Cuando lo hago,\nSigo pensando en ataúdes.\n\n829\n03:41:19.542 --> 03:41:23.785\nel steigerwald\ny las irimias me abrazaron,\n\n830\n03:41:23.917 --> 03:41:27.739\nlas chicas saltaron\ncomo saltamontes,\n\n831\n03:41:27.875 --> 03:41:30.787\ny compré una ronda,\nbebiendo ron y licor\n\n832\n03:41:30.917 --> 03:41:34.489\ny me dijo todo\ny estoy trabajando pesadamente, trabajando pesadamente,\n\n833\n03:41:34.625 --> 03:41:37.913\nlaborioso, laborioso,\ny laborioso,\n\n834\n03:41:38.042 --> 03:41:40.954\ntrabajando y trabajando,\ny laborioso.\n\n835\n03:41:41.083 --> 03:41:43.495\nPero hay una gran diferencia\nentre laboriosos\n\n836\n03:41:43.625 --> 03:41:45.707\ny avanzando con dificultad.\n\n837\n03:41:45.833 --> 03:41:52.079\nLo supe exactamente cuando los vi.\nen el cruce,\n\n838\n03:41:52.208 --> 03:41:57.282\npor qué, cómo, de qué manera,\npor qué y cómo...\n\n839\n03:41:57.417 --> 03:42:02.537\nEstoy trabajando, trabajando, trabajando,\n¿Y cómo estoy trabajando pesadamente?\n\n840\n03:42:02.667 --> 03:42:04.532\n¿Cómo estoy trabajando pesadamente?\n\n841\n03:42:04.667 --> 03:42:09.036\nLa pólvora,\nlos steigerwald, el chico téth...\n\n842\n03:42:09.167 --> 03:42:16.994\nToda la calle hablaba\nque esconden pólvora.\n\n843\n03:42:17.125 --> 03:42:20.788\n¿Por qué hicieron esto?\n¿Y por qué vienen aquí?\n\n844\n03:42:20.917 --> 03:42:24.614\nSé por qué vienen\nporque tuve una revelación...\n\n845\n03:42:24.750 --> 03:42:29.073\nHace demasiado calor aquí.\nJanos, por favor haz algo.\n\n846\n03:42:29.208 --> 03:42:31.415\n¿No le envidia el carbón?\n\n847\n03:42:31.542 --> 03:42:36.616\nEstán llegando al cruce de carreteras.\nSé exactamente por qué.\n\n848\n03:42:36.750 --> 03:42:41.198\nPor qué, por qué y por qué vienen\ny por qué vienen.\n\n849\n03:42:41.333 --> 03:42:46.532\n- Hace agradable y cálido aquí...\n- ¿Le dejaste, imbécil?\n\n850\n03:42:46.667 --> 03:42:51.707\n¿Qué diablos quieres?\nAl menos hay algo para los demás.\n\n851\n03:42:51.833 --> 03:42:56.327\nPorque estaba trabajando y trabajando pesadamente\ny avanzando pesadamente...\n\n852\n03:42:59.042 --> 03:43:00.282\nVan y vienen...\n\n853\n03:43:00.417 --> 03:43:02.874\n- Esto no es un prostíbulo.\n- ¿Qué entonces?\n\n854\n03:43:03.000 --> 03:43:07.073\nViniendo y viniendo.\n¡Se detienen pero vienen!\n\n855\n03:43:07.208 --> 03:43:09.039\nVayamos al molino.\n\n856\n03:43:09.167 --> 03:43:12.830\nLlegarán aquí.\nEn poco tiempo.\n\n857\n03:43:12.958 --> 03:43:17.406\n- ¿A dónde diablos vas?\n- En ninguna parte, cariño, en ninguna parte.\n\n858\n03:43:17.542 --> 03:43:20.534\nTe mostraré quién es el mielero.\nSólo espera y vuelve a estar sobrio.\n\n859\n03:43:20.667 --> 03:43:22.077\nNada, nada.\n\n860\n03:43:22.208 --> 03:43:30.035\nVienen porque los vi.\npor el camino. En el cruce.\n\n861\n03:43:30.167 --> 03:43:31.167\nDame una oportunidad.\n\n862\n03:43:31.292 --> 03:43:34.489\nLos niños steigerwald hablaron\nsobre el polvo.\n\n863\n03:43:34.625 --> 03:43:37.367\nirimias y petrina\nvienen hacia el patio.\n\n864\n03:43:37.500 --> 03:43:43.746\nPólvora, Steigerwald...\nY vienen al patio.\n\n865\n03:43:43.875 --> 03:43:47.663\nEstarán aquí\nen poco tiempo.\n\n866\n03:43:47.792 --> 03:43:49.783\nEstábamos avanzando pesadamente...\n\n867\n03:43:49.917 --> 03:43:53.364\nMi marido es un buen hombre\npero el alcohol, ya sabes.\n\n868\n03:43:53.500 --> 03:43:57.869\nSin eso sería tan gentil.\n\n869\n03:43:58.000 --> 03:44:01.492\nÉl puede ser un buen hombre bendito.\ncuando quiere.\n\n870\n03:44:01.625 --> 03:44:04.492\nEs un gran trabajador.\nYa lo sabes.\n\n871\n03:44:04.625 --> 03:44:07.412\nPuede hacer el trabajo de dos.\n\n872\n03:44:07.542 --> 03:44:09.783\nSólo tiene este pequeño defecto.\n\n873\n03:44:09.917 --> 03:44:14.661\n¿Quién no tiene uno?\n¿Quién no?\n\n874\n03:44:14.792 --> 03:44:17.659\nVienen caminando pesadamente.\nIrimías y petrina...\n\n875\n03:44:17.792 --> 03:44:19.783\n¡Alguien viene!\n\n876\n03:44:56.542 --> 03:45:00.034\nEstaba trabajando pesadamente, trabajando pesadamente,\navanzando pesadamente...\n\n877\n03:45:02.625 --> 03:45:07.665\nNo hablaron mucho.\nIrimías y petrina...\n\n878\n03:45:07.792 --> 03:45:09.874\nBuenas noches.\nUna botella de cerveza, por favor.\n\n879\n03:45:10.708 --> 03:45:16.032\nLas chicas saltaban\ncomo saltamontes.\n\n880\n03:45:17.542 --> 03:45:20.614\nIrimías me abrazó.\n\"¿Cómo te va, kelemen?\"\n\n881\n03:45:20.750 --> 03:45:22.081\nY nos compró una ronda.\n\n882\n03:45:22.208 --> 03:45:26.076\nLas chicas saltaban\ncomo saltamontes.\n\n883\n03:45:26.208 --> 03:45:31.248\nY yo estaba trabajando pesadamente, trabajando pesadamente\ny avanzando con dificultad.\n\n884\n03:45:31.375 --> 03:45:33.912\n¿Has visto a mi hija?\n\n885\n03:45:34.042 --> 03:45:36.829\n- ¿Cuál?\n- El pequeño.\n\n886\n03:45:36.958 --> 03:45:38.789\nEstike.\n\n887\n03:45:40.458 --> 03:45:41.789\nElla no ha estado aquí.\n\n888\n03:45:41.917 --> 03:45:44.909\nDesde que comenzaron hacia\nel patio en el cruce,\n\n889\n03:45:45.042 --> 03:45:48.159\nLo he sabido todo.\n\n890\n03:45:48.292 --> 03:45:53.207\nirimias y petrina\nvienen hacia el patio.\n\n891\n03:45:53.333 --> 03:45:56.291\nConocí a hochan el carnicero,\ny choqué con el niño téth\n\n892\n03:45:56.417 --> 03:45:59.705\n- en el puente de pesaje.\n- ¿Sabes lo que pasó?\n\n893\n03:45:59.833 --> 03:46:06.363\nAyer por la tarde hubo\nUn pequeño problema con los halicos.\n\n894\n03:46:06.500 --> 03:46:08.240\nAhora ni siquiera saluda\nel imbécil.\n\n895\n03:46:08.375 --> 03:46:11.742\nLos vi en el camino...\n\n896\n03:46:11.875 --> 03:46:18.280\nRevelación, de qué manera,\npor qué, adónde...\n\n897\n03:46:19.042 --> 03:46:23.160\nY el trabajo pesado, el por qué\ny el hacia dónde, el camino...\n\n898\n03:46:23.292 --> 03:46:28.867\nDormí todo el día y cuando desperté\nno había nadie allí.\n\n899\n03:46:29.000 --> 03:46:30.740\nLa casa estaba vacía.\n\n900\n03:46:30.875 --> 03:46:35.869\nNi mari, ni juli, ni sanyika.\n\n901\n03:46:39.125 --> 03:46:43.289\nY trabajando pesadamente, trabajando pesadamente\ny laborioso...\n\n902\n03:46:43.417 --> 03:46:46.409\nLos niños de Steigerwald\nEstaban hablando de pólvora.\n\n903\n03:46:46.542 --> 03:46:51.366\nPero está bien, incluso el pequeño\ntambién se ha ido a alguna parte.\n\n904\n03:46:54.625 --> 03:46:57.742\nCuando ella regrese,\nella lo conseguirá.\n\n905\n03:46:57.875 --> 03:46:59.866\nElla volverá.\n\n906\n03:47:04.083 --> 03:47:06.950\nElla no es del tipo errante.\n\n907\n03:47:07.083 --> 03:47:10.041\nElla realmente no lo es.\n\n908\n03:47:10.167 --> 03:47:14.331\nLa pólvora no es pólvora...\n\n909\n03:47:16.083 --> 03:47:19.746\nVagando bajo esta lluvia\ntoda la noche.\n\n910\n03:47:19.875 --> 03:47:23.538\nNo es de extrañar que me quede en cama durante días.\n\n911\n03:47:23.667 --> 03:47:28.411\nLas camareras saltaron\ncomo saltamontes.\n\n912\n03:47:28.542 --> 03:47:30.783\nEstaban bebiendo ron y licor...\n\n913\n03:47:30.917 --> 03:47:33.249\nEso es bueno para mi estómago.\n\n914\n03:47:36.208 --> 03:47:38.369\n¿Quieres café?\n\n915\n03:47:40.625 --> 03:47:43.367\n¿Por qué? yo estaría tirando\ny dando vueltas toda la noche.\n\n916\n03:47:45.833 --> 03:47:48.700\nEntonces ¿para qué sirve?\n\n917\n03:47:48.833 --> 03:47:50.323\nNada.\n\n918\n03:47:53.042 --> 03:47:57.081\nEn un rato,\nEstaba trabajando y trabajando pesadamente...\n\n919\n03:47:57.208 --> 03:48:02.908\nEl niño toéth, el steigerwald...\nY irimias me abrazó...\n\n920\n03:48:03.042 --> 03:48:06.785\nlas chicas saltaron\ncomo saltamontes,\n\n921\n03:48:06.917 --> 03:48:09.829\nnos compró una ronda,\ntenían ron y licor.\n\n922\n03:48:09.958 --> 03:48:14.122\nel me dijo todo\ny estoy trabajando pesadamente...\n\n923\n03:48:14.250 --> 03:48:16.081\nBueno, buenas noches.\n\n924\n03:48:17.250 --> 03:48:19.662\nSi por casualidad ves alguno de ellos,\n\n925\n03:48:19.792 --> 03:48:22.374\nDiles que tomen el camino a casa.\n\n926\n03:48:22.500 --> 03:48:26.743\nno puedo estar vagando\nalrededor toda la noche.\n\n927\n03:48:28.792 --> 03:48:30.783\naquí está la factura\n\n928\n03:48:32.000 --> 03:48:36.915\npor qué, cómo, de qué manera,\npor qué y cómo...\n\n929\n03:48:37.042 --> 03:48:39.784\nTrabajo duro y trabajo pesado\ny laborioso.\n\n930\n03:48:39.917 --> 03:48:42.203\n¿Y cómo estoy trabajando pesadamente?\n\n931\n03:48:42.333 --> 03:48:48.863\nLa pólvora, hochan el carnicero,\nsteigerwald, téth...\n\n932\n03:48:49.000 --> 03:48:53.369\ntodos estaban hablando\nsobre los niños steigerwald\n\n933\n03:48:53.500 --> 03:48:56.333\nescondiendo pólvora. ¿Por qué?\n\n934\n03:48:58.000 --> 03:49:00.491\n¿Y por qué están irimias y petrina?\n¿Vienes hacia el patio?\n\n935\n03:49:00.625 --> 03:49:03.287\nSé por qué vienen.\n\n936\n03:49:03.417 --> 03:49:07.660\nPorque tuve una revelación.\nUna revelación.\n\n937\n03:49:07.792 --> 03:49:11.239\nSé por qué vienen.\nPorque tuve una revelación.\n\n938\n03:49:11.375 --> 03:49:16.415\nEstán llegando al cruce.\nSé exactamente por qué.\n\n939\n03:49:16.542 --> 03:49:19.534\nSe detienen pero vienen.\n\n940\n03:51:37.500 --> 03:51:40.867\nFutaki, ese estúpido culo,\n\n941\n03:51:41.000 --> 03:51:43.833\nrueda en el barro como un cerdo,\n\n942\n03:51:43.958 --> 03:51:47.030\nluego sale bajo la lluvia\ncomo oveja descarriada.\n\n943\n03:51:48.500 --> 03:51:50.331\n¿Has perdido la cabeza?\n\n944\n03:51:52.833 --> 03:51:56.655\nNo sabes que no se supone que\n¿Que te arruinen aquí?\n\n945\n03:52:12.750 --> 03:52:14.741\nY sin comer también.\n\n946\n03:52:33.417 --> 03:52:35.248\nLávate la cara.\n\n947\n03:52:36.875 --> 03:52:38.706\nSécate.\n\n948\n03:53:15.792 --> 03:53:17.874\n¿Tienes algo para comer?\n\n949\n03:53:18.792 --> 03:53:20.623\nChocolate con leche.\n\n950\n03:53:21.875 --> 03:53:24.457\nO rollitos de queso.\n\n951\n03:53:26.542 --> 03:53:28.703\nDame dos panecillos de queso.\n\n952\n03:53:48.875 --> 03:53:50.706\nMaldito infierno.\n\n953\n03:53:53.417 --> 03:53:55.999\nLo que no se puede mover, lo ensucian.\n\n954\n03:53:57.375 --> 03:53:59.206\nY asqueroso, todo.\n\n955\n03:54:00.083 --> 03:54:04.076\nPodría pasar toda mi vida\nsiguiéndolos con un paño.\n\n956\n03:54:05.542 --> 03:54:11.037\nLas patas de la mesa,\nla ventana, la estufa... las cajas.\n\n957\n03:54:15.583 --> 03:54:19.997\nlo peor es\nque no puedes verlos hacerlo.\n\n958\n03:54:25.333 --> 03:54:28.405\nSi empiezo a mirarlos,\n\n959\n03:54:28.542 --> 03:54:33.115\nellos pueden sentirlo\n\n960\n03:54:33.250 --> 03:54:35.662\ny salir de la vista.\n\n961\n03:54:44.542 --> 03:54:47.079\nEse maldito suabo\n\n962\n03:54:47.208 --> 03:54:49.039\n¿me hizo...?\n\n963\n03:54:50.750 --> 03:54:53.332\nNunca mencionó las arañas.\n\n964\n03:54:57.125 --> 03:55:00.288\nNada saldrá de la nada.\n\n965\n03:55:04.958 --> 03:55:06.368\nNo.\n\n966\n03:55:07.875 --> 03:55:10.867\nLa verdadera amenaza viene\ndesde debajo del suelo.\n\n967\n03:55:13.167 --> 03:55:14.657\nDe repente...\n\n968\n03:55:15.292 --> 03:55:19.991\nUno tiene miedo del silencio,\nno se mueve,\n\n969\n03:55:20.125 --> 03:55:23.617\nse agacha en la esquina\ndonde se siente seguro.\n\n970\n03:55:23.750 --> 03:55:27.993\nMasticar se convierte en dolor,\nagonía al tragar.\n\n971\n03:55:29.708 --> 03:55:33.121\nLuego todo se ralentiza y finalmente\n\n972\n03:55:33.250 --> 03:55:36.162\nViene lo más terrible.\n\n973\n03:55:36.292 --> 03:55:38.283\nQuietud.\n\n974\n03:55:39.708 --> 03:55:42.541\nNo hay ayuda ni escapatoria.\n\n975\n03:55:44.292 --> 03:55:47.830\nPorque ¿quién puede entender?\n\n976\n03:55:47.958 --> 03:55:51.155\nque yo, que podría vivir\nhasta el fin de los tiempos,\n\n977\n03:55:51.292 --> 03:55:57.538\ntodavía tendría que irme de aquí\nhasta llegar a los gusanos.\n\n978\n03:55:57.667 --> 03:55:59.908\nY ahora vienen las irimias.\n\n979\n03:56:00.708 --> 03:56:02.369\n¿Irimías?\n\n980\n03:56:03.292 --> 03:56:05.829\nHa estado bebiendo por cuenta de la casa.\ndurante semanas\n\n981\n03:56:05.958 --> 03:56:08.825\ny tiene el maldito descaro\npara volver aquí.\n\n982\n03:56:08.958 --> 03:56:12.906\nPorque, está bien, dijo,\nDebería plantar cebollas por todas partes.\n\n983\n03:56:13.042 --> 03:56:14.782\nY lo logró.\n\n984\n03:56:14.917 --> 03:56:17.750\nPorque las grandes ideas\nson siempre simples.\n\n985\n03:56:18.958 --> 03:56:22.530\nPero es demasiado\nque después vuelve\n\n986\n03:56:22.667 --> 03:56:25.704\ny dice\nque le debo todo.\n\n987\n03:56:25.833 --> 03:56:28.996\nY durante semanas\nha estado bebiendo gratis.\n\n988\n03:56:32.792 --> 03:56:35.750\nY tiene el descaro de venir.\nVolver para tomar lo que es mío.\n\n989\n03:56:35.875 --> 03:56:38.287\nTodo aquí es mío.\n\n990\n03:56:43.542 --> 03:56:46.454\nPorque he hecho todo aquí.\n\n991\n03:56:51.167 --> 03:56:54.409\n¿Piensan\n¿Pueden hacer algo aquí?\n\n992\n03:56:55.583 --> 03:56:59.280\nellos entran\ndesde la calle y decir,\n\n993\n03:56:59.417 --> 03:57:01.578\n\"¡Puedes irte ahora!\"\n\n994\n03:57:08.792 --> 03:57:12.614\nAquí habrá ley y orden,\namigo mío, en este país!\n\n995\n03:57:12.750 --> 03:57:16.743\n¡Habrá orden aquí algún día!\n¡Habrá orden!\n\n996\n04:08:01.417 --> 04:08:04.739\nVerás, ¡aquí tienes halics!\n\n997\n04:08:28.500 --> 04:08:30.661\n¿Puedo tener un tango?\n\n998\n04:08:39.417 --> 04:08:42.409\n¿Sabes?\n¿Que bailar es mi debilidad?\n\n999\n04:09:16.750 --> 04:09:19.583\nNo eres como los demás.\n\n1000\n04:09:36.292 --> 04:09:42.288\nNecesitas un hombre tranquilo y sobrio...\n\n1001\n04:09:43.375 --> 04:09:45.787\nNo es un schmidt...\n\n1002\n04:09:58.083 --> 04:10:02.326\nCuyo carácter rudo\n\n1003\n04:10:02.458 --> 04:10:06.701\nno está de acuerdo\ncon tu tierna personalidad.\n\n1004\n04:10:19.500 --> 04:10:21.240\nEscuchar.\n\n1005\n04:10:25.000 --> 04:10:28.413\nSi esas personas más excelentes\n\n1006\n04:10:28.542 --> 04:10:34.037\npuede volver a ocupar los puestos\nse merecen en las oficinas...\n\n1007\n04:10:37.542 --> 04:10:41.285\nY soy el maestro de escuela otra vez...\n\n1008\n04:10:43.792 --> 04:10:49.788\nTe llevaría a la ciudad...\n\n1009\n04:11:33.542 --> 04:11:38.115\nEl tango es mi vida.\n¡Tango, tango, tango!\n\n1010\n04:1
