<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SÁTÁNTANGÓ · descenso</title>
<link rel="preconnect" href="https://archive.org" crossorigin>
<link rel="preconnect" href="https://www.subtitlecat.com" crossorigin>
<style>
:root{--ink:#f2efe8;--dim:#4e4c48;--line:#2a2825;--top:2147482000}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000}
@supports(height:100dvh){html,body{height:100dvh}}
body{font:13px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--ink);
  overflow:hidden;cursor:default;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
::selection{background:#fff;color:#000}

/* ============================================================
   EL ABISMO
   ============================================================ */
#abyss{position:fixed;inset:0;overflow:hidden;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:24px;z-index:1;
  transition:transform 1.1s cubic-bezier(.65,0,.35,1),filter 1.1s ease-in,opacity 1.1s ease-in}
#abyss canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
#abyss::before{content:"";position:absolute;inset:-10%;z-index:1;pointer-events:none;
  background:
    radial-gradient(60% 45% at 50% 118%,rgba(180,175,165,.14),transparent 70%),
    radial-gradient(42% 34% at 50% -8%,rgba(200,195,185,.13),transparent 72%);
  animation:breathe 17s ease-in-out infinite alternate}
@keyframes breathe{from{transform:translateY(-1.4%) scale(1)}to{transform:translateY(1.4%) scale(1.06)}}
#abyss::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse 62% 52% at 50% 50%,transparent 22%,rgba(0,0,0,.55) 68%,#000 100%),
             repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}

.fog{position:absolute;inset:-20%;z-index:1;pointer-events:none;opacity:.5;
  background:radial-gradient(closest-side at 50% 50%,rgba(190,185,175,.1),transparent 70%);
  filter:blur(30px)}
.fog.f1{animation:drift1 34s linear infinite}
.fog.f2{animation:drift2 47s linear infinite;opacity:.35}
@keyframes drift1{from{transform:translate(-9%,6%) scale(1.1)}to{transform:translate(9%,-6%) scale(1.3)}}
@keyframes drift2{from{transform:translate(11%,-8%) scale(1.25)}to{transform:translate(-11%,8%) scale(1)}}

.shaft{position:absolute;left:50%;top:-14%;width:min(30vw,300px);height:76%;transform:translateX(-50%);
  z-index:1;pointer-events:none;opacity:.55;
  background:linear-gradient(to bottom,rgba(255,255,255,.09),rgba(255,255,255,.015) 55%,transparent);
  clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);filter:blur(14px)}
.horizon{position:absolute;left:0;right:0;top:64%;height:1px;z-index:2;pointer-events:none;
  background:linear-gradient(to right,transparent,rgba(240,238,232,.4),transparent);
  animation:hz 9s ease-in-out infinite alternate}
@keyframes hz{from{opacity:.25;transform:scaleX(.7)}to{opacity:.75;transform:scaleX(1.05)}}

.core{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;gap:22px;
  text-align:center;padding:0 22px;will-change:transform}
.eyebrow{font-size:9px;letter-spacing:.52em;text-transform:uppercase;color:var(--dim)}
h1{font:400 clamp(40px,10.5vw,148px)/.92 ui-serif,Georgia,"Times New Roman",serif;
  letter-spacing:.2em;margin:0;color:var(--ink);
  text-shadow:0 0 90px rgba(240,238,232,.28),0 6px 40px rgba(0,0,0,.9)}
h1 span{display:inline-block;animation:sink 11s ease-in-out infinite alternate}
@keyframes sink{from{transform:translateY(-.5%)}to{transform:translateY(.5%)}}
.sub{font-size:10px;letter-spacing:.42em;text-transform:uppercase;color:#6c6963;line-height:2.2}
.sub b{color:#a9a59d;font-weight:400}

#go{margin-top:10px;padding:17px 46px;border:1px solid #3a3833;color:var(--ink);
  letter-spacing:.46em;font-size:11px;text-transform:uppercase;background:rgba(0,0,0,.25);
  transition:border-color .35s,box-shadow .35s,background .35s,letter-spacing .35s}
#go:hover,#go:focus{outline:none;border-color:var(--ink);letter-spacing:.52em;
  box-shadow:0 0 0 1px rgba(242,239,232,.35),0 0 70px rgba(242,239,232,.18);
  background:rgba(242,239,232,.05)}
#go small{display:block;font-size:8px;letter-spacing:.3em;color:var(--dim);margin-top:7px}

.credit{position:absolute;left:0;right:0;bottom:16px;z-index:6;text-align:center;
  font-size:8px;letter-spacing:.32em;text-transform:uppercase;color:#383633;line-height:2}
.credit b{color:#57544f;font-weight:400}
.drop{position:absolute;left:50%;bottom:64px;width:1px;height:44px;z-index:6;transform:translateX(-50%);
  background:linear-gradient(to bottom,transparent,rgba(240,238,232,.55));
  animation:drip 2.6s ease-in infinite}
@keyframes drip{0%{opacity:0;transform:translateX(-50%) scaleY(.2)}40%{opacity:1}100%{opacity:0;transform:translateX(-50%) scaleY(1) translateY(18px)}}

/* caída */
body.falling #abyss{transform:scale(1.45) translateY(6%);filter:blur(9px) brightness(.55);opacity:0}
body.falling .core{transition:transform 1.1s cubic-bezier(.65,0,.35,1)}
body.falling #go{opacity:0}

/* ============================================================
   EL REPRODUCTOR
   ============================================================ */
#film{position:fixed;inset:0;z-index:2;background:#000;display:none;flex-direction:column}
body.film #film{display:flex}
#abyss{pointer-events:none}
body:not(.film) #abyss{pointer-events:auto}
body.film #abyss{opacity:0}

#stage{position:relative;flex:1;min-height:0;background:#000;overflow:hidden;outline:none}
#v{width:100%;height:100%;object-fit:contain;display:block;background:#000}
#v::cue{background:rgba(0,0,0,.78);color:#fff;font:600 4.6vh/1.4 ui-monospace,Menlo,monospace;
  text-shadow:0 2px 10px #000}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:8;opacity:.35;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.4) 0 1px,transparent 1px 3px)}
#veil{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;background:#000;text-align:center;padding:26px;
  transition:opacity .6s}
#veil.off{opacity:0;pointer-events:none}
#veil h2{margin:0;font:400 clamp(22px,4vw,40px)/1.2 ui-serif,Georgia,serif;letter-spacing:.24em}
#veil p{margin:0;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:#5a5751}
#depthRead{font-size:11px;letter-spacing:.4em;color:#8b877f;font-variant-numeric:tabular-nums}
#veil button{padding:12px 30px;border:1px solid #34322e;letter-spacing:.34em;font-size:10px;
  text-transform:uppercase;color:var(--ink)}
#veil button:hover{border-color:var(--ink)}
.warn{color:#ff8f74!important}

#spin{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;z-index:15;display:none;
  border:1px solid rgba(255,255,255,.16);border-top-color:#fff;border-radius:50%;animation:sp .85s linear infinite}
#spin.on{display:block}
@keyframes sp{to{transform:rotate(360deg)}}

/* controles */
#bar{position:absolute;left:0;right:0;bottom:0;z-index:25;padding:10px 18px 14px;
  background:linear-gradient(to top,rgba(0,0,0,.96),rgba(0,0,0,.7) 55%,transparent);
  display:flex;flex-direction:column;gap:8px;opacity:0;transition:opacity .25s;pointer-events:none}
body.showbar #bar{opacity:1;pointer-events:auto}
#bar .row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
#bar button{min-width:34px;height:30px;padding:0 8px;border:1px solid #2c2a27;background:rgba(255,255,255,.04);
  font-size:12px;color:#b8b4ac;transition:.15s}
#bar button:hover{border-color:var(--ink);color:var(--ink)}
#bar button.on{background:var(--ink);color:#000;border-color:var(--ink)}
#bar button.off{opacity:.4}
#bar button:focus{outline:none;background:var(--ink);color:#000;border-color:var(--ink);
  box-shadow:0 0 0 2px #000,0 0 0 3px var(--ink)}
#time{font-size:10px;color:#7d7972;font-variant-numeric:tabular-nums;min-width:118px;letter-spacing:.06em}
#seek{flex:1 1 160px;min-width:120px;accent-color:#f2efe8;height:3px}
#meter{font-size:9px;letter-spacing:.26em;color:#4b4843;text-transform:uppercase}

/* cajón */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,92vw);z-index:60;background:#08080a;
  border-left:1px solid #2a2825;display:none;flex-direction:column}
#drawer.on{display:flex}
#drawer header{padding:14px;border-bottom:1px solid #1c1a18;display:flex;align-items:center;gap:10px}
#drawer h3{margin:0;font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:#8b877f;font-weight:400;flex:1}
#drawer header button{font-size:16px;color:#5a5751}
#chap{flex:1;min-height:0;overflow:auto;padding:8px}
#chap button{display:flex;gap:10px;width:100%;text-align:left;padding:10px 9px;font-size:12px;
  color:#9a968e;border:1px solid transparent;margin-bottom:1px}
#chap .n{min-width:54px;font-size:10px;color:#4b4843;font-variant-numeric:tabular-nums}
#chap button:hover{border-color:#2a2825;color:var(--ink)}
#chap button.act{background:rgba(242,239,232,.09);color:var(--ink);border-color:#4b4843}
#chap button:focus{outline:none;border-color:var(--ink);color:var(--ink)}
#drawer .foot{padding:12px 14px;border-top:1px solid #1c1a18;font-size:10px;color:#5a5751;
  letter-spacing:.14em;line-height:1.9}
#drawer .foot button{border:1px solid #2a2825;padding:5px 10px;font-size:10px;margin-top:7px;
  letter-spacing:.16em;text-transform:uppercase;color:#b8b4ac}
#drawer .foot button:hover{border-color:var(--ink);color:var(--ink)}
#subState{color:#6c6963}

@media (max-width:620px){#go{padding:15px 34px}h1{letter-spacing:.14em}#time{min-width:96px}}
</style>
</head>
<body>

<div id="abyss">
  <canvas id="rain"></canvas>
  <div class="fog f1"></div><div class="fog f2"></div>
  <div class="shaft"></div><div class="horizon"></div>
  <div class="core" id="core">
    <div class="eyebrow">entrada al abismo</div>
    <h1><span>SÁTÁNTANGÓ</span></h1>
    <div class="sub">Béla Tarr · 1994 · <b>7 h 19 min</b><br>12 capítulos · blanco y negro · húngaro · 1080p</div>
    <button id="go">Descender<small>con subtítulos en español</small></button>
  </div>
  <div class="drop"></div>
  <div class="credit"><b>XCODE://abismo</b> · by UltraOmniverse<br>por Daniel Alejandro Gascón Castaño — Founder</div>
</div>

<div id="film">
  <div id="stage" tabindex="-1">
    <video id="v" preload="auto" playsinline webkit-playsinline crossorigin="anonymous">
      <track id="trk" kind="subtitles" srclang="es" label="Español (LATAM)" default>
    </video>
    <div id="spin"></div>
    <div id="veil">
      <h2 id="veilT">Descendiendo</h2>
      <p id="veilP">preparando el pozo</p>
      <div id="depthRead">0 m</div>
      <button id="veilB" style="display:none">Reintentar</button>
    </div>
    <div id="bar">
      <div class="row">
        <span id="meter">profundidad</span>
        <input id="seek" type="range" min="0" max="1000" value="0" step="1">
        <span id="time">0:00 / 7:19:09</span>
      </div>
      <div class="row">
        <button id="bPlay" title="Pausa (espacio)">❚❚</button>
        <button id="bB" title="−10 s">↺</button>
        <button id="bF" title="+10 s">↻</button>
        <button id="bCC" title="Subtítulos (c)">CC</button>
        <button id="bSyncL" title="Atrasar 0.5 s">−s</button>
        <button id="bSyncR" title="Adelantar 0.5 s">+s</button>
        <button id="bChap" title="Capítulos (l)">☰</button>
        <button id="bFs" title="Pantalla grande (f)">⛶</button>
        <button id="bBack" title="Volver al abismo (esc)" style="margin-left:auto">⌃</button>
      </div>
    </div>
  </div>
</div>

<div id="drawer">
  <header><h3>Capítulos</h3><button id="dClose">×</button></header>
  <div id="chap"></div>
  <div class="foot">
    <div id="subState">Buscando subtítulos…</div>
    <button id="bFile">Cargar .srt / .vtt</button>
    <input id="file" type="file" accept=".srt,.vtt,text/vtt" style="display:none">
  </div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const fmt=t=>{t=Math.max(0,Math.floor(t||0));const h=~~(t/3600),m=~~(t%3600/60),s=t%60;
  return h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");};
const DUR=26348.92;                       /* 7:19:09 */
const DEEP=2400;                          /* metros hasta el fondo */

/* ---------- lluvia ---------- */
const cv=$("rain"),ctx=cv.getContext("2d");
let W=0,H=0,drops=[];
function size(){
  const d=Math.min(devicePixelRatio||1,2);
  W=cv.clientWidth;H=cv.clientHeight;
  cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
  const n=Math.round(Math.min(150,W/9));
  drops=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,
    l:8+Math.random()*34,v:.55+Math.random()*1.5,o:.05+Math.random()*.26,w:Math.random()<.2?1:0.6}));
}
addEventListener("resize",size);
function rain(){
  ctx.clearRect(0,0,W,H);
  for(const d of drops){
    ctx.strokeStyle="rgba(226,223,215,"+d.o+")";ctx.lineWidth=d.w;
    ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-.9,d.y+d.l);ctx.stroke();
    d.y+=d.v;d.x-=.22;
    if(d.y>H+40){d.y=-40;d.x=Math.random()*W;}
    if(d.x<-10)d.x=W+10;
  }
  if(!document.body.classList.contains("film"))requestAnimationFrame(rain);
}

/* ---------- paralaje ---------- */
let tx=0,ty=0,cx=0,cy=0;
addEventListener("pointermove",e=>{
  tx=(e.clientX/innerWidth-.5);ty=(e.clientY/innerHeight-.5);
},{passive:true});
(function drift(){
  cx+=(tx-cx)*.045;cy+=(ty-cy)*.045;
  const core=$("core");
  if(core&&!document.body.classList.contains("film"))
    core.style.transform="translate("+(-cx*16)+"px,"+(-cy*12)+"px)";
  requestAnimationFrame(drift);
})();

/* ---------- estado ---------- */
const v=$("v"),trk=$("trk"),stage=$("stage"),veil=$("veil"),bar=$("bar"),seek=$("seek"),chap=$("chap");
let subRaw=null,subMode="none",subOff=0,subUrl=null,gen=0,showSubs=true,
    started=false,dragging=false,curChap=-1,barT=0,lastKey=0;

/* ---------- subtítulos ---------- */
const SRCS=[
 "https://www.subtitlecat.com/subs/1324/Satantango.1994.HUNGARIAN.720p.BluRay.H264.AAC-VXT-es-419.srt",
 "https://www.subtitlecat.com/subs/1249/Satantango.1994.HUNGARIAN.720p.BluRay.H264.AAC-VXT-es.srt"
];
const ready=()=>subMode!=="none"&&!!subRaw;
function pad(n,l){return String(n).padStart(l,"0");}
function ts(ms){ms=Math.max(0,Math.round(ms));
  return pad(~~(ms/3600000),2)+":"+pad(~~(ms%3600000/60000),2)+":"+pad(~~(ms%60000/1000),2)+"."+pad(ms%1000,3);}
function stamp(t,off){
  const m=t.trim().match(/^(?:(\d+):)?(\d{1,2}):(\d{2})[,.](\d{1,3})$/);
  return m?ts((+m[1]||0)*3600000+(+m[2])*60000+(+m[3])*1000+(+m[4].padEnd(3,"0"))+off):null;
}
function toVtt(raw,off){
  const srt=/,\d{3}\s*-->/.test(raw),out=["WEBVTT",""];
  for(const line of raw.replace(/^\uFEFF/,"").replace(/\r/g,"").split("\n")){
    if(line.indexOf("-->")>0){
      const p=line.split("-->"),a=stamp(p[0],off),b=stamp((p[1]||"").trim().split(/\s+/)[0],off);
      if(a&&b){out.push(a+" --> "+b);continue;}
    }
    if(/^WEBVTT/.test(line)||(srt&&/^\d+$/.test(line.trim())))continue;
    out.push(line);
  }
  return out.join("\n");
}
function applyMode(){
  const t=v.textTracks&&v.textTracks[0];
  if(t)t.mode=(showSubs&&ready())?"showing":"hidden";
  $("bCC").classList.toggle("on",ready()&&showSubs);
  $("bCC").classList.toggle("off",!ready());
}
function mount(){
  if(!subRaw)return;
  const old=subUrl;
  subUrl=URL.createObjectURL(new Blob([toVtt(subRaw,subOff)],{type:"text/vtt"}));
  trk.src=subUrl;
  if(old)setTimeout(()=>URL.revokeObjectURL(old),4000);
  applyMode();
}
function setSub(raw,label,kind){
  subRaw=raw;subMode=kind;subOff=0;
  $("subState").textContent=(kind==="archivo"?"Cargados: ":"Español: ")+label+" · "+Math.max(1,~~(raw.length/1024))+" KB";
  mount();
}
async function boot(){
  const my=++gen;
  subRaw=null;subMode="none";trk.removeAttribute("src");applyMode();
  $("subState").textContent="Buscando subtítulos en español…";
  const tryOne=async u=>{const r=await fetch(u);if(!r.ok)throw 0;const x=await r.text();
    if(x.indexOf("-->")<0)throw 0;return x;};
  for(const u of SRCS){try{const x=await tryOne(u);if(gen!==my)return;setSub(x,u.split("/").pop(),"red");return;}catch{}}
  for(const u of SRCS){
    try{const x=await tryOne("https://api.allorigins.win/raw?url="+encodeURIComponent(u));
      if(gen!==my)return;setSub(x,u.split("/").pop()+" (proxy)","red");return;}catch{}
  }
  if(gen!==my)return;
  $("subState").textContent="No se pudieron cargar. Abre ☰ → «Cargar .srt».";
}
$("bCC").onclick=()=>{if(!ready()){$("subState").textContent="Todavía sin subtítulos.";return;}
  showSubs=!showSubs;applyMode();};
$("bSyncL").onclick=()=>{if(!subRaw)return;subOff-=500;mount();};
$("bSyncR").onclick=()=>{if(!subRaw)return;subOff+=500;mount();};
$("bFile").onclick=()=>$("file").click();
$("file").onchange=e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const x=String(r.result);if(x.indexOf("-->")<0){$("subState").textContent="Ese archivo no tiene tiempos.";return;}
    setSub(x,f.name,"archivo");};
  r.readAsText(f,"utf-8");
};

/* ---------- capítulos ---------- */
const CH=[
 [0,"Inicio"],[632.75,"Noticias de su venida"],[8237.9,"Intermedio"],
 [8245.75,"El trabajo de la araña I"],[13078.1,"La obra de la araña II"],
 [15705.4,"Intermedio"],[15713.2,"Irimias hace un discurso"],
 [16551.5,"La perspectiva, vista desde el frente"],[21598.75,"La perspectiva, vista desde atrás"]
];
CH.forEach(([t,n])=>{
  const b=document.createElement("button");
  b.innerHTML='<span class="n">'+fmt(t)+"</span><span>"+n+"</span>";
  b.onclick=()=>{v.currentTime=t;if(v.paused)v.play().catch(()=>{});drawer(false);};
  chap.appendChild(b);
});
function markChap(){
  let k=0;CH.forEach(([t],i)=>{if(v.currentTime>=t-1.5)k=i;});
  if(k===curChap)return;curChap=k;
  [...chap.children].forEach((b,i)=>b.classList.toggle("act",i===k));
}

/* ---------- interfaz ---------- */
function drawer(on){
  $("drawer").classList.toggle("on",on);
  if(on)setTimeout(()=>{const f=chap.querySelector(".act")||chap.querySelector("button");if(f)f.focus({preventScroll:true});},0);
  else stage.focus({preventScroll:true});
}
$("bChap").onclick=()=>drawer(!$("drawer").classList.contains("on"));
$("dClose").onclick=()=>drawer(false);
function showBar(){
  document.body.classList.add("showbar");clearTimeout(barT);
  barT=setTimeout(()=>{
    const a=document.activeElement;
    if(a&&a.closest&&a.closest("#bar"))a.blur();
    document.body.classList.remove("showbar");
    if(!$("drawer").classList.contains("on"))stage.focus({preventScroll:true});
  },3600);
}
["pointermove","pointerdown","touchstart"].forEach(n=>addEventListener(n,showBar,{passive:true}));

/* ---------- tiempo ---------- */
function ui(){
  const p=Math.min(Math.max(v.currentTime,0),DUR);
  $("time").textContent=fmt(p)+" / "+fmt(DUR);
  if(!dragging)seek.value=Math.round(p/DUR*1000);
  $("meter").textContent="profundidad "+Math.round(p/DUR*DEEP)+" m / "+DEEP+" m";
  $("depthRead").textContent=Math.round(p/DUR*DEEP)+" m";
  markChap();
}
v.addEventListener("timeupdate",ui);
seek.addEventListener("pointerdown",()=>dragging=true);
seek.addEventListener("pointerup",()=>dragging=false);
seek.addEventListener("input",()=>{if(isFinite(v.duration))v.currentTime=seek.value/1000*v.duration;});
function skip(s){const d=isFinite(v.duration)?v.duration:DUR;v.currentTime=Math.max(0,Math.min(d-.5,v.currentTime+s));}
$("bB").onclick=()=>skip(-10);
$("bF").onclick=()=>skip(10);
$("bPlay").onclick=()=>{v.paused?v.play().catch(()=>{}):v.pause();};
v.addEventListener("play",()=>$("bPlay").textContent="❚❚");
v.addEventListener("pause",()=>$("bPlay").textContent="▶");
v.addEventListener("waiting",()=>$("spin").classList.add("on"));
v.addEventListener("seeking",()=>$("spin").classList.add("on"));
["playing","canplay","seeked"].forEach(n=>v.addEventListener(n,()=>{if(!v.seeking)$("spin").classList.remove("on");}));
$("bFs").onclick=()=>{
  if(document.fullscreenElement)document.exitFullscreen();
  else{const r=$("film").requestFullscreen;if(r)r.call($("film")).catch(()=>{});}
};

/* ---------- descenso ---------- */
const SRC="https://archive.org/download/satantango.-1994.-hungarian.-1080p.-blu-ray.-h-264.-aac-vxt/Satantango.1994.HUNGARIAN.1080p.BluRay.H264.AAC-VXT.mp4";
function fail(msg){
  $("spin").classList.remove("on");
  veil.classList.remove("off");
  $("veilT").textContent="El pozo no responde";
  $("veilP").textContent=msg;
  $("veilB").style.display="";
  $("veilB").focus({preventScroll:true});
}
$("veilB").onclick=()=>{$("veilB").style.display="none";veil.classList.add("off");v.load();v.play().catch(()=>{});};
v.addEventListener("error",()=>{if(v.getAttribute("src"))fail("Revisa la conexión y reintenta.");});

function descend(){
  if(started)return;started=true;
  document.body.classList.add("falling");
  $("go").blur();
  setTimeout(()=>{
    document.body.classList.add("film");
    v.src=SRC;v.load();
    boot();
    v.play().catch(()=>{});
    stage.focus({preventScroll:true});
    showBar();
  },760);
  setTimeout(()=>{veil.classList.add("off");},900);
  setTimeout(()=>{document.body.classList.remove("falling");},1900);
}
$("go").onclick=descend;

function back(){
  document.body.classList.remove("film");
  v.pause();v.removeAttribute("src");v.load();
  gen++;started=false;curChap=-1;
  document.body.classList.remove("falling");
  $("go").focus({preventScroll:true});
}
$("bBack").onclick=back;

/* ---------- teclado / mando ---------- */
const ok=e=>e.key==="Enter"||e.key===" "||e.key==="Select"||[13,23,32,66].includes(e.keyCode);
const esc=e=>e.key==="Escape"||e.key==="Backspace"||e.key==="GoBack"||[8,27,4,461].includes(e.keyCode);
addEventListener("keydown",e=>{
  lastKey=Date.now();
  const ae=document.activeElement;
  const inBar=!!(ae&&ae.closest&&ae.closest("#bar"));
  const inDrawer=!!(ae&&ae.closest&&ae.closest("#drawer"));
  if(!document.body.classList.contains("film")){
    if(ok(e)||e.key==="ArrowDown"){e.preventDefault();descend();}
    return;
  }
  if(esc(e)){e.preventDefault();inDrawer?drawer(false):back();return;}
  const k=(e.key||"").toLowerCase();
  if(!e.ctrlKey&&!e.metaKey&&!e.altKey){
    if(k==="c"){$("bCC").click();return;}
    if(k==="l"){drawer(!$("drawer").classList.contains("on"));return;}
    if(k==="f"){$("bFs").click();return;}
  }
  if(inDrawer){
    const bs=[...chap.children],i=bs.indexOf(ae);
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){
      e.preventDefault();
      const n=Math.max(0,Math.min(bs.length-1,i+(e.key==="ArrowDown"?1:-1)));
      if(bs[n])bs[n].focus();
    }else if(ok(e)&&bs.includes(ae)){e.preventDefault();ae.click();}
    return;
  }
  if(inBar){
    if(e.key==="ArrowLeft"||e.key==="ArrowRight"){
      if(ae===seek)return;e.preventDefault();
      const bs=[...bar.querySelectorAll("button")],i=bs.indexOf(ae);
      bs[Math.max(0,Math.min(bs.length-1,i+(e.key==="ArrowRight"?1:-1)))].focus();
    }else if(e.key==="ArrowUp"){e.preventDefault();ae.blur();stage.focus({preventScroll:true});}
    else if(ok(e)){e.preventDefault();if(ae&&ae.click)ae.click();}
    return;
  }
  showBar();
  if(e.key==="ArrowLeft"){e.preventDefault();skip(-10);}
  else if(e.key==="ArrowRight"){e.preventDefault();skip(10);}
  else if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();$("bPlay").focus({preventScroll:true});}
  else if(ok(e)){e.preventDefault();v.paused?v.play().catch(()=>{}):v.pause();}
},true);

/* ---------- arranque ---------- */
size();requestAnimationFrame(rain);
$("go").focus({preventScroll:true});
setInterval(()=>{if(document.body.classList.contains("film"))ui();},400);
</script>
